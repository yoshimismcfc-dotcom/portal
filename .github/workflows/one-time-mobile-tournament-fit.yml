name: one-time tournament mobile fit

on:
  push:
    paths:
      - ".github/workflows/one-time-mobile-tournament-fit.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply mobile fit
        run: python scripts/one-time-mobile-tournament-fit.py
      - name: Run all tests
        run: npm test
      - name: Commit production changes and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-mobile-tournament-fit.py .github/workflows/one-time-mobile-tournament-fit.yml
          git add tournament.html index.html sw.js package.json
          git commit -m "fix: fit tournament results to mobile width"
          git push origin HEAD:main
