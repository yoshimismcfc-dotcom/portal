name: one-time remove duplicate score url panel

on:
  push:
    paths:
      - ".github/workflows/one-time-remove-duplicate-score-url-panel.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove duplicate panel
        run: python scripts/one-time-remove-duplicate-score-url-panel.py
      - name: Run all tests
        run: npm test
      - name: Commit production changes and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-remove-duplicate-score-url-panel.py .github/workflows/one-time-remove-duplicate-score-url-panel.yml
          git add tournament.html scripts/tournament-result-ui.test.mjs index.html sw.js package.json
          git commit -m "fix: remove duplicate score URL panel"
          git push origin HEAD:main
