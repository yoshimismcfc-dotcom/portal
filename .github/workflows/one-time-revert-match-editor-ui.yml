name: one-time revert match editor ui

on:
  push:
    paths:
      - ".github/workflows/one-time-revert-match-editor-ui.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply revert
        run: python scripts/one-time-revert-match-editor-ui.py
      - name: Align restored-UI assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/tournament-result-ui.test.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  "⚽ 試合を追加・削除する",\n','  "⚽ 試合を追加・削除",\n')
          s=s.replace('assert.match(html,/<details class="match-editor-details" id="match-editor-details" open>/,"試合追加・削除一覧は初期状態で開いて表示してください");',
                      'assert.match(html,/<details class="match-editor-details" id="match-editor-details">/,"試合追加・削除一覧は必要なときに開ける折りたたみ表示にしてください");')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run all tests
        run: npm test
      - name: Commit production changes and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-revert-match-editor-ui.py .github/workflows/one-time-revert-match-editor-ui.yml
          git add tournament.html index.html sw.js package.json scripts/tournament-result-ui.test.mjs
          git commit -m "fix: restore previous additional match editor UI"
          git push origin HEAD:main
