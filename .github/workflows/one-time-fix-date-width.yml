name: one-time fix date width
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-date-width.yml'
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/one-time-fix-date-width.py
      - name: Run tests
        run: npm test
      - name: Commit production changes and remove one-time files
        run: |
          rm scripts/one-time-fix-date-width.py .github/workflows/one-time-fix-date-width.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep tournament date fields inside mobile width"
          git push
