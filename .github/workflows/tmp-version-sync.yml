name: tmp-version-sync

on:
  push:
    branches:
      - fix/pwa-version-sync-20260816

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-version-sync-20260816
      - name: Sync tournament app version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tournament.html')
          s = p.read_text(encoding='utf-8')
          old = 'name="app-version" content="20260811-39"'
          new = 'name="app-version" content="20260816-41"'
          if old not in s:
              raise SystemExit('expected tournament app-version not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit synced version
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournament.html
          git commit -m "tournament versionをPWA版と同期"
          git push origin HEAD:fix/pwa-version-sync-20260816
