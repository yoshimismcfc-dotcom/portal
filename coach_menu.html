<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>練習メニュー｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <style>
    .url-item{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r8);padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .url-label{font-size:.88rem;font-weight:700;color:#fff;flex:1;min-width:0}
    .url-link{font-size:.72rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
    .url-actions{display:flex;gap:6px;flex-shrink:0}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:480px){.fg2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="coach.html">← コーチ専用に戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">🔗</div>
    <div><div class="hero-title">練習メニュー</div>
      <div class="hero-sub">URLを登録してワンタップで開けます。</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">＋ URLを追加</div>
    <div class="fg2">
      <div class="form-group" style="margin:0">
        <label class="form-label">ラベル</label>
        <input class="form-control" id="url-label" placeholder="例: 4年生 パス練習">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">URL</label>
        <input class="form-control" id="url-href" type="url" placeholder="https://...">
      </div>
    </div>
    <button class="btn btn-primary" onclick="addUrl()" style="width:100%;margin-top:10px">＋ 追加する</button>
  </div>

  <div style="margin-top:14px">
    <div id="url-list">
      <p style="color:var(--ink-3);font-size:.84rem;text-align:center;padding:24px">URLを追加するとここに表示されます。</p>
    </div>
  </div>

  <a class="btn btn-outline" href="coach.html" style="display:flex;justify-content:center;margin-top:16px">← コーチ専用に戻る</a>
</main>
<footer class="site-footer">YOSHIMI SMC FC — SMART PORTAL</footer>
<script>
var KEY="smc_menu_urls_v1";
var _data=[];

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];}}
function save(d){_data=d;localStorage.setItem(KEY,JSON.stringify(d));dbSave("practice_menu",d,KEY,null);}

function render(){
  var list=document.getElementById("url-list");
  if(!_data.length){
    list.innerHTML='<p style="color:var(--ink-3);font-size:.84rem;text-align:center;padding:24px">URLを追加するとここに表示されます。</p>';
    return;
  }
  list.innerHTML=_data.map(function(u){
    return '<div class="url-item">'
      +'<div style="flex:1;min-width:0">'
      +'<div class="url-label">'+escH(u.label)+'</div>'
      +'<div class="url-link">'+escH(u.href)+'</div>'
      +'</div>'
      +'<div class="url-actions">'
      +'<a class="btn btn-primary btn-sm" href="'+escH(u.href)+'" target="_blank" rel="noopener">🔗 開く</a>'
      +'<button class="btn btn-outline btn-sm" onclick="del('+u.id+')" style="color:var(--red);border-color:rgba(255,68,102,.4)">🗑</button>'
      +'</div>'
      +'</div>';
  }).join("");
}

function addUrl(){
  var label=document.getElementById("url-label").value.trim();
  var href=document.getElementById("url-href").value.trim();
  if(!label){alert("ラベルを入力してください");return;}
  if(!href||!href.startsWith("http")){alert("URLを正しく入力してください（https://...）");return;}
  var d=load();
  d.push({id:Date.now(),label:label,href:href});
  save(d);_data=d;render();
  document.getElementById("url-label").value="";
  document.getElementById("url-href").value="";
}

function del(id){
  if(!confirm("削除しますか？"))return;
  var d=load().filter(function(u){return u.id!==id;});
  save(d);_data=d;render();
}

function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

dbListen("practice_menu",function(val){
  _data=Array.isArray(val)&&val.length?val:load();
  render();
},KEY,[]);
window.addEventListener("DOMContentLoaded",function(){_data=load();render();});
</script>
</body>
</html>
