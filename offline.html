<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#003087">
  <title>オフライン｜吉見SMC FC</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071126;color:#e8f4ff;padding:24px}
    main{width:min(460px,100%);text-align:center;background:#10243d;border:1px solid #284867;border-radius:16px;padding:28px;box-shadow:0 18px 44px rgba(0,0,0,.25)}
    img{width:76px;height:76px;border-radius:50%;object-fit:cover;margin-bottom:12px}
    h1{font-size:1.25rem;margin:0 0 10px}
    p{font-size:.9rem;line-height:1.8;color:#b8d7ee;margin:0 0 20px}
    nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    a,button{appearance:none;border:1px solid #5f86aa;border-radius:8px;background:transparent;color:#fff;font:inherit;font-weight:700;padding:10px 16px;text-decoration:none;cursor:pointer}
    button{background:#f36c21;border-color:#f36c21}
  </style>
</head>
<body>
  <main>
    <img src="assets/yoshimi-smc-logo.jpeg" alt="吉見SMC FC">
    <h1>現在オフラインです</h1>
    <p>事前に保存されたページは引き続き利用できます。通信が戻ったら、もう一度お試しください。</p>
    <nav><button type="button" onclick="location.reload()">再読み込み</button><a href="index.html">ホームへ</a></nav>
  </main>
</body>
</html>
