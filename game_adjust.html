<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>試合調整｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    /* ============================================================
       試合調整 2026年最高品質版
       - タップ領域44px以上（Apple HIG準拠）
       - 充足日程の視覚強調・ゼブラストライプ
       - アニメーション・アクセシビリティ・印刷最適化
       ============================================================ */
    .adj-wrap{
      overflow:auto; max-height:66vh;
      border:1px solid var(--line-2); border-radius:var(--r12);
      scrollbar-width:thin; scrollbar-color:rgba(255,107,43,.6) rgba(0,0,0,.4);
      overscroll-behavior:contain;
    }
    .adj-wrap::-webkit-scrollbar{height:7px;width:7px}
    .adj-wrap::-webkit-scrollbar-track{background:rgba(0,0,0,.4)}
    .adj-wrap::-webkit-scrollbar-thumb{background:rgba(255,107,43,.6);border-radius:4px}
    .adj-table{border-collapse:separate;border-spacing:0;font-size:.82rem;width:max-content;min-width:100%}
    .adj-table th,.adj-table td{
      border-right:1px solid var(--line); border-bottom:1px solid var(--line);
      padding:8px 10px; white-space:nowrap; vertical-align:middle;
    }
    /* ゼブラストライプ（視認性向上） */
    tbody tr:nth-child(even):not(.tr-count):not(.tr-nokori):not(.tr-biko) td{background:rgba(255,255,255,.02)}
    /* 固定ヘッダー行 */
    .adj-table thead tr:first-child th{
      position:sticky;top:0;z-index:30;background:#071523;
      border-bottom:2px solid var(--line-2);
    }
    .adj-table thead tr:nth-child(2) th{
      position:sticky;top:41px;z-index:29;background:#050f1a;
      border-bottom:1px solid var(--line-2);
    }
    /* 固定左列 */
    .col-fixed{
      position:sticky;left:0;z-index:20;
      background:#0a1f30; min-width:118px; max-width:170px;
      font-weight:700; color:#fff;
      border-right:2px solid rgba(0,212,255,.35) !important;
      white-space:normal !important; line-height:1.3;
    }
    thead tr:first-child .col-fixed{z-index:40;background:#071523}
    thead tr:nth-child(2) .col-fixed{z-index:39;background:#050f1a}
    tbody tr:hover td{background:rgba(0,212,255,.05)}
    tbody tr:hover .col-fixed{background:#0e2a3e}
    /* ヘッダーセル */
    .th-date{text-align:center;color:#fff;font-size:.8rem;font-weight:900;min-width:96px;letter-spacing:.03em}
    .th-date.is-full{color:#00ff88}
    .date-tournament-name{display:block;margin-top:4px;color:#73dcff;font-size:.68rem;font-weight:900;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
    body[data-theme="light"] .date-tournament-name{color:#075d84}
    .th-cat{text-align:center;color:#a8d4f0;font-size:.68rem;font-weight:400;cursor:pointer;transition:.15s}
    .th-cat:hover{background:rgba(0,212,255,.08)}
    .th-cat:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
    .date-note{display:block;margin-top:7px;padding:6px 7px;border-radius:8px;background:rgba(106,172,204,.12);color:#d9efff;font-size:.64rem;font-weight:700;line-height:1.45;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
    body[data-theme="light"] .date-note{background:#dceaf4;color:#173d5a}
    .date-related-links{display:grid;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(106,172,204,.35)}
    .date-related-link{display:flex;align-items:center;justify-content:center;min-height:32px;padding:5px 6px;border:1px solid rgba(0,212,255,.42);border-radius:8px;background:rgba(0,122,180,.16);color:#bfeeff!important;font-size:.62rem;font-weight:900;line-height:1.25;text-decoration:none;white-space:normal}
    .date-related-link:hover,.date-related-link:focus-visible{background:rgba(0,212,255,.24);border-color:#00d4ff;outline:none}
    body[data-theme="light"] .date-related-link{background:#e5f6fc;color:#075d84!important;border-color:#1689b4}
    .th-label{color:var(--cyan);font-size:.68rem;font-weight:900;letter-spacing:.08em}
    .th-tantou{text-align:center;min-width:74px}
    /* 充足バッジ */
    .full-badge{display:inline-block;background:rgba(0,255,136,.18);color:#00ff88;font-size:.58rem;font-weight:900;padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:middle;animation:pop .3s ease}
    /* ステータスボタン：44px以上のタップ領域（HIG準拠） */
    .s-ok   {background:rgba(0,255,136,.2); color:#00ff88;border:1px solid rgba(0,255,136,.6)}
    .s-ng   {background:rgba(255,68,102,.2);color:#ff8888;border:1px solid rgba(255,68,102,.6)}
    .s-kakun{background:rgba(255,204,0,.2); color:#ffee44;border:1px solid rgba(255,204,0,.6)}
    .s-none {background:rgba(255,255,255,.07);color:#8ac8e8;border:1px solid rgba(0,212,255,.25)}
    .status-btn{
      border-radius:8px;padding:10px 12px;font:inherit;font-size:.82rem;font-weight:900;
      cursor:pointer;display:inline-block;min-width:64px;min-height:40px;text-align:center;
      transition:transform .12s,filter .12s;user-select:none;-webkit-tap-highlight-color:transparent;
    }
    .status-btn:hover{filter:brightness(1.25)}
    .status-btn:active{transform:scale(.92);filter:brightness(1.5)}
    .status-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
    .status-btn.just-changed{animation:pop .28s ease}
    @keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
    /* 集計行 */
    .tr-count .col-fixed{background:#060e18;color:var(--cyan);font-size:.72rem}
    .tr-count td{background:rgba(255,107,43,.09);color:#ffaa77;font-weight:900;font-size:.8rem;text-align:center;transition:background .3s}
    .tr-count td.is-full{background:rgba(0,255,136,.12);color:#00ff88}
    .tr-nokori .col-fixed{background:#060e18;color:var(--cyan);font-size:.72rem}
    .tr-nokori td{background:rgba(0,212,255,.07);font-weight:900;font-size:.78rem;text-align:center}
    .tr-biko .col-fixed{background:#060e18;color:#8ac8e8;font-size:.7rem}
    .tr-biko td{background:rgba(255,204,0,.06);font-size:.72rem;padding:4px 6px}
    .biko-input{
      width:100%;background:transparent;border:none;color:#ffee66;
      font:inherit;font-size:.74rem;resize:none;outline:none;padding:6px 4px;min-width:88px;min-height:34px;
    }
    .biko-input:focus{background:rgba(255,204,0,.12);border-radius:4px}
    /* 削除ボタン（タップ領域確保） */
    .del-date-btn{
      background:none;border:none;color:rgba(255,100,120,.6);
      cursor:pointer;font-size:.8rem;padding:6px 8px;border-radius:6px;
      margin-left:2px;transition:.15s;vertical-align:middle;min-width:30px;min-height:30px;
    }
    .del-date-btn:hover{color:#ff4466;background:rgba(255,68,102,.2)}
    .del-team-btn{
      background:none;border:none;color:rgba(255,100,120,.5);
      cursor:pointer;font-size:.85rem;padding:6px 8px;border-radius:6px;transition:.15s;min-width:30px;min-height:30px;
    }
    .del-team-btn:hover{color:#ff4466;background:rgba(255,68,102,.2)}
    /* 担当者インライン編集 */
    .tantou-input{
      background:transparent;border:none;color:#a8d4f0;
      font:inherit;font-size:.78rem;text-align:center;width:100%;outline:none;padding:8px 0;min-height:36px;
    }
    .tantou-input:focus{color:#fff;background:rgba(255,255,255,.07);border-radius:4px}
    /* 操作バー・凡例 */
    .ctrl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:.76rem;align-items:center;color:#8ac8e8}
    .legend .status-btn{min-height:auto;min-width:52px;padding:4px 8px;cursor:default}
    /* Undo/Redoボタン */
    .undo-btn{
      background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:#8ac8e8;
      border-radius:var(--r8);padding:7px 12px;font:inherit;font-size:.78rem;font-weight:900;
      cursor:pointer;transition:.15s;min-height:36px;
    }
    .undo-btn:hover:not(:disabled){background:rgba(0,212,255,.12);color:#fff}
    .undo-btn:disabled{opacity:.3;cursor:default}
    /* 自動保存インジケーター */
    #save-msg{font-size:.76rem;color:#00ff88;transition:opacity .3s;min-height:1.2em}
    /* モーダル */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:200;backdrop-filter:blur(6px)}
    .modal-bg.open{display:grid}
    .modal{
      background:var(--surface-lt);border:1px solid var(--line-2);
      border-radius:var(--r16);padding:24px;width:min(400px,92vw);
      max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;
      box-shadow:var(--shadow-lg),0 0 40px rgba(0,212,255,.15);
      animation:modalIn .22s ease;
    }
    @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
    .modal h3{font-size:1rem;font-weight:900;margin-bottom:16px;color:#fff;letter-spacing:.05em}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
    /* ===== 印刷最適化 ===== */
    @media print{
      .site-header,.site-footer,.back-btn,.ctrl-bar,.legend,.hero-band,p{display:none !important}
      .adj-wrap{max-height:none;overflow:visible;border:none}
      body{background:#fff !important;color:#000 !important}
      .adj-table{font-size:8pt}
      .adj-table th,.adj-table td{border:1px solid #999 !important;background:#fff !important;color:#000 !important;padding:4px 6px}
      .col-fixed{position:static;background:#eee !important;color:#000 !important}
      .status-btn{border:1px solid #666;background:#fff;color:#000;padding:2px 6px;min-height:auto;min-width:auto}
      .del-date-btn,.del-team-btn{display:none}
      .full-badge{border:1px solid #090;color:#090;background:#fff}
    }
    /* モーション低減設定の尊重（アクセシビリティ） */
    @media (prefers-reduced-motion: reduce){
      *{animation:none !important;transition:none !important}
    }
  </style>
</head>
<body>
<header class="site-header"></header>
<main class="page-wrap">
  <a class="back-btn" href="coach.html">運営メニューに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📊</div>
    <div>
      <div class="hero-title">試合調整</div>
      <div class="hero-sub">タップでOK/NG/確認中を切り替え。<strong style="color:#00ff88">変更は自動保存</strong>されクラウドで全端末に同期されます。</div>
    </div>
  </div>

  <div class="ctrl-bar" role="toolbar" aria-label="操作バー">
    <button class="btn btn-primary btn-sm" onclick="openModal('modal-team')" aria-label="チームを追加">＋ チーム追加</button>
    <button class="btn btn-cyan btn-sm" onclick="openModal('modal-date')" aria-label="日程を追加">＋ 日程追加</button>
    <button class="undo-btn" id="undo-btn" onclick="undo()" disabled aria-label="元に戻す" title="元に戻す">↶ 戻す</button>
    <button class="undo-btn" id="redo-btn" onclick="redo()" disabled aria-label="やり直す" title="やり直す">↷ 進む</button>
    <button class="btn-line-copy sm" onclick="copyAdjList()" aria-label="調整状況をLINE用にコピー">📋 LINEコピー</button>
    <button class="btn btn-outline btn-sm no-print" onclick="smcPrint({orientation:'landscape',target:'game-adjust'})" aria-label="印刷">🖨 印刷</button>
    <span id="save-msg" role="status" aria-live="polite"></span>
  </div>
  <div class="legend" aria-hidden="true">
    タップで切替 →
    <span class="status-btn s-ok">OK</span>参加可
    <span class="status-btn s-ng">NG</span>不可
    <span class="status-btn s-kakun">確認中</span>返答待ち
    <span class="status-btn s-none">－</span>未打診
  </div>

  <div class="adj-wrap">
    <table class="adj-table" id="adj-table" aria-label="試合調整表"></table>
  </div>
  <p style="font-size:.7rem;color:#6aaccc;margin-top:8px">← 横スクロール可。チーム列と日付行は固定。備考・担当者はタップで直接編集（自動保存）。カテゴリー欄タップで日程を編集できます。</p>

  <div style="margin-top:14px">
    <button class="btn btn-outline btn-sm" style="color:var(--red);border-color:rgba(255,68,102,.35);font-size:.72rem" onclick="resetData()">↩ 初期データにリセット（取扱注意）</button>
  </div>
</main>

<!-- チーム追加モーダル -->
<div class="modal-bg" id="modal-team" role="dialog" aria-modal="true" aria-labelledby="mt-title">
  <div class="modal">
    <h3 id="mt-title">⚽ チームを追加</h3>
    <div class="form-group"><label class="form-label" for="new-team-name">チーム名</label>
      <input class="form-control" id="new-team-name" placeholder="例：川越FC" autocomplete="off"></div>
    <div class="form-group"><label class="form-label" for="new-team-tantou">担当者</label>
      <input class="form-control" id="new-team-tantou" placeholder="例：武部" autocomplete="off"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('modal-team')">キャンセル</button>
      <button class="btn btn-primary" onclick="addTeam()">追加</button>
    </div>
  </div>
</div>

<!-- 日程追加モーダル -->
<div class="modal-bg" id="modal-date" role="dialog" aria-modal="true" aria-labelledby="md-title">
  <div class="modal">
    <h3 id="md-title">📅 日程を追加</h3>
    <div class="form-group"><label class="form-label" for="new-date">日付</label>
      <input class="form-control" id="new-date" type="date"></div>
    <div class="form-group"><label class="form-label" for="new-tournament-name">大会名</label>
      <input class="form-control" id="new-tournament-name" maxlength="100" placeholder="例：吉見カップ、練習試合" autocomplete="off"></div>
    <div class="form-group"><label class="form-label" for="new-cat">カテゴリー</label>
      <input class="form-control" id="new-cat" placeholder="例：U12 4チーム" autocomplete="off"></div>
    <div class="form-group"><label class="form-label" for="new-target">目標チーム数</label>
      <input class="form-control" id="new-target" type="number" value="3" min="0" inputmode="numeric"></div>
    <div class="form-group"><label class="form-label" for="new-note">備考</label>
      <textarea class="form-control" id="new-note" rows="3" maxlength="500" placeholder="例：会場、集合時間、連絡事項など"></textarea></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('modal-date')">キャンセル</button>
      <button class="btn btn-cyan" onclick="addDate()">追加</button>
    </div>
  </div>
</div>

<!-- 日程編集モーダル -->
<div class="modal-bg" id="modal-edit-date" role="dialog" aria-modal="true" aria-labelledby="me-title">
  <div class="modal">
    <h3 id="me-title">📅 日程を編集</h3>
    <div class="form-group"><label class="form-label" for="edit-date">日付</label>
      <input class="form-control" id="edit-date" type="date"></div>
    <div class="form-group"><label class="form-label" for="edit-tournament-name">大会名</label>
      <input class="form-control" id="edit-tournament-name" maxlength="100" placeholder="例：吉見カップ、練習試合" autocomplete="off"></div>
    <div class="form-group"><label class="form-label" for="edit-cat">カテゴリー</label>
      <input class="form-control" id="edit-cat" placeholder="例：U12 4チーム" autocomplete="off"></div>
    <div class="form-group"><label class="form-label" for="edit-target">目標チーム数</label>
      <input class="form-control" id="edit-target" type="number" min="0" inputmode="numeric"></div>
    <div class="form-group"><label class="form-label" for="edit-note">備考</label>
      <textarea class="form-control" id="edit-note" rows="3" maxlength="500" placeholder="例：会場、集合時間、連絡事項など"></textarea></div>
    <div class="modal-btns" style="flex-wrap:wrap">
      <button class="btn btn-outline" style="color:var(--red);border-color:rgba(255,68,102,.4)" onclick="deleteEditDate()">🗑 削除</button>
      <button class="btn btn-outline" onclick="closeModal('modal-edit-date')">キャンセル</button>
      <button class="btn btn-cyan" onclick="saveEditDate()">💾 保存</button>
    </div>
  </div>
</div>

<footer class="site-footer"></footer>
<script>
/* ============================================================
   試合調整 2026年最高品質版 メインスクリプト
   [設計方針]
   - XSS完全対策：全ユーザー入力をesc()でエスケープ
   - イベントデリゲーション：動的要素のonclick文字列連結を排除
   - 自動保存：全変更が0.8秒デバウンスでクラウド保存
   - Undo/Redo：最大30手のスナップショット
   - Firebaseエコー抑制：自分の保存の反射で再描画しない
     （入力中のフォーカス飛び・点滅を根絶）
   ============================================================ */

const KEY = "smc_game_adj_v1";
const INIT = {
  dates:[
    {id:"d1",label:"5/10（日）",  cat:"U9/SMC 2チーム 全4チーム", target:2},
    {id:"d2",label:"5/30（土）",  cat:"U12 4チーム",               target:3},
    {id:"d3",label:"6/6（土）",   cat:"U12 4チーム",               target:3},
    {id:"d4",label:"6/6（土）U9", cat:"U9 4チーム",                target:3},
    {id:"d5",label:"7/4（土）",   cat:"U9/SMC 2チーム 全8チーム",  target:6},
    {id:"d6",label:"8/30（日）",  cat:"U12 4チーム",               target:3},
    {id:"d7",label:"8/30（日）U9",cat:"U9 4チーム",                target:3},
  ],
  teams:[
    {id:"t01",name:"田間宮",           tantou:"",statuses:{d1:"NG",d2:"－",d3:"－",d4:"OK",d5:"NG",d6:"－",d7:"－"}},
    {id:"t02",name:"ネクサス",         tantou:"",statuses:{d1:"OK",d2:"OK",d3:"－",d4:"－",d5:"NG",d6:"－",d7:"－"}},
    {id:"t03",name:"鴻巣ドルフィンズ", tantou:"",statuses:{d1:"－",d2:"NG",d3:"OK",d4:"NG",d5:"OK",d6:"－",d7:"－"}},
    {id:"t04",name:"熊谷東",           tantou:"",statuses:{d1:"NG",d2:"確認中",d3:"NG",d4:"NG",d5:"NG",d6:"－",d7:"－"}},
    {id:"t05",name:"川里",             tantou:"",statuses:{d1:"－",d2:"－",d3:"－",d4:"NG",d5:"OK",d6:"－",d7:"－"}},
    {id:"t06",name:"滑川",             tantou:"",statuses:{d1:"OK",d2:"－",d3:"－",d4:"－",d5:"OK",d6:"NG",d7:"－"}},
    {id:"t07",name:"川越 笠幡",        tantou:"",statuses:{d1:"－",d2:"－",d3:"－",d4:"－",d5:"NG",d6:"－",d7:"－"}},
    {id:"t08",name:"川越 岡田",        tantou:"",statuses:{d1:"－",d2:"－",d3:"NG",d4:"OK",d5:"NG",d6:"－",d7:"－"}},
    {id:"t09",name:"川越イーグルF",    tantou:"",statuses:{d1:"－",d2:"－",d3:"OK",d4:"－",d5:"NG",d6:"－",d7:"－"}},
    {id:"t10",name:"熊谷リリーズ",     tantou:"",statuses:{d1:"－",d2:"－",d3:"－",d4:"OK",d5:"－",d6:"－",d7:"－"}},
    {id:"t11",name:"唐子",             tantou:"",statuses:{d1:"－",d2:"－",d3:"NG",d4:"－",d5:"NG",d6:"－",d7:"－"}},
    {id:"t12",name:"川越 芳野",        tantou:"",statuses:{d1:"－",d2:"－",d3:"NG",d4:"－",d5:"－",d6:"－",d7:"－"}},
    {id:"t13",name:"本庄ホッパーズ",   tantou:"",statuses:{d1:"－",d2:"－",d3:"OK",d4:"－",d5:"OK",d6:"－",d7:"－"}},
    {id:"t14",name:"川島",             tantou:"",statuses:{d1:"－",d2:"－",d3:"－",d4:"－",d5:"OK",d6:"－",d7:"－"}},
  ],
  備考:{d2:"中止（若草まつり）",d5:"川越U9 大会不可"}
};

/* ---------- XSS対策：HTMLエスケープ ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- 初期データ読込（localStorage→INIT） ---------- */
function loadData(){
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      var parsed = JSON.parse(s);
      if(parsed && parsed.dates && parsed.teams) return parsed;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(INIT));
}
let data = loadData();

/* ---------- Firebase同期（正規化・自動復元・エコー抑制） ---------- */
let _lastSavedStr = null; // 自分が最後に保存したデータ（エコー抑制用）

// Firebaseは空配列・空オブジェクトを削除し、配列をオブジェクトで返すことがあるため正規化
function normalizeData(d){
  if(!d || typeof d !== "object") return null;
  function toArray(x){
    if(Array.isArray(x)) return x.filter(Boolean);
    if(x && typeof x === "object") return Object.keys(x).sort().map(function(k){return x[k];}).filter(Boolean);
    return [];
  }
  var dates = toArray(d.dates);
  var teams = toArray(d.teams).map(function(t){
    t.statuses = (t.statuses && typeof t.statuses === "object") ? t.statuses : {};
    return t;
  });
  if(!dates.length || !teams.length) return null;
  return { dates: dates, teams: teams, 備考: (d["備考"] && typeof d["備考"]==="object") ? d["備考"] : {} };
}

dbListen("game_adjust", function(val){
  var normalized = normalizeData(val);

  // クラウドが空・壊れている → ローカル→INITの順で自動復元
  if(!normalized){
    var restored = null;
    try {
      var localRaw = localStorage.getItem(KEY);
      if(localRaw) restored = normalizeData(JSON.parse(localRaw));
    } catch(e){}
    if(!restored) restored = normalizeData(JSON.parse(JSON.stringify(INIT)));
    data = restored;
    renderTable();
    persist();
    flash("♻️ データを復元しました");
    return;
  }

  // クラウドがINITと同一で、この端末により新しいデータがあれば端末側を復元
  try {
    var initStr = JSON.stringify(normalizeData(JSON.parse(JSON.stringify(INIT))));
    if(JSON.stringify(normalized) === initStr){
      var lr = localStorage.getItem(KEY);
      if(lr){
        var ld = normalizeData(JSON.parse(lr));
        if(ld && JSON.stringify(ld) !== initStr){
          data = ld;
          renderTable();
          persist();
          flash("♻️ この端末のデータをクラウドに復元しました");
          return;
        }
      }
    }
  } catch(e){ console.warn("restore check error:", e); }

  // 【エコー抑制】自分が保存した内容の反射なら再描画しない
  // （入力中のフォーカス飛び・画面点滅を防ぐ）
  var incoming = JSON.stringify(normalized);
  if(incoming === _lastSavedStr) return;

  data = normalized;
  renderTable();
}, KEY, null);

/* ---------- 保存（自動保存・デバウンス） ---------- */
var _saveTimer = null;

// 即時保存（構造変更時：チーム/日程の追加削除・状態変更）
function persist(showMsg){
  collectDOMChanges();
  _lastSavedStr = JSON.stringify(normalizeData(JSON.parse(JSON.stringify(data))));
  dbSave("game_adjust", data, KEY, function(){
    if(showMsg !== false) flash("💾 自動保存しました");
  });
}

// デバウンス保存（テキスト入力時：備考・担当者）
function persistDebounced(){
  clearTimeout(_saveTimer);
  flash("✏️ 入力中…", "#8ac8e8");
  _saveTimer = setTimeout(function(){ persist(); }, 800);
}

// DOM上の編集中テキストをdataに反映
function collectDOMChanges() {
  document.querySelectorAll(".biko-input").forEach(function(el) {
    if (!data.備考) data.備考 = {};
    var v = el.value.trim();
    if (v) data.備考[el.dataset.did] = v;

/* ---------- Undo / Redo（最大30手） ---------- */
var _undoStack = [], _redoStack = [];
function snapshot(){
  collectDOMChanges();
  _undoStack.push(JSON.stringify(data));
  if(_undoStack.length > 30) _undoStack.shift();
  _redoStack = [];
  updateUndoButtons();
}
function undo(){
  if(!_undoStack.length) return;
  collectDOMChanges();
  _redoStack.push(JSON.stringify(data));
  data = JSON.parse(_undoStack.pop());
  renderTable(); persist(false);
  flash("↶ 元に戻しました", "#8ac8e8");
  updateUndoButtons();
}
function redo(){
  if(!_redoStack.length) return;
  collectDOMChanges();
  _undoStack.push(JSON.stringify(data));
  data = JSON.parse(_redoStack.pop());
  renderTable(); persist(false);
  flash("↷ やり直しました", "#8ac8e8");
  updateUndoButtons();
}
function updateUndoButtons(){
  document.getElementById("undo-btn").disabled = !_undoStack.length;
  document.getElementById("redo-btn").disabled = !_redoStack.length;
}

/* ---------- ステータス切替 ---------- */
var CYCLE = ["－","OK","NG","確認中"];
var SCLS = {"OK":"s-ok","NG":"s-ng","確認中":"s-kakun","－":"s-none"};

function cycleStatus(tid, did, btnEl) {
  var t = data.teams.find(function(t){ return t.id === tid; });
  if (!t) return;
  snapshot();
  var cur = (t.statuses || {})[did] || "－";
  var next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
  if(!t.statuses) t.statuses = {};
  t.statuses[did] = next;

  // 【高速化】該当ボタンと集計行だけ部分更新（全再描画しない）
  if(btnEl){
    btnEl.textContent = next;
    btnEl.className = "status-btn just-changed " + (SCLS[next] || "s-none");
    setTimeout(function(){ btnEl.classList.remove("just-changed"); }, 300);
    updateCounts();
  } else {
    renderTable();
  }
  persist(false);
  flash("💾 保存: " + esc(t.name) + " → " + next);
}

/* 集計行（参加数・残り・充足バッジ）だけを再計算して更新 */
function updateCounts(){
  data.dates.forEach(function(d, i){
    var cnt = data.teams.filter(function(t){ return ((t.statuses||{})[d.id]||"－")==="OK"; }).length;
    var n = d.target - cnt;
    var cEl = document.getElementById("cnt-" + d.id);
    var rEl = document.getElementById("rem-" + d.id);
    var hEl = document.getElementById("hdr-" + d.id);
    if(cEl){
      cEl.innerHTML = cnt + "<span style='font-size:.65rem;color:#8ac8e8'> /" + d.target + "</span>";
      cEl.classList.toggle("is-full", n <= 0);
    }
    if(rEl){
      var col = n <= 0 ? "#00ff88" : n === 1 ? "#ffee44" : "#ff8888";
      rEl.style.color = col;
      rEl.textContent = n <= 0 ? "✅ 充足" : n;
    }
    if(hEl){
      hEl.classList.toggle("is-full", n <= 0);
      var badge = hEl.querySelector(".full-badge");
      if(n <= 0 && !badge){
        var b = document.createElement("span");
        b.className = "full-badge"; b.textContent = "✅";
        hEl.appendChild(b);
      } else if(n > 0 && badge){ badge.remove(); }
    }
  });
}

/* ---------- 連携用の日付（既存データは4月始まりの年度から補完） ---------- */
function linkedDateIso(d) {
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d.dateIso || "")) return d.dateIso;
  var match = String((d && d.label) || "").normalize("NFKC").match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if (!match) return "";
  var month = Number(match[1]), day = Number(match[2]);
  var now = new Date(), currentMonth = now.getMonth() + 1;
  var fiscalStartYear = currentMonth >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  var year = month >= 4 ? fiscalStartYear : fiscalStartYear + 1;
  return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
}

function addDate() {
  var dateVal = document.getElementById("new-date").value;

  var cat = document.getElementById("new-cat").value.trim() || "未設定";
  var targetVal = document.getElementById("new-target").value;
  var target = targetVal === "" ? 1 : Math.max(0, Number(targetVal)); // 0も有効値として扱う
  var note = document.getElementById("new-note").value.trim();
  if (!dateVal) { alert("日付を入力してください"); return; }
  snapshot();
  var d = new Date(dateVal);
  var label = (d.getMonth()+1) + "/" + d.getDate() + "（" + ["日","月","火","水","木","金","土"][d.getDay()] + "）";
  var id = "d" + Date.now();
  data.dates.push({id:id, dateIso:dateVal, label:label, tournamentName:tournamentName, cat:cat, target:target});
  if (!data.備考) data.備考 = {};
  if (note) data.備考[id] = note;
  data.teams.forEach(function(t){ if(!t.statuses) t.statuses = {}; t.statuses[id] = "－"; });
  persist(); renderTable(); closeModal("modal-date");
  document.getElementById("new-date").value = "";
  document.getElementById("new-tournament-name").value = "";
  document.getElementById("new-cat").value = "";
  document.getElementById("new-note").value = "";
}

/* ---------- 初期描画 ---------- */
renderTable();
</script>
