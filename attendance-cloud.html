<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>試合の出欠・コメント｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="attendance-cloud.css?v=20261121-25">
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
</head>
<body>
<header class="site-header"></header>
<main class="page-wrap cloud-attendance">
  <a class="back-btn" href="attendance.html">出欠確認・参加案内へ戻る</a>
  <h1 id="cloud-page-title">試合の出欠・コメント</h1>
  <p id="cloud-status" role="status" aria-live="polite">試合の出欠を読み込んでいます…</p>
  <section id="public-notices" class="panel" hidden>
    <p id="public-notice-status" role="status"></p>
    <div id="public-notice-list" class="cloud-stack"></div>
  </section>
  <button id="open-cloud-login" type="button" class="secondary-button" hidden>コーチ・登録済みの方</button>
  <form id="cloud-login" class="panel cloud-stack" hidden>
    <h2>ログイン</h2>
    <label>メールアドレス <input required type="email" name="email" autocomplete="username"></label>
    <label>パスワード <input required type="password" name="password" autocomplete="current-password"></label>
    <button class="primary-button" type="submit">ログイン</button>
  </form>
  <button id="cloud-logout" type="button" class="secondary-button" hidden>ログアウト</button>
  <button id="cloud-connect" type="button" class="secondary-button" hidden>接続をやり直す</button>
  <section id="cloud-workspace" hidden>
    <div id="cloud-tabs" class="cloud-tabs" aria-label="表示">
      <button id="show-entry" type="button" aria-pressed="true">出欠を入力</button>
      <button id="show-review" type="button" aria-pressed="false" hidden>試合の出欠・連絡一覧</button>
    </div>
    <div class="panel cloud-stack">
      <label id="person-field">回答する人 <select id="cloud-person"></select></label>
      <label id="event-field">日程・試合 <select id="cloud-event"></select></label>
      <div id="guest-heading" hidden><h2 id="guest-title"></h2><p id="guest-person"></p></div>
      <a id="cloud-calendar" class="back-btn" target="_blank" rel="noopener" hidden>カレンダーで予定を開く</a>
    </div>
    <form id="cloud-answer" class="panel cloud-stack" hidden>
      <p id="cloud-review-notice" class="cloud-review-notice" hidden>要確認 — 練習に○で回答済みです。試合の出欠を入力してください。</p>
      <fieldset id="cloud-choices"><legend>出欠</legend><div id="cloud-answer-options" class="cloud-answer-options"></div></fieldset>
      <details id="cloud-contact">
        <summary>連絡事項（任意）</summary>
        <div class="cloud-stack">
          <div class="cloud-contact-choice"><label><input type="checkbox" name="ride"> 送迎希望</label>
            <label class="cloud-contact-detail">送迎の区間 <select name="rideTrip"><option value="">選択（任意）</option><option>行きのみ</option><option>帰りのみ</option><option>往復</option></select></label></div>
          <div class="cloud-contact-choice"><label><input type="checkbox" name="early"> 早退</label>
            <label class="cloud-contact-detail">早退の予定時刻（任意） <input type="time" name="earlyTime"></label></div>
          <div class="cloud-contact-choice"><label><input type="checkbox" name="late"> 遅刻・途中参加</label>
            <label class="cloud-contact-detail">到着の予定時刻（任意） <input type="time" name="lateTime"></label></div>
          <label><input type="checkbox" name="other"> その他</label>
          <label>補足（任意） <textarea name="message" rows="3" maxlength="160" placeholder="例：荷物当番できます"></textarea></label>
          <fieldset id="coordinate-choice" hidden>
            <legend>保護者間で共有</legend>
            <small>送迎希望・早退・遅刻を登録すると、呼び名・出欠・時刻が試合の一覧に載ります。補足欄の文章は個別連絡に残ります。</small>
            <label>公開用の呼び名（任意） <input type="text" name="publicName" maxlength="24" placeholder="例：背番号12の保護者" autocomplete="off"></label>
            <small id="coordination-alias"></small>
          </fieldset>
        </div>
      </details>
      <p id="cloud-save-status" role="status" aria-live="polite"></p>
      <div id="cloud-conflict" class="cloud-stack" hidden>
        <p id="cloud-latest"></p>
        <button id="cloud-use-latest" type="button" class="secondary-button">クラウドの回答を表示</button>
        <button id="cloud-keep-draft" type="button" class="secondary-button">入力中の回答で保存</button>
      </div>
      <button id="cloud-import" type="button" class="secondary-button" hidden>この端末の試作回答を確認</button>
      <button id="cloud-save" type="submit" class="primary-button">回答を保存</button>
    </form>
    <section id="cloud-review" class="panel" hidden>
      <h2 id="cloud-review-title">出欠・連絡一覧</h2>
      <p id="cloud-review-meta"></p>
      <label>表示する回答 <select id="cloud-filter"><option value="">全員</option><option value="contact">連絡あり</option><option value="ride">送迎希望</option><option value="schedule">早退・遅刻</option><option value="pending">未回答</option></select></label>
      <p id="cloud-review-status" role="status"></p>
      <div class="cloud-table-wrap" tabindex="0" role="region" aria-label="団員の出欠・連絡一覧">
        <table class="cloud-table">
          <thead><tr><th scope="col">参加者</th><th scope="col" id="cloud-date-heading">出欠</th><th scope="col">コメント</th></tr></thead>
          <tbody id="cloud-counts"></tbody>
          <tbody id="cloud-rows"></tbody>
        </table>
      </div>
      <details id="guest-link-manager">
        <summary>団員の回答用リンク</summary>
        <p>対象のご家庭に個別に共有してください。</p>
        <label>団員 <select id="guest-link-person"></select></label>
        <button id="manage-guest-link" class="secondary-button" type="button">回答用リンクを表示・発行</button>
        <label id="guest-link-result" hidden>回答用リンク <input id="guest-link-url" type="url" readonly></label>
        <button id="copy-guest-link" class="secondary-button" type="button" hidden>回答用リンクをコピー</button>
        <button id="revoke-guest-link" class="secondary-button" type="button" hidden>このリンクを無効にする</button>
        <p id="guest-link-status" role="status"></p>
      </details>
      <details id="public-notice-editor">
        <summary>全員に見える試合の連絡を登録</summary>
        <p>集合時間、会場、持ち物などを記入してください。氏名・住所・個別の送迎希望は記載しないでください。</p>
        <label>公開する連絡 <textarea id="public-notice-message" maxlength="1200" rows="4"></textarea></label>
        <button id="publish-notice" class="primary-button" type="button">公開する</button>
        <p id="publish-notice-status" role="status"></p>
      </details>
    </section>
  </section>
</main>
<footer class="site-footer"></footer>
<script type="module" src="attendance-cloud.mjs?v=20261122-1"></script>
</body>
</html>
