<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>動作診断｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    .diag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
    .diag-card{background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r12);padding:14px}
    .diag-label{font-size:.7rem;color:var(--ink-3);font-weight:900;margin-bottom:4px}
    .diag-value{font-size:.88rem;color:var(--ink);font-weight:900;overflow-wrap:anywhere}
    .error-list{display:grid;gap:8px}
    .error-item{border:1px solid var(--line);border-radius:var(--r8);padding:10px 12px;background:rgba(255,255,255,.03)}
    .error-meta{font-size:.68rem;color:var(--ink-3);margin-bottom:4px}
    .error-message{font-size:.8rem;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:620px){.diag-grid{grid-template-columns:1fr}.diag-actions{display:grid!important}}
  </style>
</head>
<body>
  <header class="site-header"></header>
  <main class="page-wrap">
    <a class="back-btn" href="coach.html">運営メニューに戻る</a>
    <div class="hero-band">
      <div class="hero-emoji">🩺</div>
      <div><div class="hero-title">動作診断</div><div class="hero-sub">この端末の通信・PWA・直近のJavaScriptエラーを確認します。</div></div>
    </div>
    <div class="diag-grid">
      <div class="diag-card"><div class="diag-label">ネットワーク</div><div class="diag-value" id="network-status">確認中…</div></div>
      <div class="diag-card"><div class="diag-label">Firebase</div><div class="diag-value" id="firebase-status">確認中…</div></div>
      <div class="diag-card"><div class="diag-label">PWA</div><div class="diag-value" id="pwa-status">確認中…</div></div>
    </div>
    <div class="panel">
      <div class="section-head" style="margin-top:0">
        <h2>端末内エラーログ <span id="error-count"></span></h2>
      </div>
      <p style="font-size:.76rem;color:var(--ink-3);margin-bottom:12px">このブラウザで発生した直近20件だけを端末内に保存します。外部へ自動送信しません。</p>
      <div class="diag-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn btn-outline btn-sm" type="button" id="reload-btn">再読み込み</button>
        <button class="btn btn-outline btn-sm" type="button" id="export-btn">JSON保存</button>
        <button class="btn btn-outline btn-sm" type="button" id="clear-btn" style="color:var(--red)">ログを消去</button>
      </div>
      <div class="error-list" id="error-list"></div>
    </div>
  </main>
  <footer class="site-footer"></footer>
  <script>
  (function(){
    var ERROR_KEY="smc_client_errors_v1";
    function readErrors(){
      try{var value=JSON.parse(localStorage.getItem(ERROR_KEY)||"[]");return Array.isArray(value)?value:[];}catch(e){return [];}
    }
    function renderErrors(){
      var errors=readErrors().slice().reverse();
      document.getElementById("error-count").textContent="（"+errors.length+"件）";
      var list=document.getElementById("error-list");
      list.replaceChildren();
      if(!errors.length){
        var empty=document.createElement("p");empty.className="empty-msg";empty.textContent="記録されたエラーはありません。";list.appendChild(empty);return;
      }
      errors.forEach(function(error){
        var item=document.createElement("div");item.className="error-item";
        var meta=document.createElement("div");meta.className="error-meta";
        meta.textContent=[error.at,error.page,error.source,error.line?"行 "+error.line:""].filter(Boolean).join(" / ");
        var message=document.createElement("div");message.className="error-message";message.textContent=error.message||"不明なエラー";
        item.append(meta,message);list.appendChild(item);
      });
    }
    function updateNetwork(){document.getElementById("network-status").textContent=navigator.onLine?"オンライン":"オフライン";}
    updateNetwork();window.addEventListener("online",updateNetwork);window.addEventListener("offline",updateNetwork);
    document.getElementById("pwa-status").textContent=("serviceWorker" in navigator)
      ?(navigator.serviceWorker.controller?"Service Worker 制御中":"登録・更新待ち")
      :"未対応";
    var firebaseStatus=document.getElementById("firebase-status");
    var firebaseTimer=setTimeout(function(){if(firebaseStatus.textContent==="確認中…")firebaseStatus.textContent="接続タイムアウト";},5000);
    onFirebaseReady(function(db){
      db.ref(".info/connected").on("value",function(snapshot){
        clearTimeout(firebaseTimer);firebaseStatus.textContent=snapshot.val()?"クラウド接続中":"再接続待ち";
      });
    });
    document.getElementById("reload-btn").addEventListener("click",function(){location.reload();});
    document.getElementById("clear-btn").addEventListener("click",function(){
      if(!confirm("この端末のエラーログを消去しますか？"))return;
      localStorage.removeItem(ERROR_KEY);renderErrors();
    });
    document.getElementById("export-btn").addEventListener("click",function(){
      var url=URL.createObjectURL(new Blob([JSON.stringify(readErrors(),null,2)],{type:"application/json"}));
      var link=document.createElement("a");link.href=url;link.download="smc-diagnostics.json";link.click();
      setTimeout(function(){URL.revokeObjectURL(url);},0);
    });
    renderErrors();
  })();
  </script>
</body>
</html>
