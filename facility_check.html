  <style>
    .facility-note{margin:-4px 0 16px;padding:11px 13px;border:1px solid rgba(90,167,255,.36);border-radius:12px;background:rgba(90,167,255,.1);color:var(--ink-2);font-size:.82rem;line-height:1.55}.facility-note strong{color:var(--cyan)}
    .month-panel{padding:14px;margin-bottom:16px}.month-head{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:8px;align-items:center;margin-bottom:10px}.month-head button{min-height:44px;border:1px solid var(--surface-bd);border-radius:12px;background:rgba(255,255,255,.07);color:var(--ink);font-size:1.2rem;font-weight:900;cursor:pointer}.month-title{text-align:center;font-size:1rem;font-weight:900;color:var(--ink)}
    .month-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}.sum-card{padding:8px 5px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);text-align:center}.sum-card strong{display:block;font-size:1.15rem;line-height:1.1}.sum-card span{font-size:.62rem;color:var(--ink-3)}
    .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;color:var(--ink-3);font-size:.68rem;font-weight:900;padding:3px 0}.dow.sun{color:#ff8ca0}.dow.sat{color:#7db9ff}
    .day{position:relative;min-height:64px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);color:var(--ink);text-align:left;cursor:pointer;overflow:hidden}.day.empty{visibility:hidden}.day.today{outline:2px solid var(--orange);outline-offset:1px}.day.selected{border-color:#72d6ff;box-shadow:0 0 0 2px rgba(114,214,255,.16)}.day-number{font-size:.74rem;font-weight:900}.day-tag{display:block;margin-top:4px;padding:2px 3px;border-radius:5px;font-size:.55rem;font-weight:900;line-height:1.2;text-align:center;overflow-wrap:anywhere}
    .st-scheduled .day-tag{background:rgba(90,167,255,.18);color:#b8d9ff}.st-incomplete .day-tag{background:rgba(255,209,102,.18);color:#ffe2a0}.st-complete .day-tag{background:rgba(40,199,111,.18);color:#9cf1c5}.st-issue .day-tag{background:rgba(255,91,110,.18);color:#ffb5bf}.st-other .day-tag{background:rgba(255,255,255,.08);color:var(--ink-3)}
    .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--ink-3);font-size:.66rem}.legend span{display:inline-flex;align-items:center;gap:4px}.dot{width:9px;height:9px;border-radius:50%}.dot.blue{background:#5aa7ff}.dot.yellow{background:#ffd166}.dot.green{background:#28c76f}.dot.red{background:#ff5b6e}
    .editor-panel{scroll-margin-top:78px}.editor-status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.editor-status strong{font-size:.9rem}.status-chip{padding:4px 9px;border-radius:999px;font-size:.67rem;font-weight:900;border:1px solid var(--line)}.chip-scheduled{color:#b8d9ff;background:rgba(90,167,255,.16)}.chip-incomplete{color:#ffe2a0;background:rgba(255,209,102,.16)}.chip-complete{color:#9cf1c5;background:rgba(40,199,111,.16)}.chip-issue{color:#ffb5bf;background:rgba(255,91,110,.16)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid .full{grid-column:1/-1}.check-list{display:grid;gap:8px;margin:12px 0}.check-row{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start;padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}.check-toggle{width:46px;height:46px;border:2px solid var(--surface-bd);border-radius:12px;background:rgba(255,255,255,.04);color:var(--ink-3);font-size:1.2rem;font-weight:900;cursor:pointer}.check-toggle.checked{background:rgba(40,199,111,.2);border-color:#28c76f;color:#9cf1c5}.check-text{min-width:0;color:var(--ink);font-size:.84rem;font-weight:800;line-height:1.55}.check-help{display:block;margin-top:2px;color:var(--ink-3);font-size:.68rem;font-weight:500}
    .equipment-extra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}.issue-btn{min-height:42px;padding:7px 10px;border-radius:9px;border:1px solid rgba(255,91,110,.4);background:rgba(255,91,110,.1);color:#ffb5bf;font:inherit;font-size:.72rem;font-weight:900;cursor:pointer}.issue-btn.active{background:#b4233b;border-color:#d7405b;color:#fff}.auto-check{margin:8px 0 14px;padding:10px 12px;border-radius:10px;border:1px dashed rgba(114,214,255,.4);color:var(--ink-2);font-size:.76rem}.auto-check.ok{border-color:rgba(40,199,111,.5);color:#9cf1c5}.action-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.action-row .btn{width:100%;white-space:normal}.save-state{min-height:1.4em;margin-top:8px;text-align:center;color:var(--ink-3);font-size:.72rem}.print-sheet{display:none}
    body[data-theme="light"] .facility-note{background:#edf7ff;border-color:#8bb8d2;color:#324b66}body[data-theme="light"] .facility-note strong{color:#075d84}body[data-theme="light"] .day,body[data-theme="light"] .sum-card,body[data-theme="light"] .editor-status,body[data-theme="light"] .check-row{background:#fff;border-color:#cbd5e1;color:#17243a}body[data-theme="light"] .st-scheduled .day-tag{background:#deecff;color:#135b9f}body[data-theme="light"] .st-incomplete .day-tag{background:#fff1bd;color:#775800}body[data-theme="light"] .st-complete .day-tag{background:#d7f5e4;color:#08743d}body[data-theme="light"] .st-issue .day-tag{background:#ffe0e7;color:#a01339}body[data-theme="light"] .check-toggle{background:#fff;color:#52647a;border-color:#9fb0c3}body[data-theme="light"] .check-toggle.checked{background:#d7f5e4;border-color:#16975a;color:#08743d}body[data-theme="light"] .issue-btn{color:#a01339;background:#fff0f3;border-color:#cf6b84}
    @media(max-width:560px){.month-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:58px;padding:5px 2px}.day-tag{font-size:.51rem}.form-grid{grid-template-columns:minmax(0,1fr)}.form-grid .full{grid-column:auto}.equipment-extra{grid-template-columns:minmax(0,1fr)}.action-row{grid-template-columns:minmax(0,1fr)}.check-row{grid-template-columns:42px minmax(0,1fr);padding:9px}.check-toggle{width:42px;height:42px}}@media(max-width:360px){.calendar{gap:3px}.day{min-height:54px}.day-number{font-size:.68rem}.day-tag{font-size:.48rem;padding:2px 1px}}
    @media print{@page{size:A4 portrait;margin:8mm}body{background:#fff!important;color:#000!important}.site-header,.page-wrap,.site-footer,.portal-loader{display:none!important}.print-sheet{display:block!important;width:100%;height:132mm;box-sizing:border-box;border:1.4px solid #000;padding:6mm 6mm 4mm;font-family:"Yu Gothic",Meiryo,sans-serif;color:#000;background:#fff}.ps-title{text-align:center;font-size:12pt;font-weight:700;margin:0 0 4mm}.ps-info{width:100%;border-collapse:collapse;margin-bottom:3mm;font-size:8.5pt}.ps-info th,.ps-info td{border:1px solid #000;padding:2mm 2.2mm;height:8mm;text-align:left}.ps-info th{width:18%;font-weight:700}.ps-intro{font-size:8.5pt;margin:0 0 2mm}.ps-list{list-style:none;margin:0;padding:0;font-size:8.2pt;line-height:1.5}.ps-list li{margin:0 0 1.2mm}.ps-box{display:inline-block;width:4mm;text-align:center;font-weight:700}.ps-free{margin-top:3mm;border:1px solid #000;height:24mm;padding:2mm;font-size:8.5pt}.ps-free strong{display:block;margin-bottom:1mm}.ps-footer{margin-top:1.5mm;text-align:right;font-size:7pt;color:#333}}
  </style>

<body>
<header class="site-header"></header>
<main class="page-wrap">
  <a class="back-btn" href="todo.html">やることリストに戻る</a>
  <div class="hero-band"><div class="hero-emoji">🏫</div><div><div class="hero-title">体育館利用チェック</div><div class="hero-sub">水・木の体育館利用後に確認。完了日はカレンダーで分かります。</div></div></div>
  <div class="facility-note"><strong>定期利用：毎週 水曜日・木曜日</strong><br>水・木は自動で「利用予定」としてカレンダーに表示します。利用後にチェックを保存すると緑、未完了は黄色、異常ありは赤で表示します。</div>
  <section class="panel month-panel" aria-label="施設利用チェックカレンダー"><div class="month-head"><button type="button" id="prev-month" aria-label="前の月">‹</button><div class="month-title" id="month-title"></div><button type="button" id="next-month" aria-label="次の月">›</button></div><div class="month-summary" id="month-summary"></div><div class="calendar" id="calendar"></div><div class="legend"><span><i class="dot blue"></i>利用予定</span><span><i class="dot yellow"></i>未完了</span><span><i class="dot green"></i>完了</span><span><i class="dot red"></i>異常あり</span></div></section>
  <section class="panel editor-panel" id="editor-panel"><div class="panel-title">📝 利用後チェック</div><div class="editor-status"><strong id="selected-label">日付を選択してください</strong><span class="status-chip chip-scheduled" id="selected-status">利用予定</span></div>
    <div class="form-grid"><div class="form-group"><label class="form-label" for="f-date">📅 使用年月日</label><input class="form-control" id="f-date" type="date"></div><div class="form-group"><label class="form-label" for="f-time">🕒 確認時間</label><input class="form-control" id="f-time" type="time"></div><div class="form-group"><label class="form-label" for="f-manager">👤 施設責任者</label><input class="form-control" id="f-manager" placeholder="例：担当コーチ"></div><div class="form-group"><label class="form-label" for="f-checker">✅ 施設確認者</label><input class="form-control" id="f-checker" placeholder="例：確認したコーチ"></div><div class="form-group full"><label class="form-label" for="f-facility">🏫 施設名</label><input class="form-control" id="f-facility" value="小学校体育館"></div></div>
    <div class="check-list" id="check-list"></div><div class="auto-check" id="auto-check">①〜⑥を確認すると、自動で「全項目確認済み」になります。</div>
    <div class="form-group"><label class="form-label" for="f-note">📝 自由欄・異常内容・連絡事項</label><textarea class="form-control" id="f-note" rows="4" placeholder="異常があった場合の内容、学校への連絡事項など"></textarea></div>
    <div class="action-row"><button class="btn btn-primary" type="button" id="save-btn">💾 保存する</button><button class="btn btn-outline" type="button" id="print-btn">🖨️ 半面チェック表をPDF/印刷</button><button class="btn btn-outline" type="button" id="delete-btn">🗑 この日の記録を削除</button></div><div class="save-state" id="save-state"></div>
  </section>
</main>
<footer class="site-footer"></footer>
<section class="print-sheet" id="print-sheet" aria-hidden="true"><div class="ps-title">小学校体育施設　利用チェック表</div><table class="ps-info"><tr><th>使用年月日</th><td id="ps-date"></td><th>確認時間</th><td id="ps-time"></td></tr><tr><th>施設責任者</th><td id="ps-manager"></td><th>施設確認者</th><td id="ps-checker"></td></tr></table><p class="ps-intro">終了時、次のチェック項目について、ご確認をお願いいたします。</p><ol class="ps-list" id="ps-list"></ol><div class="ps-free"><strong>自由欄</strong><span id="ps-note"></span></div><div class="ps-footer" id="ps-facility"></div></section>
<script>
var STORAGE_KEY="smc_facility_checks_v1",DB_PATH="facility_checks",records={},selectedDate="",viewDate=new Date(),currentChecks={},equipmentIssue=false;
viewDate.setDate(1);
var CHECKS=[
{id:"forgotten",text:"忘れ物の確認をしましたか。"},
{id:"equipment",text:"設備に異常はありませんか。",help:"破損等してしまった場合は早急にご連絡ください。"},
{id:"mop",text:"モップ掛けはしましたか。"},
{id:"trash",text:"ごみはありませんか。",help:"出したゴミはお持ち帰りください。"},
{id:"lights",text:"電気の消し忘れはありませんか。",help:"強く押すとスイッチが壊れます。"},
{id:"lock",text:"鍵のかけ忘れはありませんか？"}
];
var NUMBERS=["①","②","③","④","⑤","⑥"];
function pad(n){return String(n).padStart(2,"0")}
function localDateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){return localDateKey(new Date())}
function isScheduledKey(key){var d=new Date(key+"T12:00:00"),w=d.getDay();return w===3||w===4}
function weekdayJa(key){return ["日","月","火","水","木","金","土"][new Date(key+"T12:00:00").getDay()]}
function formatJa(key){if(!key)return"";var p=key.split("-");return Number(p[0])+"年"+Number(p[1])+"月"+Number(p[2])+"日（"+weekdayJa(key)+"）"}
function defaultTime(){var n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes())}
function recordStatus(key){var r=records[key];if(r&&r.issue)return"issue";if(r&&r.status==="complete")return"complete";if(r)return"incomplete";if(isScheduledKey(key))return key<=todayKey()?"incomplete":"scheduled";return"other"}
function statusLabel(st){return{scheduled:"利用予定",incomplete:"未完了",complete:"完了",issue:"異常あり",other:"利用記録"}[st]||"利用記録"}
function statusClass(st){return{scheduled:"chip-scheduled",incomplete:"chip-incomplete",complete:"chip-complete",issue:"chip-issue",other:"chip-scheduled"}[st]||"chip-scheduled"}
function renderChecks(){var root=document.getElementById("check-list");root.innerHTML=CHECKS.map(function(c,i){var checked=!!currentChecks[c.id],extra=c.id==="equipment"?'<div class="equipment-extra"><span class="check-help">異常がある場合は「異常あり」を押して自由欄へ内容を入力してください。</span><button type="button" class="issue-btn'+(equipmentIssue?' active':'')+'" data-issue>⚠️ 異常あり</button></div>':'';return'<div class="check-row"><button type="button" class="check-toggle'+(checked?' checked':'')+'" data-check="'+c.id+'" aria-pressed="'+checked+'">'+(checked?'✓':'□')+'</button><div class="check-text">'+NUMBERS[i]+' '+c.text+(c.help?'<span class="check-help">'+c.help+'</span>':'')+extra+'</div></div>'}).join("");root.querySelectorAll("[data-check]").forEach(function(btn){btn.addEventListener("click",function(){var id=this.getAttribute("data-check");currentChecks[id]=!currentChecks[id];renderChecks();updateAutoCheck()})});var issue=root.querySelector("[data-issue]");if(issue)issue.addEventListener("click",function(){equipmentIssue=!equipmentIssue;if(equipmentIssue)currentChecks.equipment=false;renderChecks();updateAutoCheck()})}
function allRequiredChecked(){return CHECKS.every(function(c){return!!currentChecks[c.id]})}
function updateAutoCheck(){var el=document.getElementById("auto-check"),ok=allRequiredChecked()&&!equipmentIssue;el.classList.toggle("ok",ok);el.textContent=ok?"✅ ①〜⑥すべて確認済みです。":"①〜⑥を確認すると、自動で「全項目確認済み」になります。";updateSelectedStatusPreview()}
function updateSelectedStatusPreview(){if(!selectedDate)return;var st=equipmentIssue?"issue":(allRequiredChecked()?"complete":"incomplete"),chip=document.getElementById("selected-status");chip.className="status-chip "+statusClass(st);chip.textContent=statusLabel(st)}
function loadEditor(key){selectedDate=key;var r=records[key]||{};currentChecks=Object.assign({},r.checks||{});equipmentIssue=!!r.issue;document.getElementById("f-date").value=key;document.getElementById("f-time").value=r.checkTime||defaultTime();document.getElementById("f-manager").value=r.facilityManager||localStorage.getItem("smc_facility_manager")||"";document.getElementById("f-checker").value=r.facilityChecker||localStorage.getItem("smc_facility_checker")||"";document.getElementById("f-facility").value=r.facility||localStorage.getItem("smc_facility_name")||"小学校体育館";document.getElementById("f-note").value=r.notes||"";document.getElementById("selected-label").textContent=formatJa(key)+(isScheduledKey(key)?"・定期利用日":"・臨時利用日");var st=recordStatus(key),chip=document.getElementById("selected-status");chip.className="status-chip "+statusClass(st);chip.textContent=statusLabel(st);renderChecks();updateAutoCheck();renderCalendar()}
function renderCalendar(){var y=viewDate.getFullYear(),m=viewDate.getMonth();document.getElementById("month-title").textContent=y+"年 "+(m+1)+"月";var first=new Date(y,m,1),last=new Date(y,m+1,0),cells=[];["日","月","火","水","木","金","土"].forEach(function(d,i){cells.push('<div class="dow '+(i===0?'sun':i===6?'sat':'')+'">'+d+'</div>')});for(var blank=0;blank<first.getDay();blank++)cells.push('<button class="day empty" type="button" tabindex="-1"></button>');var scheduled=0,complete=0,incomplete=0,issue=0;for(var day=1;day<=last.getDate();day++){var d=new Date(y,m,day),key=localDateKey(d),st=recordStatus(key);if(isScheduledKey(key))scheduled++;if(st==="complete")complete++;if(st==="issue")issue++;if(st==="incomplete"&&isScheduledKey(key))incomplete++;var tag=(st==="other"&&!records[key])?"":'<span class="day-tag">'+statusLabel(st)+'</span>';cells.push('<button type="button" class="day st-'+st+(key===todayKey()?' today':'')+(key===selectedDate?' selected':'')+'" data-date="'+key+'"><span class="day-number">'+day+'</span>'+tag+'</button>')}document.getElementById("calendar").innerHTML=cells.join("");document.getElementById("calendar").querySelectorAll("[data-date]").forEach(function(btn){btn.addEventListener("click",function(){loadEditor(this.getAttribute("data-date"));document.getElementById("editor-panel").scrollIntoView({behavior:"smooth",block:"start"})})});document.getElementById("month-summary").innerHTML='<div class="sum-card"><strong>'+scheduled+'</strong><span>水・木予定</span></div><div class="sum-card"><strong>'+complete+'</strong><span>完了</span></div><div class="sum-card"><strong>'+incomplete+'</strong><span>未完了</span></div><div class="sum-card"><strong>'+issue+'</strong><span>異常あり</span></div>'}
function collectRecord(){var key=document.getElementById("f-date").value;if(!key){alert("使用年月日を入力してください");return null}var manager=document.getElementById("f-manager").value.trim(),checker=document.getElementById("f-checker").value.trim();if(!manager||!checker){if(!confirm("施設責任者または施設確認者が未入力です。このまま保存しますか？"))return null}var status=equipmentIssue?"issue":(allRequiredChecked()?"complete":"incomplete");return{date:key,weekday:weekdayJa(key),checkTime:document.getElementById("f-time").value,facilityManager:manager,facilityChecker:checker,facility:document.getElementById("f-facility").value.trim()||"小学校体育館",checks:Object.assign({},currentChecks),allConfirmed:allRequiredChecked(),issue:equipmentIssue,notes:document.getElementById("f-note").value.trim(),status:status,updatedAt:Date.now(),createdAt:(records[key]&&records[key].createdAt)||Date.now()}}
function saveRecord(){var r=collectRecord();if(!r)return;var oldKey=selectedDate;if(oldKey&&oldKey!==r.date)delete records[oldKey];records[r.date]=r;selectedDate=r.date;localStorage.setItem("smc_facility_manager",r.facilityManager||"");localStorage.setItem("smc_facility_checker",r.facilityChecker||"");localStorage.setItem("smc_facility_name",r.facility||"");document.getElementById("save-state").textContent="保存中…";dbSave(DB_PATH,records,STORAGE_KEY,function(){document.getElementById("save-state").textContent="✅ 保存しました";renderCalendar();loadEditor(r.date)},function(){document.getElementById("save-state").textContent="⚠️ 端末には保存しました。クラウド同期を確認してください";renderCalendar()})}
function deleteRecord(){if(!selectedDate||!records[selectedDate]){alert("この日の保存済み記録はありません");return}if(!confirm(formatJa(selectedDate)+"の記録を削除しますか？"))return;delete records[selectedDate];dbSave(DB_PATH,records,STORAGE_KEY,function(){document.getElementById("save-state").textContent="削除しました";loadEditor(selectedDate);renderCalendar()})}
function preparePrint(){var r=collectRecord();if(!r)return;document.getElementById("ps-date").textContent=formatJa(r.date);document.getElementById("ps-time").textContent=r.checkTime||"　　　時　　　分";document.getElementById("ps-manager").textContent=r.facilityManager||"";document.getElementById("ps-checker").textContent=r.facilityChecker||"";var list=CHECKS.map(function(c,i){var mark=r.checks[c.id]?"☑":"□";return'<li>'+NUMBERS[i]+' <span class="ps-box">'+mark+'</span>'+c.text+(c.help?' '+c.help:'')+'</li>'}).join("");list+='<li>⑦ <span class="ps-box">'+(r.allConfirmed&&!r.issue?'☑':'□')+'</span>チェック項目①〜⑥まで全て確認しましたか。</li><li>⑧ お疲れさまでした。</li>';document.getElementById("ps-list").innerHTML=list;document.getElementById("ps-note").textContent=r.notes||"";document.getElementById("ps-facility").textContent=r.facility||"小学校体育館";window.print()}
window.addEventListener("DOMContentLoaded",function(){document.getElementById("prev-month").addEventListener("click",function(){viewDate.setMonth(viewDate.getMonth()-1);renderCalendar()});document.getElementById("next-month").addEventListener("click",function(){viewDate.setMonth(viewDate.getMonth()+1);renderCalendar()});document.getElementById("save-btn").addEventListener("click",saveRecord);document.getElementById("print-btn").addEventListener("click",preparePrint);document.getElementById("delete-btn").addEventListener("click",deleteRecord);document.getElementById("f-date").addEventListener("change",function(){if(this.value)loadEditor(this.value)});try{var local=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");if(local&&typeof local==="object"&&!Array.isArray(local))records=local}catch(e){}selectedDate=todayKey();viewDate=new Date(selectedDate+"T12:00:00");viewDate.setDate(1);renderCalendar();loadEditor(selectedDate);dbListen(DB_PATH,function(val){if(val&&typeof val==="object"&&!Array.isArray(val))records=val;else records={};renderCalendar();if(selectedDate)loadEditor(selectedDate)},STORAGE_KEY,{})});
</script>
</body>
</html>
