<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ガイダンス設定｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="coach.html">← コーチ専用に戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📢</div>
    <div><div class="hero-title">ガイダンス設定</div>
      <div class="hero-sub">ホーム画面のお知らせを設定します。</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">📢 ガイダンス（ホーム画面に青帯で表示）</div>
    <div class="form-group">
      <label class="form-label">内容</label>
      <textarea class="form-control" id="guidance-input" rows="3"
        placeholder="例: 6月29日（日）4年生TM｜8:00 平方スポーツ広場集合｜水筒2本・帽子必須"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn btn-primary btn-sm" onclick="saveNotice('guidance')">💾 保存</button>
      <button class="btn btn-outline btn-sm" onclick="clearNotice('guidance')">🗑 クリア</button>
    </div>
    <div class="dynamic-notice guidance" style="display:flex">
      <span class="notice-label">📢</span>
      <span id="guidance-preview" style="flex:1;color:#c8e4ff;font-size:.84rem;padding:4px 0">（未設定）</span>
    </div>
  </div>

  <div class="panel" style="margin-top:14px">
    <div class="panel-title">⚠️ 注意事項（ホーム画面に赤帯で表示）</div>
    <div class="form-group">
      <label class="form-label">内容</label>
      <textarea class="form-control" id="warning-input" rows="3"
        placeholder="例: 本日は気温35℃以上の予報です。水筒2本以上持参してください。"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn btn-red btn-sm" onclick="saveNotice('warning')">💾 保存</button>
      <button class="btn btn-outline btn-sm" onclick="clearNotice('warning')">🗑 クリア</button>
    </div>
    <div class="dynamic-notice warning" style="display:flex">
      <span class="notice-label">⚠️</span>
      <span id="warning-preview" style="flex:1;color:#fca5a5;font-size:.84rem;padding:4px 0">（未設定）</span>
    </div>
  </div>

  <div id="save-msg" style="text-align:center;color:var(--green);font-size:.85rem;min-height:1.4em;margin-top:8px"></div>
  <a class="btn btn-outline" href="coach.html" style="display:flex;justify-content:center;margin-top:12px">← コーチ専用に戻る</a>
</main>
<footer class="site-footer">YOSHIMI SMC FC — SMART PORTAL</footer>
<script>
function loadInputs(){
  var g=localStorage.getItem("smc_guidance")||"";
  var w=localStorage.getItem("smc_warning")||"";
  document.getElementById("guidance-input").value=g;
  document.getElementById("warning-input").value=w;
  document.getElementById("guidance-preview").textContent=g||"（未設定）";
  document.getElementById("warning-preview").textContent=w||"（未設定）";
  // Firebaseから読み込み
  dbListen("notices/guidance",function(v){
    if(v){document.getElementById("guidance-input").value=v;document.getElementById("guidance-preview").textContent=v;}
  },"smc_guidance",null);
  dbListen("notices/warning",function(v){
    if(v){document.getElementById("warning-input").value=v;document.getElementById("warning-preview").textContent=v;}
  },"smc_warning",null);
}
function saveNotice(t){
  var lKey=t==="guidance"?"smc_guidance":"smc_warning";
  var val=document.getElementById(t+"-input").value.trim();
  dbSave("notices/"+t,val||null,lKey,null);
  if(val)localStorage.setItem(lKey,val);else localStorage.removeItem(lKey);
  document.getElementById(t+"-preview").textContent=val||"（未設定）";
  var msg=document.getElementById("save-msg");
  msg.textContent="✅ 保存しました";setTimeout(function(){msg.textContent="";},2500);
}
function clearNotice(t){
  var lKey=t==="guidance"?"smc_guidance":"smc_warning";
  dbSave("notices/"+t,null,lKey,null);
  localStorage.removeItem(lKey);
  document.getElementById(t+"-input").value="";
  document.getElementById(t+"-preview").textContent="（未設定）";
}
window.addEventListener("DOMContentLoaded",loadInputs);
</script>
</body>
</html>
