<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユニフォーム貸出｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    /* カラーセクション */
    .color-section{margin-bottom:22px}
    .color-header{
      display:flex;align-items:center;gap:10px;padding:10px 14px;
      border-radius:var(--r8);margin-bottom:10px;cursor:pointer;
      border:1px solid var(--line);transition:.15s;
    }
    .color-header:hover{border-color:var(--orange)}
    .color-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
    .color-name{font-size:.9rem;font-weight:900;color:#fff}
    .color-count{font-size:.75rem;color:var(--ink-3);margin-left:auto}
    .color-count .free{color:#00ff88;font-weight:700}
    .color-count .lent{color:#ff4466;font-weight:700}
    /* カードグリッド */
    .uni-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:0 4px 4px}
    .uni-card{
      background:var(--surface-lt);border-radius:var(--r12);
      border:1px solid var(--line);padding:13px 11px;
      text-align:center;transition:.15s;cursor:pointer;
    }
    .uni-card:hover{border-color:var(--orange)}
    .uni-card.free{border-color:rgba(0,255,136,.35);background:rgba(0,255,136,.05)}
    .uni-card.lent{border-color:rgba(255,68,102,.4);background:rgba(255,68,102,.06)}
    .uni-num{font-size:1.8rem;font-weight:900;color:#fff;line-height:1}
    .uni-size{font-size:.7rem;color:var(--cyan);margin:3px 0}
    .uni-stat{font-size:.78rem;font-weight:900;margin:3px 0}
    .uni-who{font-size:.68rem;color:var(--ink-3);margin-top:2px}
    .uni-memo{font-size:.65rem;color:var(--ink-3)}
    /* 統計 */
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .stat-card{background:var(--surface-lt);border-radius:var(--r8);padding:12px;text-align:center;border:1px solid var(--line)}
    .stat-card .sv{font-size:1.6rem;font-weight:900;color:#fff}
    .stat-card .sl{font-size:.7rem;color:var(--ink-3);margin-top:2px}
    /* モーダル */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:200;backdrop-filter:blur(6px);padding:16px}
    .modal-bg.open{display:grid}
    .modal{background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r16);padding:22px;width:min(400px,100%);box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
    .modal h3{font-size:.95rem;font-weight:900;color:#fff;margin-bottom:14px}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    /* カラーピッカー */
    .color-picker{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .cp-btn{
      width:32px;height:32px;border-radius:50%;border:3px solid transparent;
      cursor:pointer;transition:.15s;flex-shrink:0;
    }
    .cp-btn.selected{border-color:#fff;box-shadow:0 0 0 2px var(--orange)}
    /* 履歴 */
    .hist-item{background:rgba(255,255,255,.04);border-radius:var(--r8);padding:8px 12px;font-size:.8rem;display:flex;align-items:center;gap:8px;margin-bottom:5px}
    @media(max-width:400px){.stat-row{grid-template-columns:1fr 1fr};.fg2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="coach.html">コーチ専用に戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">👕</div>
    <div><div class="hero-title">ユニフォーム貸出管理</div>
      <div class="hero-sub">色別で在庫・背番号・貸出先を管理します。</div></div>
  </div>
  <div class="notice-bar">💾 データはこのブラウザ（端末）に保存されます。</div>

  <div class="stat-row" id="stat-row"></div>

  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="openAdd()">＋ ユニフォームを追加</button>
    <button class="btn btn-outline btn-sm" onclick="showHistory()">📋 貸出履歴</button>
  </div>

  <div id="color-sections"></div>
</main>

<!-- 追加/編集モーダル -->
<div class="modal-bg" id="modal-add">
  <div class="modal">
    <h3 id="add-title">ユニフォームを追加</h3>
    <div class="fg2">
      <div class="form-group"><label class="form-label">背番号</label>
        <input class="form-control" id="u-num" type="number" placeholder="例：10" style="text-align:center"></div>
      <div class="form-group"><label class="form-label">サイズ</label>
        <select class="form-control" id="u-size">
          <option>100</option><option>110</option><option>120</option><option>130</option>
          <option>140</option><option>150</option><option>160</option>
          <option>SS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
        </select></div>
    </div>
    <div class="form-group">
      <label class="form-label">ユニフォームの色</label>
      <div class="color-picker" id="color-picker"></div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <input class="form-control" id="u-color-name" placeholder="色の名前（例：青白 ホーム）" style="flex:1">
        <input type="color" id="u-color-code" value="#1a5fa8" style="width:42px;height:42px;border:none;border-radius:8px;cursor:pointer;background:none;padding:0">
      </div>
    </div>
    <div class="form-group"><label class="form-label">メモ</label>
      <input class="form-control" id="u-memo" placeholder="例：ホーム用　上下セット"></div>
    <div class="modal-btns">
      <button class="btn btn-outline btn-sm" id="u-del-btn" style="color:var(--red);border-color:rgba(255,68,102,.4);display:none" onclick="deleteUni()">🗑 削除</button>
      <button class="btn btn-outline" onclick="closeModal('modal-add')">キャンセル</button>
      <button class="btn btn-primary" onclick="saveUni()">保存</button>
    </div>
  </div>
</div>

<!-- 貸出/返却モーダル -->
<div class="modal-bg" id="modal-lend">
  <div class="modal">
    <h3 id="lend-title">貸出・返却</h3>
    <div id="lend-info" style="font-size:.85rem;color:var(--cyan);margin-bottom:12px;line-height:1.6"></div>
    <div id="lend-form">
      <div class="form-group"><label class="form-label">借りる人（氏名）</label>
        <input class="form-control" id="l-name" placeholder="例：吉見　太郎"></div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">貸出日</label>
          <input class="form-control" id="l-date" type="date"></div>
        <div class="form-group"><label class="form-label">返却予定日</label>
          <input class="form-control" id="l-return" type="date"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('modal-lend')">キャンセル</button>
      <button class="btn btn-primary" id="lend-btn" onclick="doLend()">貸し出す</button>
    </div>
  </div>
</div>

<!-- 履歴モーダル -->
<div class="modal-bg" id="modal-history">
  <div class="modal">
    <h3>📋 貸出履歴</h3>
    <div id="hist-list" style="max-height:60vh;overflow-y:auto"></div>
    <div class="modal-btns"><button class="btn btn-outline" onclick="closeModal('modal-history')">閉じる</button></div>
  </div>
</div>

<footer class="site-footer">YOSHIMI SMC FC — SMART PORTAL</footer>
<script>
var KEY_U="smc_uniform_v2",KEY_H="smc_uniform_hist_v1";
var editId=null,lendId=null;
// 定義済みカラーパレット
var PALETTE=[
  {name:"青白 ホーム", code:"#1a5fa8"},
  {name:"白青 アウェイ",code:"#e8f0fb"},
  {name:"赤白",        code:"#c0392b"},
  {name:"黄黒",        code:"#f0b429"},
  {name:"緑白",        code:"#1a7a4a"},
  {name:"黒",          code:"#222"},
  {name:"オレンジ",    code:"#e8612a"},
  {name:"紺",          code:"#003087"},
];
var selectedColor=PALETTE[0];

function loadU(){try{return JSON.parse(localStorage.getItem(KEY_U))||[];}catch(e){return[];}}
function saveU(d){localStorage.setItem(KEY_U,JSON.stringify(d));}
function loadH(){try{return JSON.parse(localStorage.getItem(KEY_H))||[];}catch(e){return[];}}
function saveH(d){localStorage.setItem(KEY_H,JSON.stringify(d));}

function renderStats(){
  var data=loadU();
  var total=data.length,free=data.filter(function(u){return !u.lentTo;}).length,lent=total-free;
  document.getElementById("stat-row").innerHTML=
    '<div class="stat-card"><div class="sv">'+total+'</div><div class="sl">総在庫</div></div>'
    +'<div class="stat-card"><div class="sv" style="color:#00ff88">'+free+'</div><div class="sl">貸出可</div></div>'
    +'<div class="stat-card"><div class="sv" style="color:#ff4466">'+lent+'</div><div class="sl">貸出中</div></div>';
}

function renderColorSections(){
  var data=loadU();
  // 色ごとにグループ化
  var colorMap={};
  data.forEach(function(u){
    var key=u.colorName||"その他";
    if(!colorMap[key])colorMap[key]={code:u.colorCode||"#888",items:[]};
    colorMap[key].items.push(u);
  });
  var container=document.getElementById("color-sections");
  var keys=Object.keys(colorMap);
  if(!keys.length){
    container.innerHTML='<div style="text-align:center;color:var(--ink-3);padding:32px;font-size:.88rem">ユニフォームがありません。「＋ 追加」から登録してください。</div>';
    return;
  }
  container.innerHTML=keys.map(function(cname){
    var cg=colorMap[cname];
    var items=cg.items;
    var free=items.filter(function(u){return !u.lentTo;}).length;
    var lent=items.length-free;
    var cardsHtml=items.sort(function(a,b){return Number(a.num)-Number(b.num);}).map(function(u){
      var isLent=!!u.lentTo;
      var textCol=isLent?"#ff8888":"#00ff88";
      var statusTxt=isLent?"貸出中":"在庫あり";
      return '<div class="uni-card '+(isLent?"lent":"free")+'" onclick="openLend(\''+u.id+'\''+')">'
        +'<div class="uni-num">#'+u.num+'</div>'
        +'<div class="uni-size">サイズ '+u.size+'</div>'
        +(u.memo?'<div class="uni-memo">'+u.memo+'</div>':"")
        +'<div class="uni-stat" style="color:'+textCol+'">'+statusTxt+'</div>'
        +(isLent?'<div class="uni-who">'+u.lentTo+'<br>'+u.lentDate+'〜</div>':"")
        +'<div style="margin-top:6px"><button class="btn btn-outline btn-sm" style="font-size:.65rem;height:24px;padding:0 7px" onclick="event.stopPropagation();openEdit(\''+u.id+'\')">✏️</button></div>'
        +'</div>';
    }).join("");
    return '<div class="color-section">'
      +'<div class="color-header" style="background:rgba(0,0,0,.2)">'
      +'<div class="color-dot" style="background:'+cg.code+'"></div>'
      +'<div class="color-name">'+cname+'</div>'
      +'<div class="color-count">全'+items.length+'着 ／ <span class="free">在庫'+free+'</span> <span class="lent">貸出'+lent+'</span></div>'
      +'</div>'
      +'<div class="uni-grid">'+cardsHtml+'</div>'
      +'</div>';
  }).join("");
}

function render(){renderStats();renderColorSections();}

function buildColorPicker(selectedName){
  var html=PALETTE.map(function(p){
    var sel=p.name===(selectedName||PALETTE[0].name);
    return '<div class="cp-btn'+(sel?" selected":"")+'" style="background:'+p.code+'" title="'+p.name+'" onclick="selectPaletteColor(\''+p.name+'\',\''+p.code+'\')"></div>';
  }).join("");
  document.getElementById("color-picker").innerHTML=html;
}
function selectPaletteColor(name,code){
  selectedColor={name:name,code:code};
  document.getElementById("u-color-name").value=name;
  document.getElementById("u-color-code").value=code;
  document.querySelectorAll(".cp-btn").forEach(function(b){b.classList.toggle("selected",b.title===name);});
}

function openAdd(){
  editId=null;
  document.getElementById("add-title").textContent="ユニフォームを追加";
  document.getElementById("u-del-btn").style.display="none";
  document.getElementById("u-num").value="";
  document.getElementById("u-size").value="130";
  document.getElementById("u-memo").value="";
  document.getElementById("u-color-name").value=PALETTE[0].name;
  document.getElementById("u-color-code").value=PALETTE[0].code;
  buildColorPicker(PALETTE[0].name);
  document.getElementById("modal-add").classList.add("open");
}
function openEdit(id){
  var u=loadU().find(function(x){return x.id===id;});
  if(!u)return;
  editId=id;
  document.getElementById("add-title").textContent="ユニフォームを編集";
  document.getElementById("u-del-btn").style.display="inline-flex";
  document.getElementById("u-num").value=u.num;
  document.getElementById("u-size").value=u.size;
  document.getElementById("u-memo").value=u.memo||"";
  document.getElementById("u-color-name").value=u.colorName||"";
  document.getElementById("u-color-code").value=u.colorCode||"#1a5fa8";
  buildColorPicker(u.colorName);
  document.getElementById("modal-add").classList.add("open");
}
function saveUni(){
  var num=document.getElementById("u-num").value.trim();
  if(!num){alert("背番号を入力してください");return;}
  var cname=document.getElementById("u-color-name").value.trim()||"その他";
  var ccode=document.getElementById("u-color-code").value;
  var data=loadU();
  var id=editId||("u"+Date.now());
  var existing=data.find(function(x){return x.id===id;});
  var entry=Object.assign(existing||{},{id:id,num:num,size:document.getElementById("u-size").value,memo:document.getElementById("u-memo").value.trim(),colorName:cname,colorCode:ccode});
  if(!existing)data.push(entry);
  saveU(data);closeModal("modal-add");render();
}
function deleteUni(){
  if(!editId||!confirm("削除しますか？"))return;
  saveU(loadU().filter(function(x){return x.id!==editId;}));
  closeModal("modal-add");render();
}

function openLend(id){
  lendId=id;
  var u=loadU().find(function(x){return x.id===id;});
  if(!u)return;
  var isLent=!!u.lentTo;
  document.getElementById("lend-title").textContent="【"+u.colorName+"】#"+u.num+" サイズ"+u.size;
  document.getElementById("lend-info").innerHTML=isLent
    ?"<span style='color:#ff8888'>🔴 貸出中</span><br>借りている人：<strong style='color:#fff'>"+u.lentTo+"</strong><br>貸出日："+u.lentDate+(u.returnDate?"　返却予定："+u.returnDate:"")
    :"<span style='color:#00ff88'>🟢 在庫あり</span>";
  document.getElementById("lend-form").style.display=isLent?"none":"block";
  var btn=document.getElementById("lend-btn");
  if(isLent){btn.textContent="✅ 返却済みにする";btn.onclick=doReturn;}
  else{btn.textContent="📤 貸し出す";btn.onclick=doLend;
    document.getElementById("l-name").value="";
    document.getElementById("l-date").value=new Date().toISOString().slice(0,10);
    document.getElementById("l-return").value="";}
  document.getElementById("modal-lend").classList.add("open");
}
function doLend(){
  var name=document.getElementById("l-name").value.trim();
  if(!name){alert("氏名を入力してください");return;}
  var data=loadU();var u=data.find(function(x){return x.id===lendId;});if(!u)return;
  u.lentTo=name;u.lentDate=document.getElementById("l-date").value;u.returnDate=document.getElementById("l-return").value;
  saveU(data);
  var h=loadH();h.push({type:"貸出",date:u.lentDate,num:u.num,size:u.size,color:u.colorName,name:name,returnDate:u.returnDate||""});saveH(h);
  closeModal("modal-lend");render();
}
function doReturn(){
  var data=loadU();var u=data.find(function(x){return x.id===lendId;});if(!u)return;
  var h=loadH();h.push({type:"返却",date:new Date().toISOString().slice(0,10),num:u.num,size:u.size,color:u.colorName,name:u.lentTo,returnDate:""});saveH(h);
  delete u.lentTo;delete u.lentDate;delete u.returnDate;
  saveU(data);closeModal("modal-lend");render();
}
function showHistory(){
  var h=loadH().reverse();
  var list=document.getElementById("hist-list");
  if(!h.length){list.innerHTML='<div style="color:var(--ink-3);text-align:center;padding:16px;font-size:.85rem">履歴がありません。</div>';
  }else{
    list.innerHTML=h.map(function(x){
      var col=x.type==="貸出"?"#ffaa66":"#66ffaa";
      return '<div class="hist-item">'
        +'<span style="color:'+col+';font-weight:900;font-size:.72rem;white-space:nowrap">'+x.type+'</span>'
        +'<span style="color:var(--ink-3);font-size:.72rem;white-space:nowrap">'+x.date+'</span>'
        +'<span style="color:#fff;white-space:nowrap">'+x.color+' #'+x.num+'('+x.size+')</span>'
        +'<span style="color:var(--cyan)">'+x.name+'</span>'
        +(x.returnDate?'<span style="color:var(--ink-3);font-size:.68rem;white-space:nowrap">予定:'+x.returnDate+'</span>':"")
        +'</div>';
    }).join("");
  }
  document.getElementById("modal-history").classList.add("open");
}
function closeModal(id){document.getElementById(id).classList.remove("open");}
["modal-add","modal-lend","modal-history"].forEach(function(id){
  document.getElementById(id).addEventListener("click",function(e){if(e.target.id===id)closeModal(id);});
});
// カラー入力変更時にpickerを更新
document.getElementById("u-color-code").addEventListener("input",function(e){
  document.querySelectorAll(".cp-btn").forEach(function(b){b.classList.remove("selected");});
});
render();
</script>
</body></html>
