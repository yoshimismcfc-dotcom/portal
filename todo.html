<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>やることリスト｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    /* ===== フィルター・ステータスタブ ===== */
    .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .filter-btn{
      padding:5px 13px;border-radius:99px;border:1px solid var(--line-2);
      background:none;color:var(--ink-3);font:inherit;font-size:.78rem;font-weight:700;
      cursor:pointer;transition:.15s;
    }
    .filter-btn.active{background:var(--orange);border-color:var(--orange);color:#fff}
    .filter-btn.f-done.active{background:#00aa55;border-color:#00aa55}

    /* ===== 主要操作 ===== */
    .todo-actions{
      display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.82fr);
      gap:8px;margin-bottom:14px;
    }
    .todo-actions button{
      width:100%;min-width:0;min-height:48px;padding:8px 12px;border-radius:12px;
      font-size:.82rem;line-height:1.35;text-align:center;white-space:normal;
    }
    .todo-actions .todo-add-btn{font-size:.9rem}

    /* ===== 体育館利用チェックへの定期導線 ===== */
    .facility-shortcut{
      position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:13px;align-items:center;
      margin:0 0 18px;padding:16px;border:3px solid #ff9d42;border-radius:17px;
      background:linear-gradient(135deg,#7a2f00,#c64f12 56%,#9d2337);
      color:#fff;text-decoration:none;box-shadow:0 12px 30px rgba(198,79,18,.34),0 0 0 4px rgba(255,157,66,.09);
      overflow:hidden;transition:transform .16s,box-shadow .16s;
    }
    .facility-shortcut::after{content:"";position:absolute;right:-38px;top:-58px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
    .facility-shortcut:hover,.facility-shortcut:focus-visible{transform:translateY(-2px);box-shadow:0 16px 34px rgba(198,79,18,.42),0 0 0 4px rgba(255,157,66,.18);outline:none}
    .facility-shortcut-icon{display:grid;place-items:center;width:64px;height:64px;border:1px solid rgba(255,255,255,.34);border-radius:16px;background:rgba(255,255,255,.15);font-size:2rem}
    .facility-shortcut-main{min-width:0}.facility-shortcut-kicker{display:inline-flex;margin-bottom:5px;padding:3px 8px;border-radius:999px;background:#fff;color:#8f3200;font-size:.64rem;font-weight:1000;letter-spacing:.04em}
    .facility-shortcut-title{display:block;color:#fff;font-size:1.08rem;font-weight:1000;line-height:1.35}
    .facility-shortcut-desc{display:block;margin-top:3px;color:#fff4e9;font-size:.74rem;font-weight:700;line-height:1.5}
    .facility-shortcut-action{grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:48px;padding:9px 12px;border:2px solid #fff;border-radius:11px;background:#fff;color:#8f3200;font-size:.82rem;font-weight:1000;box-shadow:0 7px 18px rgba(79,21,0,.24)}
    body[data-theme="light"] .facility-shortcut{background:linear-gradient(135deg,#b84200,#e25d17 56%,#b52a40);border-color:#9c3500;color:#fff}
    body[data-theme="light"] .facility-shortcut-desc{color:#fff}
    @media(max-width:520px){.facility-shortcut{grid-template-columns:54px minmax(0,1fr);gap:11px;padding:14px}.facility-shortcut-icon{width:54px;height:54px;font-size:1.7rem}.facility-shortcut-title{font-size:1.02rem}.facility-shortcut-desc{font-size:.76rem}.facility-shortcut-action{font-size:.86rem}}

    /* ===== カード ===== */
    .todo-list{display:grid;gap:10px}
    .todo-card{
      background:var(--surface-lt);border:1px solid var(--line-2);
      border-radius:var(--r12);padding:14px 16px;
      transition:.15s;position:relative;overflow:hidden;
    }
    .todo-card::before{
      content:"";position:absolute;top:0;left:0;width:4px;height:100%;
      background:var(--orange);border-radius:4px 0 0 4px;
    }
    .todo-card.status-done::before{background:#00aa55}
    .todo-card.status-wip::before{background:var(--cyan)}
    .todo-card.status-hold::before{background:#888}
    .todo-card:hover{border-color:var(--orange)}
    .todo-card.status-done{opacity:.65}

    .tc-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
    .tc-check{
      width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;flex-shrink:0;margin-top:1px;transition:.15s;
    }
    .tc-check:hover{border-color:#00aa55}
    .tc-check.checked{background:#00aa55;border-color:#00aa55;color:#fff}
    .tc-title{font-size:.95rem;font-weight:900;color:#fff;flex:1;word-break:break-all}
    .todo-card.status-done .tc-title{text-decoration:line-through;color:var(--ink-3)}
    .tc-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
    .tc-who{
      font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;
      background:rgba(0,212,255,.15);color:var(--cyan);border:1px solid rgba(0,212,255,.3);
    }
    .tc-due{font-size:.72rem;color:var(--ink-3)}
    .tc-due.overdue{color:#ff6680;font-weight:700}
    .tc-note{font-size:.8rem;color:#94c4e4;line-height:1.6;border-top:1px solid var(--line);padding-top:7px;white-space:pre-wrap;word-break:break-all}
    .status-badge{
      font-size:.65rem;font-weight:900;padding:2px 8px;border-radius:4px;margin-left:auto;flex-shrink:0;
    }
    .sb-todo{background:rgba(255,107,43,.2);color:#ff8855;border:1px solid rgba(255,107,43,.3)}
    .sb-wip {background:rgba(0,212,255,.2);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
    .sb-done{background:rgba(0,170,85,.2);color:#00dd66;border:1px solid rgba(0,170,85,.3)}
    .sb-hold{background:rgba(150,150,150,.2);color:#aaa;border:1px solid rgba(150,150,150,.3)}
    .tc-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
    .act-btn{
      font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:6px;
      border:1px solid;background:none;cursor:pointer;transition:.15s;
    }
    .act-btn.edit{color:var(--cyan);border-color:rgba(0,212,255,.35)}
    .act-btn.edit:hover{background:rgba(0,212,255,.12)}
    .act-btn.del{color:#ff6680;border-color:rgba(255,68,102,.35)}
    .act-btn.del:hover{background:rgba(255,68,102,.12)}

    /* 空状態 */
    .empty-msg{text-align:center;color:var(--ink-3);padding:36px;font-size:.88rem}

    /* ===== モーダル ===== */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:200;backdrop-filter:blur(6px);padding:16px}
    .modal-bg.open{display:grid}
    .modal{background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r16);padding:22px;width:min(440px,100%);box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
    .modal h3{font-size:.95rem;font-weight:900;color:#fff;margin-bottom:14px}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:420px){.fg2{grid-template-columns:1fr}}

    /* ===== 統計バー ===== */
    .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .stat-card{background:var(--surface-lt);border-radius:var(--r8);padding:10px;text-align:center;border:1px solid var(--line)}
    .stat-card .sv{font-size:1.4rem;font-weight:900;color:#fff}
    .stat-card .sl{font-size:.65rem;color:var(--ink-3);margin-top:1px}

    /* スマホでは主要操作を上段に独立させ、文字を無理に改行させない。 */
    @media(max-width:520px){
      .todo-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .todo-actions .todo-add-btn{
        grid-column:1/-1;min-height:54px;font-size:1rem;white-space:nowrap;
      }
      .todo-actions button:not(.todo-add-btn){min-height:50px;font-size:.86rem}
      .facility-shortcut-title{font-size:1rem}
      .facility-shortcut-desc{font-size:.78rem;line-height:1.6}
      .stat-card{padding:11px 6px}
      .stat-card .sv{font-size:1.5rem}
      .stat-card .sl{font-size:.76rem}
      .filter-bar{gap:8px}
      .filter-btn{min-height:42px;padding:7px 14px;font-size:.82rem}
      .tc-title{font-size:1rem;line-height:1.45}
      .tc-who,.tc-due{font-size:.78rem}
      .tc-note{font-size:.86rem;line-height:1.7}
      .status-badge{font-size:.72rem;padding:3px 8px}
      .act-btn{min-height:42px;font-size:.78rem;padding:7px 12px}
    }
  </style>
</head>
<body>
<header class="site-header"></header>
<main class="page-wrap">
  <a class="back-btn" id="todo-back" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📌</div>
    <div>
      <div class="hero-title">やることリスト</div>
      <div class="hero-sub">誰が・何をやるかを記録。忘れずに、チーム全員でタスクを共有できます。</div>
    </div>
  </div>
  <div class="notice-bar">☁️ データはFirebase（クラウド）で保存・共有されます。</div>

  <a class="facility-shortcut" href="facility_check.html" aria-label="体育館利用チェックを開く">
    <span class="facility-shortcut-icon" aria-hidden="true">🏫</span>
    <span class="facility-shortcut-main"><span class="facility-shortcut-kicker">重要｜毎週 水・木</span><span class="facility-shortcut-title">体育館を使ったら必ず確認</span><span class="facility-shortcut-desc">利用後に忘れ物・設備・モップ・ごみ・電気・鍵をチェックします。</span></span>
    <span class="facility-shortcut-action">体育館利用チェックを開く →</span>
  </a>

  <!-- 統計 -->
  <div class="stat-row" id="stat-row"></div>

  <!-- 操作ボタン -->
  <div class="todo-actions" aria-label="タスクの操作">
    <button class="btn btn-primary todo-add-btn" onclick="openNew()">＋ タスクを追加</button>
    <button class="btn btn-outline btn-sm" onclick="clearDone()">✅ 完了済みを削除</button>
    <button class="btn-line-copy sm" onclick="copyTodoList()">📋 LINEコピー</button>
  </div>

  <!-- フィルター -->
  <div class="filter-bar">
    <button class="filter-btn active" data-f="all"  onclick="setFilter('all', this)">すべて</button>
    <button class="filter-btn"        data-f="todo" onclick="setFilter('todo',this)">未着手</button>
    <button class="filter-btn"        data-f="wip"  onclick="setFilter('wip', this)">進行中</button>
    <button class="filter-btn f-done" data-f="done" onclick="setFilter('done',this)">完了</button>
    <button class="filter-btn"        data-f="hold" onclick="setFilter('hold',this)">保留</button>
  </div>

  <div class="todo-list" id="todo-list"></div>
</main>

<!-- 追加/編集モーダル -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">タスクを追加</h3>
    <div class="form-group">
      <label class="form-label">📋 やること（タイトル）<span style="color:var(--red)">*</span></label>
      <input class="form-control" id="t-title" placeholder="例：大会要綱を印刷する">
    </div>
    <div class="fg2">
      <div class="form-group">
        <label class="form-label">👤 担当者</label>
        <input class="form-control" id="t-who" placeholder="例：片山コーチ">
      </div>
      <div class="form-group">
        <label class="form-label">📅 期限</label>
        <input class="form-control" id="t-due" type="date">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">🏷️ ステータス</label>
      <select class="form-control" id="t-status">
        <option value="todo">未着手</option>
        <option value="wip">進行中</option>
        <option value="done">完了</option>
        <option value="hold">保留</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">📝 備考・メモ</label>
      <textarea class="form-control" id="t-note" rows="3" placeholder="例：7月4日の大会分。2部ずつ印刷すること。"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline btn-sm" id="del-btn" style="color:var(--red);border-color:rgba(255,68,102,.4);display:none" onclick="deleteTask()">🗑 削除</button>
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveTask()">💾 保存</button>
    </div>
  </div>
</div>

<footer class="site-footer"></footer>
<script>
var KEY = "smc_todo_v1";
var editId = null, currentFilter = "all";
var _todoData = [];

function load(){ return _todoData; }
function save(d){
  _todoData = d;
  localStorage.setItem(KEY, JSON.stringify(d));
  dbSave("todo", d, KEY, null);
}

// リアルタイム同期
// localStorageからも読み込む（オフライン対応）
try {
  var _local = JSON.parse(localStorage.getItem(KEY) || "[]");
  if(Array.isArray(_local) && _local.length > 0) _todoData = _local;
} catch(e) {}

window.addEventListener("DOMContentLoaded", function(){
  var p=new URLSearchParams(location.search);
  var back=document.getElementById("todo-back");
  if(p.get("from")==="coach"&&back){
    back.href="coach.html";
    back.textContent="コーチ専用フォルダに戻る";
  }
  renderStats(); renderList();
  dbListen("todo", function(val){
    // 空配列も「全件削除された最新データ」として受け入れる
    if(Array.isArray(val)){
      _todoData = val;
    }
    renderStats(); renderList();
  }, KEY, []);
});

var STATUS_MAP = {
  todo:{ label:"未着手", cls:"sb-todo" },
  wip: { label:"進行中", cls:"sb-wip"  },
  done:{ label:"完了",   cls:"sb-done" },
  hold:{ label:"保留",   cls:"sb-hold" },
};

function renderStats(){
  var d=load();
  var counts={todo:0,wip:0,done:0,hold:0};
  d.forEach(function(t){ if(counts[t.status]!==undefined) counts[t.status]++; });
  document.getElementById("stat-row").innerHTML=
    '<div class="stat-card"><div class="sv">'+d.length+'</div><div class="sl">全タスク</div></div>'
    +'<div class="stat-card"><div class="sv" style="color:#ff8855">'+counts.todo+'</div><div class="sl">未着手</div></div>'
    +'<div class="stat-card"><div class="sv" style="color:var(--cyan)">'+counts.wip+'</div><div class="sl">進行中</div></div>'
    +'<div class="stat-card"><div class="sv" style="color:#00dd66">'+counts.done+'</div><div class="sl">完了</div></div>';
}

function renderList(){
  var data = load();
  // フィルター
  if(currentFilter !== "all") data = data.filter(function(t){ return t.status === currentFilter; });
  // ソート：未完了→進行中→未着手→保留→完了、期限近い順
  var order = {wip:0, todo:1, hold:2, done:3};
  data.sort(function(a,b){
    var od = (order[a.status]||9) - (order[b.status]||9);
    if(od !== 0) return od;
    if(a.due && b.due) return a.due.localeCompare(b.due);
    if(a.due) return -1;
    if(b.due) return 1;
    return b.created - a.created;
  });
  var list = document.getElementById("todo-list");
  if(!data.length){
    list.innerHTML = '<div class="empty-msg">タスクがありません。「＋ タスクを追加」から登録してください。</div>';
    return;
  }
  var today = new Date().toISOString().slice(0,10);
  list.innerHTML = data.map(function(t){
    var sm = STATUS_MAP[t.status] || STATUS_MAP.todo;
    var isDone = t.status === "done";
    var checkHtml = '<div class="tc-check'+(isDone?" checked":"")+'" onclick="toggleDone('+inlineJsArg(t.id)+')">'+(isDone?"✓":"")+'</div>';
    var dueHtml = "";
    if(t.due){
      var overdue = !isDone && t.due < today;
      dueHtml = '<span class="tc-due'+(overdue?" overdue":"")+'">📅 '+(overdue?"⚠️ 期限超過：":"")+t.due+'</span>';
    }
    var noteHtml = t.note ? '<div class="tc-note">'+escHtml(t.note)+'</div>' : "";
    return '<div class="todo-card status-'+t.status+'">'
      +'<div class="tc-header">'
      +checkHtml
      +'<div class="tc-title">'+escHtml(t.title)+'</div>'
      +'<span class="status-badge '+sm.cls+'">'+sm.label+'</span>'
      +'</div>'
      +'<div class="tc-meta">'
      +(t.who?'<span class="tc-who">👤 '+escHtml(t.who)+'</span>':"")
      +dueHtml
      +'</div>'
      +noteHtml
      +'<div class="tc-actions">'
      +'<button class="act-btn edit" onclick="openEdit('+inlineJsArg(t.id)+')">✏️ 編集</button>'
      +'<button class="act-btn del"  onclick="confirmDel('+inlineJsArg(t.id)+')">🗑 削除</button>'
      +'</div>'
      +'</div>';
  }).join("");
}

function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  renderList();
}

function toggleDone(id){
  var data = load();
  var t = data.find(function(x){ return x.id === id; });
  if(!t) return;
  t.status = t.status === "done" ? "todo" : "done";
  save(data); render();
}

function openNew(){
  editId = null;
  document.getElementById("modal-title").textContent = "タスクを追加";
  document.getElementById("del-btn").style.display = "none";
  document.getElementById("t-title").value = "";
  document.getElementById("t-who").value = "";
  document.getElementById("t-due").value = "";
  document.getElementById("t-status").value = "todo";
  document.getElementById("t-note").value = "";
  document.getElementById("modal").classList.add("open");
}
function openEdit(id){
  var t = load().find(function(x){ return x.id === id; });
  if(!t) return;
  editId = id;
  document.getElementById("modal-title").textContent = "タスクを編集";
  document.getElementById("del-btn").style.display = "inline-flex";
  document.getElementById("t-title").value = t.title;
  document.getElementById("t-who").value = t.who || "";
  document.getElementById("t-due").value = t.due || "";
  document.getElementById("t-status").value = t.status;
  document.getElementById("t-note").value = t.note || "";
  document.getElementById("modal").classList.add("open");
}
function saveTask(){
  var title = document.getElementById("t-title").value.trim();
  if(!title){ alert("やること（タイトル）を入力してください"); return; }
  var data = load();
  var id = editId || ("td" + Date.now());
  var exist = data.find(function(x){ return x.id === id; });
  var entry = Object.assign(exist || { id: id, created: Date.now() }, {
    title: title,
    who:    document.getElementById("t-who").value.trim(),
    due:    document.getElementById("t-due").value,
    status: document.getElementById("t-status").value,
    note:   document.getElementById("t-note").value.trim(),
  });
  if(!exist) data.push(entry);
  save(data); closeModal(); render();
}
function deleteTask(){
  if(!editId || !confirm("このタスクを削除しますか？")) return;
  save(load().filter(function(x){ return x.id !== editId; }));
  closeModal(); render();
}
function confirmDel(id){
  var t = load().find(function(x){ return x.id === id; });
  if(!t) return;
  if(!confirm("「"+t.title+"」を削除しますか？")) return;
  save(load().filter(function(x){ return x.id !== id; }));
  render();
}
function clearDone(){
  var data = load();
  var done = data.filter(function(t){ return t.status==="done"; });
  if(!done.length){ alert("完了済みのタスクがありません。"); return; }
  if(!confirm("完了済みの"+done.length+"件を削除しますか？")) return;
  save(data.filter(function(t){ return t.status!=="done"; }));
  render();
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").addEventListener("click", function(e){ if(e.target.id==="modal") closeModal(); });

function render(){ renderStats(); renderList(); }
// サンプルデータ（初回のみ）
// サンプル自動投入は入力済みデータを上書きする原因になるため停止。
function copyTodoList(){
  var active = _todoData.filter(function(t){ return t.status !== "done"; });
  if(!active.length){ alert("未完了のタスクがありません"); return; }
  var STATUS = {todo:"⬜ 未着手", wip:"🔄 進行中", hold:"⏸ 保留"};
  var t = "【やることリスト】\n\n";
  active.forEach(function(item){
    t += (STATUS[item.status]||"⬜") + " " + item.title + "\n";
    if(item.who)  t += "   担当：" + item.who  + "\n";
    if(item.due)  t += "   期限：" + item.due  + "\n";
    if(item.note) t += "   メモ：" + item.note + "\n";
  });
  navigator.clipboard.writeText(t)
    .then(function(){ alert("コピーしました！LINEに貼り付けてください。"); })
    .catch(function(){ alert("コピーできませんでした。"); });
}
</script>
</body>
</html>
