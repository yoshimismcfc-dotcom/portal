<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出欠確認｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <style>
    .attend-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .attend-card{
      background:var(--surface-lt);border-radius:var(--r16);border:2px solid var(--line-2);
      padding:18px 10px;display:flex;flex-direction:column;gap:10px;
      box-shadow:var(--shadow);text-align:center;transition:.18s;
    }
    .attend-card:hover{border-color:var(--cyan);box-shadow:var(--glow-c),var(--shadow)}
    .attend-card.coach-card{border-color:rgba(0,212,255,.4)}
    .attend-card.coach-card:hover{border-color:var(--orange);box-shadow:var(--glow-o),var(--shadow)}
    .attend-card .card-emoji{font-size:2rem;filter:drop-shadow(0 0 8px rgba(255,107,43,.4))}
    .attend-card .card-title{font-size:1rem;font-weight:900;color:#ffffff}
    .attend-card .card-subtitle{font-size:.72rem;color:#a8d4f0;margin-top:2px;line-height:1.45}
    .attend-card .btn{width:100%;min-height:44px;padding:10px 6px;font-size:.78rem;line-height:1.35;white-space:normal;word-break:keep-all}
    .auto-alert{border-radius:var(--r12);padding:12px 14px;margin-bottom:12px;border:1px solid;display:none;gap:8px;flex-direction:column}
    .auto-alert.show{display:flex}
    .auto-alert.alert-rain{background:rgba(68,136,255,.12);border-color:rgba(68,136,255,.4)}
    .auto-alert.alert-heat{background:rgba(255,68,68,.12);border-color:rgba(255,68,68,.4)}
    .alert-title{font-size:.88rem;font-weight:900;display:flex;align-items:center;gap:7px}
    .alert-rain .alert-title{color:#93c5fd}
    .alert-heat .alert-title{color:#fca5a5}
    .alert-body{font-size:.8rem;line-height:1.7;white-space:pre-line}
    .alert-rain .alert-body{color:#bfdbfe}
    .alert-heat .alert-body{color:#fecaca}
    @media(max-width:380px){
      .attend-grid{gap:8px}
      .attend-card{padding:15px 8px;border-radius:var(--r12)}
      .attend-card .card-emoji{font-size:1.75rem}
      .attend-card .card-title{font-size:.92rem}
      .attend-card .card-subtitle{font-size:.66rem}
      .attend-card .btn{font-size:.72rem;padding:9px 4px}
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">✋</div>
    <div><div class="hero-title">出欠確認</div>
      <div class="hero-sub">回答先が異なります。間違えないようご注意ください。</div></div>
  </div>

  <div id="page-guidance" class="dynamic-notice guidance" style="display:none"><span class="notice-label">📢 INFO</span><span id="guidance-text"></span></div>
  <div id="page-warning"  class="dynamic-notice warning"  style="display:none"><span class="notice-label">⚠️ ALERT</span><span id="warning-text"></span></div>
  <div class="auto-alert alert-rain" id="auto-rain">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="alert-title" style="flex:1">🌧️ 雨の予報 — 出欠回答前に確認してください</div>
      <button onclick="copyAlert('rain')" class="btn-line-copy sm" style="flex-shrink:0">📋 LINEコピー</button>
    </div>
    <div class="alert-body" id="auto-rain-body"></div>
  </div>
  <div class="auto-alert alert-heat" id="auto-heat">
    <div class="alert-title">🌡️ 熱中症注意 — 持ち物を確認してください</div>
    <div class="alert-body" id="auto-heat-body"></div>
  </div>

  <div class="attend-grid">
    <!-- 団員 -->
    <div class="attend-card">
      <div class="card-emoji">⚽</div>
      <div><div class="card-title">団員</div>
        <div class="card-subtitle">練習・試合の出欠はこちら</div></div>
      <a class="btn btn-primary btn-lg"
         href="https://chouseisan.com/s?h=04a01b20cc2b4a38b3e1f4aa93d1d06c"
         target="_blank" rel="noopener" style="text-align:center">
        📅 回答する（団員）
      </a>
    </div>
    <!-- コーチ -->
    <div class="attend-card coach-card">
      <div class="card-emoji">🧑‍🏫</div>
      <div><div class="card-title">コーチ</div>
        <div class="card-subtitle">練習参加・試合帯同の可否</div></div>
      <a class="btn btn-cyan btn-lg"
         href="https://chouseisan.com/s?h=20c37e0538dd4feb8d91d8e31be23ad3"
         target="_blank" rel="noopener" style="text-align:center">
        📅 回答する（コーチ）
      </a>
    </div>
  </div>
</main>
<footer class="site-footer">YOSHIMI SMC FC — SMART PORTAL</footer>
<script src="common.js"></script>
<script>
function setNotice(id,textId,val,display){
  var el=document.getElementById(id),tx=document.getElementById(textId);
  if(!el||!tx)return;
  if(val){tx.textContent=val;el.style.display=display||"flex";}else{el.style.display="none";}
}
dbListen("notices/guidance",function(val){setNotice("page-guidance","guidance-text",val);},"smc_guidance",null);
dbListen("notices/warning",function(val){setNotice("page-warning","warning-text",val);},"smc_warning",null);
setNotice("page-guidance","guidance-text",localStorage.getItem("smc_guidance"));
setNotice("page-warning","warning-text",localStorage.getItem("smc_warning"));

var ALERT_KEY="smc_alert_settings_v1";
var DEFAULT_SCHEDULES=[{day:3,start:"19:00",end:"21:00",indoor:true},{day:4,start:"18:30",end:"20:30",indoor:true},{day:6,start:"08:00",end:"10:30",indoor:false},{day:0,start:"08:00",end:"10:30",indoor:false}];
var DEFAULT_ALERT_CFG={schedules:DEFAULT_SCHEDULES,rainThreshold:30,heatThreshold:25,rainVenue:"北小体育館",rainOdd:"奇数月：6〜4年 8:00〜10:00 ／ 3年〜年長 10:00〜12:00",rainEven:"偶数月：3年〜年長 8:00〜10:00 ／ 6〜4年 10:00〜12:00"};
var ALERT_CFG=DEFAULT_ALERT_CFG;
dbListen("alert_settings",function(val){
  if(val&&val.schedules)ALERT_CFG=val;
  else{try{var s=localStorage.getItem(ALERT_KEY);if(s)ALERT_CFG=JSON.parse(s);}catch(e){}}
},ALERT_KEY,null);
function wbgt(t,h){return 0.735*t+0.0374*h+0.00292*t*h-4.064;}
function findNextAlertSchedule(){
  var now=new Date(),scheds=ALERT_CFG.schedules||DEFAULT_SCHEDULES,startHour=ALERT_CFG.alertStartHour!==undefined?ALERT_CFG.alertStartHour:0;
  for(var d=0;d<4;d++){
    var dt=new Date(now);dt.setDate(dt.getDate()+d);
    for(var i=0;i<scheds.length;i++){
      var s=scheds[i];if(s.day!==dt.getDay())continue;
      var at=new Date(dt);at.setHours(startHour,0,0,0);
      if(now>=at||d>0)return{s:s,dt:dt,offset:d};
    }
  }
  return null;
}
function checkAutoAlert(){
  if(!navigator.geolocation)return;
  var info=findNextAlertSchedule();if(!info||info.s.indoor)return;
  navigator.geolocation.getCurrentPosition(function(pos){
    var url="https://api.open-meteo.com/v1/forecast?latitude="+pos.coords.latitude+"&longitude="+pos.coords.longitude+"&hourly=temperature_2m,relative_humidity_2m,weathercode,precipitation_probability&timezone=Asia/Tokyo&forecast_days=3";
    fetch(url).then(function(r){return r.json();}).then(function(data){
      var hours=data.hourly,sd=info.dt,dateStr=sd.getFullYear()+"-"+String(sd.getMonth()+1).padStart(2,"0")+"-"+String(sd.getDate()).padStart(2,"0");
      var sh=+info.s.start.split(":")[0],eh=+info.s.end.split(":")[0],rainMax=0,wbgtMax=0,hasRain=false,rainTh=ALERT_CFG.rainThreshold||30;
      hours.time.forEach(function(t,i){
        if(!t.startsWith(dateStr))return;var h=+t.slice(11,13);if(h<sh||h>eh)return;
        var pp=hours.precipitation_probability[i]||0,wc=hours.weathercode[i]||0,wb=wbgt(hours.temperature_2m[i],hours.relative_humidity_2m[i]);
        if(pp>=rainTh||wc>=51)hasRain=true;if(pp>rainMax)rainMax=pp;if(wb>wbgtMax)wbgtMax=wb;
      });
      var dow=["日","月","火","水","木","金","土"][sd.getDay()],label=info.offset===0?"本日":"明日("+dow+")",mon=sd.getMonth()+1,isOdd=mon%2===1;
      if(hasRain){
        document.getElementById("auto-rain-body").textContent=label+"の屋外練習に雨の予報（降水確率"+rainMax+"%）があります。\n・室内用シューズをご用意ください\n・練習時間・場所が変更になる場合があります\n・雨天時の会場："+(ALERT_CFG.rainVenue||"北小体育館")+"\n・"+(isOdd?(ALERT_CFG.rainOdd||""):(ALERT_CFG.rainEven||""));
        document.getElementById("auto-rain").classList.add("show");
      }
      var heatTh=ALERT_CFG.heatThreshold||25;
      if(wbgtMax>=heatTh){
        var lv=wbgtMax>=31?"危険":wbgtMax>=28?"厳重警戒":"警戒";
        document.getElementById("auto-heat-body").textContent=label+"の練習時間帯にWBGT "+wbgtMax.toFixed(1)+"℃（"+lv+"）の予報があります。\n・帽子を必ず着用してください\n・水筒は2本（水＋スポーツドリンク）持参してください\n・保冷剤・タオルがあると安心です"+(wbgtMax>=31?"\n⛔ WBGT31℃以上は活動中止基準です":"");
        document.getElementById("auto-heat").classList.add("show");
      }
    }).catch(function(){});
  },function(){},{timeout:8000,maximumAge:1800000});
}
function copyAlert(type){
  var el=document.getElementById("auto-"+type+"-body");
  if(!el||!el.textContent.trim()){alert("アラートが表示されていません");return;}
  var prefix=type==="rain"?"🌧️ 雨の予報\n":"🌡️ 熱中症注意\n";
  navigator.clipboard.writeText(prefix+el.textContent).then(function(){alert("コピーしました！LINEに貼り付けてください。");}).catch(function(){alert("コピーできませんでした。");});
}
window.addEventListener("DOMContentLoaded",checkAutoAlert);
</script>
</body></html>
