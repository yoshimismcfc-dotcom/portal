<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出欠確認・参加案内｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <script src="calendar-attendance.js"></script>
  <script src="common.js"></script>
  <style>
    .attend-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .attend-card{
      background:var(--surface-lt);border-radius:var(--r16);border:2px solid var(--line-2);
      padding:18px 10px;display:flex;flex-direction:column;gap:10px;
      box-shadow:var(--shadow);text-align:center;transition:.18s;
    }
    .attend-card:hover{border-color:var(--cyan);box-shadow:var(--glow-c),var(--shadow)}
    .attend-card.coach-card{border-color:rgba(0,212,255,.4)}
    .attend-card.coach-card:hover{border-color:var(--orange);box-shadow:var(--glow-o),var(--shadow)}
    .attend-card .card-emoji{font-size:2rem;filter:drop-shadow(0 0 8px rgba(255,107,43,.4))}
    .attend-card .card-title{font-size:1rem;font-weight:900;color:#ffffff}
    .attend-card .card-subtitle{font-size:.72rem;color:#a8d4f0;margin-top:2px;line-height:1.45}
    .attend-card .btn{width:100%;min-height:44px;padding:10px 6px;font-size:.78rem;line-height:1.35;white-space:normal;word-break:keep-all}
    
    @media(max-width:380px){
      .attend-grid{gap:8px}
      .attend-card{padding:15px 8px;border-radius:var(--r12)}
      .attend-card .card-emoji{font-size:1.75rem}
      .attend-card .card-title{font-size:.92rem}
      .attend-card .card-subtitle{font-size:.66rem}
      .attend-card .btn{font-size:.72rem;padding:9px 4px}
    }
  </style>
</head>
<body>
<header class="site-header"></header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">✋</div>
    <div><div class="hero-title">出欠確認・参加案内</div>
      <div class="hero-sub">出欠回答と、試合参加のLINE案内をまとめています。</div></div>
  </div>

  <div id="page-guidance" class="dynamic-notice guidance" style="display:none"><span class="notice-label">📢 INFO</span><span id="guidance-text"></span></div>
  <div id="page-warning"  class="dynamic-notice warning"  style="display:none"><span class="notice-label">⚠️ ALERT</span><span id="warning-text"></span></div>
  <div class="auto-alert alert-rain" id="auto-rain" role="status" aria-live="polite">
    <div class="auto-alert-head">
      <div class="alert-title"><span class="auto-alert-label">自動アラート</span><span>🌧️ 雨の予報</span></div>
      <button onclick="copyAlert('rain')" class="btn-line-copy sm">📋 LINEコピー</button>
    </div>
    <div class="alert-body" id="auto-rain-body"></div>
  </div>
  <div class="auto-alert alert-heat" id="auto-heat" role="status" aria-live="polite">
    <div class="auto-alert-head">
      <div class="alert-title"><span class="auto-alert-label">自動アラート</span><span>🌡️ 熱中症注意</span></div>
      <button onclick="copyAlert('heat')" class="btn-line-copy sm">📋 LINEコピー</button>
    </div>
    <div class="alert-body" id="auto-heat-body"></div>
  </div>

  <div class="attend-grid">
    <!-- 団員 -->
    <div class="attend-card">
      <div class="card-emoji">⚽</div>
      <div><div class="card-title">団員</div>
        <div class="card-subtitle">練習・試合の出欠はこちら</div></div>
      <a class="btn btn-primary btn-lg"
         href="https://chouseisan.com/s?h=04a01b20cc2b4a38b3e1f4aa93d1d06c"
         target="_blank" rel="noopener" style="text-align:center">
        📅 回答する（団員）
      </a>
    </div>
    <!-- コーチ -->
    <div class="attend-card coach-card">
      <div class="card-emoji">🧑‍🏫</div>
      <div><div class="card-title">コーチ</div>
        <div class="card-subtitle">練習参加・試合帯同の可否</div></div>
      <a class="btn btn-cyan btn-lg"
         href="https://chouseisan.com/s?h=20c37e0538dd4feb8d91d8e31be23ad3"
         target="_blank" rel="noopener" style="text-align:center">
        📅 回答する（コーチ）
      </a>
    </div>
  </div>

  <section class="calendar-attendance attendance-page-panel" id="match-attendance" aria-labelledby="calendar-attendance-title">
    <div class="calendar-attendance-head">
      <div>
        <h2 class="calendar-attendance-title" id="calendar-attendance-title">📣 保護者向け・試合参加のご案内</h2>
        <p class="calendar-attendance-help">カレンダーに登録された今後90日間の「タイトル・日付・調整さんURL」を自動でまとめます。</p>
      </div>
      <div class="calendar-upcoming-actions">
        <span class="calendar-upcoming-badge" id="calendar-attendance-count">確認中</span>
        <button class="calendar-upcoming-refresh" id="calendar-attendance-refresh" type="button" aria-label="試合参加の案内を最新状態に更新">↻ 更新</button>
      </div>
    </div>
    <div class="calendar-attendance-list" id="calendar-attendance-list" aria-live="polite">
      <div class="calendar-upcoming-state">カレンダーから予定を確認しています…</div>
    </div>
    <button class="calendar-attendance-copy btn-line-copy" id="calendar-attendance-copy" type="button" data-usage-event="line_copy" disabled>📋 保護者向けLINE文を一括コピー</button>
    <p class="calendar-attendance-status" id="calendar-attendance-status" role="status" aria-live="polite"></p>
  </section>
</main>
<footer class="site-footer"></footer>
<script>
function setNotice(id,textId,val,display){
  var el=document.getElementById(id),tx=document.getElementById(textId);
  if(!el||!tx)return;
  if(val){tx.textContent=val;el.style.display=display||"flex";}else{el.style.display="none";}
}
dbListen("notices/guidance",function(val){setNotice("page-guidance","guidance-text",val);},"smc_guidance",null);
dbListen("notices/warning",function(val){setNotice("page-warning","warning-text",val);},"smc_warning",null);
setNotice("page-guidance","guidance-text",localStorage.getItem("smc_guidance"));
setNotice("page-warning","warning-text",localStorage.getItem("smc_warning"));


</script>
</body></html>
