<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>団員名簿｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <style>
    .roster-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r12);border:1px solid var(--line-2)}
    .roster-table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.82rem}
    .roster-table th,.roster-table td{border:1px solid var(--line-2);padding:0;vertical-align:top;white-space:nowrap}
    .col-no{width:28px;text-align:center;color:#6aaccc;font-size:.72rem;background:rgba(0,212,255,.06);padding:6px 3px;position:sticky;left:0;z-index:10;border-right:2px solid var(--line-2)!important}
    .roster-table thead .col-no{background:rgba(0,212,255,.14);font-size:.68rem;font-weight:900;color:var(--cyan);position:sticky;left:0;z-index:22}
    .roster-table thead tr:first-child th.grade-head{background:rgba(0,48,135,.45);color:#fff;font-size:.78rem;font-weight:900;text-align:center;padding:7px 10px;letter-spacing:.06em;border-bottom:2px solid rgba(0,212,255,.4)!important;position:sticky;top:0;z-index:15;min-width:110px}
    .roster-table thead tr:first-child .col-no{position:sticky;left:0;top:0;z-index:25;background:rgba(0,48,135,.45)}
    .name-cell{min-width:112px;padding:4px 9px 6px;cursor:pointer;transition:.12s}
    .name-cell:hover{background:rgba(0,212,255,.08)}
    .name-cell .kana{font-size:.58rem;color:#6aaccc;line-height:1.3;margin-bottom:1px}
    .name-cell .kanji{font-size:.96rem;font-weight:900;color:#fff;line-height:1.2;letter-spacing:.04em}
    .name-cell .num-badge{font-size:.58rem;color:#ffaa66;margin-top:1px}
    .name-cell .gender-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
    .name-cell.girl .kanji{color:#ff8888}
    .name-cell.girl .kana{color:#ffaaaa}
    .name-cell.empty{min-width:112px;height:52px;cursor:pointer}
    .name-cell.empty:hover{background:rgba(255,255,255,.04)}
    .edit-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:200;backdrop-filter:blur(6px)}
    .edit-modal-bg.open{display:grid}
    .edit-modal{background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r16);padding:22px;width:min(360px,92vw);box-shadow:var(--shadow-lg)}
    .edit-modal h3{font-size:.92rem;font-weight:900;color:#fff;margin-bottom:14px}
    .edit-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    .gender-radio{display:flex;gap:16px;margin-top:4px}
    .gender-radio label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.9rem;color:#c8e8ff}
    .gender-radio input{width:auto;height:auto}
    .save-bar{position:sticky;bottom:0;background:rgba(10,31,48,.97);border-top:1px solid var(--line-2);padding:10px 0;display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px}
    .save-msg{font-size:.82rem;color:#00ff88;min-height:1.2em;flex:1}
    .legend-bar{display:flex;gap:14px;align-items:center;font-size:.75rem;color:#6aaccc;margin-bottom:10px;flex-wrap:wrap}
    .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📒</div>
    <div><div class="hero-title">団員名簿</div>
      <div class="hero-sub">2026年度 SMC学年別名簿。氏名をタップして編集できます。</div></div>
  </div>
  <div class="notice-bar">💾 ☁️ データはクラウド（Firebase）で保存・共有されます。セルをタップして編集できます。</div>
  <div class="panel">
    <div class="legend-bar">
      <span><span class="legend-dot" style="background:#6aaccc"></span>男子</span>
      <span><span class="legend-dot" style="background:#ff8888"></span>女子（赤字）</span>
      <span style="color:#ffaa66">※ #番号 = 背番号</span>
    </div>
    <div class="roster-wrap">
      <table class="roster-table" id="roster-table"></table>
    </div>
    <div id="sorted-view" style="display:none;overflow-x:auto;border-radius:var(--r12);border:1px solid var(--line-2)"></div>
    <div class="save-bar">
      <span class="save-msg" id="save-msg"></span>
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 CSV出力</button>
      <button class="btn btn-primary" onclick="saveData()">💾 保存</button>
    </div>
  </div>
</main>

<div class="edit-modal-bg" id="edit-modal">
  <div class="edit-modal">
    <h3 id="edit-title">団員を編集</h3>
    <div class="form-group"><label class="form-label">氏名（漢字）</label>
      <input class="form-control" id="edit-name" placeholder="例：吉見　太郎"></div>
    <div class="form-group"><label class="form-label">ふりがな</label>
      <input class="form-control" id="edit-kana" placeholder="例：よしみ　たろう"></div>
    <div class="form-group"><label class="form-label">背番号</label>
      <input class="form-control" id="edit-num" placeholder="例：10" style="text-align:center"></div>
    <div class="form-group">
      <label class="form-label">性別</label>
      <div class="gender-radio">
        <label><input type="radio" name="edit-gender" value="m" id="edit-g-m"> 男子</label>
        <label><input type="radio" name="edit-gender" value="f" id="edit-g-f"> 女子（赤字）</label>
      </div>
    </div>
    <div class="edit-modal-btns">
      <button class="btn btn-outline btn-sm" id="edit-del-btn" style="color:var(--red);border-color:rgba(255,68,102,.4)" onclick="deleteEntry()">🗑 削除</button>
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<footer class="site-footer">YOSHIMI SMC FC — SMART PORTAL</footer>
<script>
var GRADES=["6年","5年","4年","3年","2年","1年","年長"];
var KEY="smc_members_v4";
var ROWS=14;
var currentSort="none";
var editGrade=null, editRow=null;

var INIT={
  "6年":[
    {name:"有瀧　晴一",   kana:"ありたき　はるいち",     num:"",gender:"m"},
    {name:"石川　日向葵", kana:"いしかわ　ひなたあおい",  num:"",gender:"f"},
    {name:"一場　純",     kana:"いちば　じゅん",          num:"",gender:"m"},
    {name:"岡野　楓斗",   kana:"おかの　はやと",          num:"",gender:"m"},
    {name:"金井　暖記",   kana:"かない　はるき",          num:"",gender:"m"},
    {name:"笹野　陽青",   kana:"ささの　はるせ",          num:"",gender:"m"},
    {name:"武部　陽樹",   kana:"たけべ　はるき",          num:"",gender:"m"},
    {name:"長嶋　蓮弥",   kana:"ながしま　れんや",        num:"",gender:"m"},
    null,null,null,null,null,null
  ],
  "5年":[
    {name:"上村　夏萌",   kana:"かみむら　なつめ",        num:"",gender:"f"},
    {name:"木村　玲菜",   kana:"きむら　れいな",          num:"",gender:"f"},
    {name:"澤井　怜央",   kana:"さわい　れお",            num:"",gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null
  ],
  "4年":[
    {name:"金井　勇記",    kana:"かない　ゆうき",         num:"",gender:"m"},
    {name:"功刀　莉愛",    kana:"くぬぎ　りお",           num:"",gender:"f"},
    {name:"小柳　柊真",    kana:"こやなぎ　とうま",       num:"",gender:"m"},
    {name:"谷口　じゅんな",kana:"たにぐち　じゅんな",     num:"",gender:"f"},
    null,null,null,null,null,null,null,null,null,null
  ],
  "3年":[
    {name:"石川　幸乃羽", kana:"いしかわ　このは",        num:"",gender:"f"},
    {name:"加藤　陸",     kana:"かとう　りく",            num:"",gender:"m"},
    {name:"上村　葵",     kana:"かみむら　あおい",        num:"",gender:"f"},
    {name:"北村　悠真",   kana:"きたむら　はるま",        num:"",gender:"m"},
    {name:"木村　翔馬",   kana:"きむら　しょうま",        num:"",gender:"m"},
    {name:"小林　蒼",     kana:"こばやし　あおい",        num:"",gender:"m"},
    {name:"坂上　大珠",   kana:"さかうえ　たいじゅ",      num:"",gender:"m"},
    {name:"篠田　和希",   kana:"しのだ　ともき",          num:"",gender:"m"},
    {name:"芝嵜　理矩",   kana:"しばさき　りく",          num:"",gender:"m"},
    {name:"柴田　凌玖",   kana:"しばた　りく",            num:"",gender:"m"},
    {name:"瀬戸　大志",   kana:"せと　たいし",            num:"",gender:"m"},
    {name:"武部　優樹",   kana:"たけべ　ゆうき",          num:"",gender:"m"},
    {name:"長嶋　茉莉",   kana:"ながしま　まり",          num:"",gender:"f"},
    null
  ],
  "2年":[
    {name:"飯塚　洋介",   kana:"いいづか　ようすけ",      num:"",gender:"m"},
    {name:"関口　夏絆",   kana:"せきぐち　なつき",        num:"",gender:"f"},
    {name:"野口　陽生",   kana:"のぐち　はるき",          num:"",gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null
  ],
  "1年":[null,null,null,null,null,null,null,null,null,null,null,null,null,null],
  "年長":[
    {name:"功刀　あいと", kana:"くぬぎ　あいと",          num:"",gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null,null,null
  ]
};

var data = JSON.parse(JSON.stringify(INIT));

/* ===== Firebase読み込み ===== */
dbListen("members", function(val){
  if(val && typeof val==="object" && !Array.isArray(val) && Object.keys(val).length > 0){
    data = val;
  } else {
    data = JSON.parse(JSON.stringify(INIT));
    dbSave("members", data, KEY, null);
  }
  render();
}, KEY, null);

/* ===== 描画 ===== */
function render(){
  if(currentSort==="none"){
    renderGrid();
  } else {
    renderList();
  }
}

function renderGrid(){
  var tbl = document.getElementById("roster-table");
  var sv  = document.getElementById("sorted-view");
  var rw  = document.querySelector(".roster-wrap");
  if(tbl) tbl.style.display="";
  if(rw)  rw.style.display="";
  if(sv)  sv.style.display="none";
  if(!tbl) return;

  var h = "<thead><tr><th class='col-no'>#</th>";
  GRADES.forEach(function(g){
    var arr = data[g]||[];
    var cnt = arr.filter(function(m){return m&&m.name;}).length;
    h += "<th class='grade-head'>"+g+"<br><span style='font-size:.62rem;font-weight:400;color:rgba(255,255,255,.6)'>"+cnt+"名</span></th>";
  });
  h += "</tr></thead><tbody>";
  for(var r=0; r<ROWS; r++){
    h += "<tr><td class='col-no'>"+(r+1)+"</td>";
    GRADES.forEach(function(g){
      var m = (data[g]||[])[r];
      if(m && m.name){
        var girl = m.gender==="f";
        var dot  = girl ? "#ff8888" : "#6aaccc";
        h += "<td><div class='name-cell"+(girl?" girl":"")+"' onclick="openEdit('"+g+"',"+r+")">";
        h += "<div class='kana'>"+(m.kana||"")+"</div>";
        h += "<div class='kanji'><span class='gender-dot' style='background:"+dot+"'></span>"+m.name+"</div>";
        if(m.num) h += "<div class='num-badge'>#"+m.num+"</div>";
        h += "</div></td>";
      } else {
        h += "<td><div class='name-cell empty' onclick="openNew('"+g+"',"+r+")"></div></td>";
      }
    });
    h += "</tr>";
  }
  h += "</tbody>";
  tbl.innerHTML = h;
}

function renderList(){
  var tbl = document.getElementById("roster-table");
  var sv  = document.getElementById("sorted-view");
  var rw  = document.querySelector(".roster-wrap");
  if(tbl) tbl.style.display="none";
  if(rw)  rw.style.display="none";
  if(!sv) return;
  sv.style.display="block";

  var all=[];
  GRADES.forEach(function(g){
    (data[g]||[]).forEach(function(m,r){
      if(m&&m.name) all.push(Object.assign({},m,{_g:g,_r:r}));
    });
  });

  if(currentSort==="kana"){
    all.sort(function(a,b){return (a.kana||"").localeCompare(b.kana||"","ja");});
  } else if(currentSort==="num"){
    all.sort(function(a,b){return (parseInt(a.num)||999)-(parseInt(b.num)||999);});
  } else if(currentSort==="gender"){
    all.sort(function(a,b){
      if(a.gender===b.gender) return (a.kana||"").localeCompare(b.kana||"","ja");
      return a.gender==="f" ? -1 : 1;
    });
  }

  var h='<table class="roster-table" style="width:100%"><thead><tr>'
    +'<th class="grade-head" style="width:60px">学年</th>'
    +'<th class="grade-head">氏名</th>'
    +'<th class="grade-head" style="width:52px">背番号</th>'
    +'<th class="grade-head" style="width:42px">性別</th>'
    +'</tr></thead><tbody>';
  all.forEach(function(m){
    var girl = m.gender==="f";
    h += '<tr onclick="openEdit(''+m._g+'','+m._r+')" style="cursor:pointer">'
      +'<td style="text-align:center;color:var(--cyan);font-size:.75rem;font-weight:700;padding:6px">'+m._g+'</td>'
      +'<td style="padding:6px">'
      +(girl ? '<span style="color:#ff8888">' : '<span style="color:#fff">')
      +m.name+'</span>'
      +'<div style="font-size:.65rem;color:var(--ink-3)">'+(m.kana||"")+'</div>'
      +'</td>'
      +'<td style="text-align:center;padding:6px">'+(m.num?'<b style="color:#fff">#'+m.num+'</b>':'—')+'</td>'
      +'<td style="text-align:center;padding:6px">'+(girl?'<span style="color:#ff8888">女</span>':'<span style="color:#88aaff">男</span>')+'</td>'
      +'</tr>';
  });
  h += '</tbody></table>';
  sv.innerHTML = h;
}

/* ===== ソートボタン ===== */
function setSort(s){
  currentSort = s;
  ["sort-none","sort-kana","sort-num","sort-gender"].forEach(function(id){
    var el=document.getElementById(id);
    if(!el)return;
    if(id==="sort-"+s){
      el.style.background="var(--orange)";el.style.borderColor="var(--orange)";el.style.color="#fff";
    } else {
      el.style.background="";el.style.borderColor="";el.style.color="";
    }
  });
  render();
}

/* ===== 編集モーダル ===== */
function openEdit(g,r){
  var m=(data[g]||[])[r];
  if(!m||!m.name){openNew(g,r);return;}
  editGrade=g; editRow=r;
  document.getElementById("edit-title").textContent=g+" "+(r+1)+"番目を編集";
  document.getElementById("edit-name").value=m.name||"";
  document.getElementById("edit-kana").value=m.kana||"";
  document.getElementById("edit-num").value=m.num||"";
  document.getElementById(m.gender==="f"?"edit-g-f":"edit-g-m").checked=true;
  document.getElementById("edit-del-btn").style.display="inline-flex";
  document.getElementById("edit-modal").classList.add("open");
}
function openNew(g,r){
  editGrade=g; editRow=r;
  document.getElementById("edit-title").textContent=g+" "+(r+1)+"番に追加";
  document.getElementById("edit-name").value="";
  document.getElementById("edit-kana").value="";
  document.getElementById("edit-num").value="";
  document.getElementById("edit-g-m").checked=true;
  document.getElementById("edit-del-btn").style.display="none";
  document.getElementById("edit-modal").classList.add("open");
}
function closeModal(){document.getElementById("edit-modal").classList.remove("open");}
function saveEdit(){
  var name=document.getElementById("edit-name").value.trim();
  var gEl=document.querySelector("input[name='edit-gender']:checked");
  if(!data[editGrade]) data[editGrade]=[];
  if(name){
    data[editGrade][editRow]={
      name:name,
      kana:document.getElementById("edit-kana").value.trim(),
      num:document.getElementById("edit-num").value.trim(),
      gender:gEl?gEl.value:"m"
    };
  } else {
    data[editGrade][editRow]=null;
  }
  closeModal(); render(); autoSave();
}
function deleteEntry(){
  if(!confirm("削除しますか？"))return;
  if(data[editGrade]) data[editGrade][editRow]=null;
  closeModal(); render(); autoSave();
}
function autoSave(){
  var msg=document.getElementById("save-msg");
  if(msg) msg.textContent="💾 保存中…";
  dbSave("members",data,KEY,function(){
    if(msg){
      msg.textContent="✅ 保存しました";
      setTimeout(function(){if(msg)msg.textContent="";},2500);
    }
  });
}
function saveData(){
  var msg=document.getElementById("save-msg");
  if(msg) msg.textContent="💾 保存中…";
  dbSave("members",data,KEY,function(){
    if(msg){
      msg.textContent="✅ 保存しました（"+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"）";
      setTimeout(function(){if(msg)msg.textContent="";},3000);
    }
  });
}
function exportCSV(){
  var csv="﻿学年,氏名,フリガナ,背番号,性別
";
  GRADES.forEach(function(g){
    (data[g]||[]).forEach(function(m){
      if(m&&m.name) csv+='"'+g+'","'+m.name+'","'+(m.kana||"")+'","'+(m.num||"")+'","'+(m.gender==="f"?"女":"男")+'"
';
    });
  });
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="smc_members.csv"; a.click();
}
document.getElementById("edit-modal").addEventListener("click",function(e){if(e.target.id==="edit-modal")closeModal();});
</script>
</body></html>
