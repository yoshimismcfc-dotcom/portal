<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>団員名簿｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <style>
    .roster-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r8);border:1px solid var(--line-2);margin-bottom:10px}
    .roster-table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.82rem}
    .roster-table th,.roster-table td{border:1px solid var(--line-2);padding:0;vertical-align:top}
    .col-no{background:rgba(0,212,255,.14);font-size:.68rem;font-weight:900;color:var(--cyan);text-align:center;padding:6px 4px;position:sticky;left:0;z-index:10;min-width:28px}
    .grade-head{background:rgba(0,48,135,.45);color:#fff;font-size:.78rem;font-weight:900;text-align:center;padding:7px 10px;min-width:110px;white-space:nowrap}
    .name-cell{padding:6px 8px;cursor:pointer;min-height:52px;min-width:100px}
    .name-cell:hover{background:rgba(255,107,43,.12)}
    .name-cell.empty{min-height:52px;opacity:.3}
    .name-cell.empty:hover{background:rgba(255,255,255,.05)}
    .kana{font-size:.62rem;color:var(--ink-3);margin-bottom:2px}
    .kanji{font-size:.88rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:4px}
    .kanji.girl{color:#ff8888}
    .gender-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .num-badge{font-size:.65rem;color:var(--orange);font-weight:700;margin-top:2px}
    .legend-bar{display:flex;gap:12px;align-items:center;font-size:.78rem;color:var(--ink-3);padding:6px 0 8px;flex-wrap:wrap}
    .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}
    .save-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px}
    .save-msg-span{font-size:.82rem;color:var(--green);flex:1;min-height:1.4em}
    .sort-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .sort-lbl{font-size:.75rem;color:var(--ink-3)}
    .sort-btn{padding:4px 10px;border-radius:99px;border:1px solid var(--line-2);background:none;color:var(--ink-3);font:inherit;font-size:.72rem;font-weight:700;cursor:pointer;transition:.15s}
    .sort-btn.on{background:var(--orange);border-color:var(--orange);color:#fff}
    /* 編集モーダル */
    .edit-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:200;backdrop-filter:blur(6px);padding:16px}
    .edit-modal-bg.open{display:grid}
    .edit-modal{background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r16);padding:22px;width:min(380px,100%);box-shadow:var(--shadow-lg)}
    .edit-modal h3{font-size:.95rem;font-weight:900;color:#fff;margin-bottom:14px}
    .edit-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    .gender-radio{display:flex;gap:16px;font-size:.88rem;color:var(--ink)}
    /* リストビュー */
    .list-table{width:100%;border-collapse:collapse;font-size:.84rem}
    .list-table th{background:#003087;color:#fff;padding:7px 9px;text-align:left;font-size:.76rem;font-weight:900;position:sticky;top:0}
    .list-table td{border-bottom:1px solid rgba(255,255,255,.07);padding:8px 9px;color:#c8e8ff;vertical-align:middle;cursor:pointer}
    .list-table tr:hover td{background:rgba(255,107,43,.08)}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📒</div>
    <div>
      <div class="hero-title">団員名簿</div>
      <div class="hero-sub">2026年度 SMC学年別名簿。氏名をタップして編集できます。</div>
    </div>
  </div>
  <div class="notice-bar">☁️ データはクラウド（Firebase）で保存・共有されます。</div>

  <!-- フィルター・ソートバー -->
  <div class="sort-bar" style="margin-bottom:6px">
    <span class="sort-lbl">学年：</span>
    <button class="sort-btn on" id="gf-all"  onclick="setGrade('all')">全学年</button>
    <button class="sort-btn"    id="gf-6"    onclick="setGrade('6年')">6年</button>
    <button class="sort-btn"    id="gf-5"    onclick="setGrade('5年')">5年</button>
    <button class="sort-btn"    id="gf-4"    onclick="setGrade('4年')">4年</button>
    <button class="sort-btn"    id="gf-3"    onclick="setGrade('3年')">3年</button>
    <button class="sort-btn"    id="gf-2"    onclick="setGrade('2年')">2年</button>
    <button class="sort-btn"    id="gf-1"    onclick="setGrade('1年')">1年</button>
    <button class="sort-btn"    id="gf-nen"  onclick="setGrade('年長')">年長</button>
    <span id="grade-badge" style="font-size:.72rem;color:var(--cyan);margin-left:4px"></span>
  </div>
  <div class="sort-bar">
    <span class="sort-lbl">並び替え：</span>
    <button class="sort-btn on" id="sb-none"   onclick="setSort('none')">学年順</button>
    <button class="sort-btn"    id="sb-kana"   onclick="setSort('kana')">あいうえお順</button>
    <button class="sort-btn"    id="sb-num"    onclick="setSort('num')">背番号順</button>
    <button class="sort-btn"    id="sb-gender" onclick="setSort('gender')">男女別</button>
  </div>

  <!-- 凡例 -->
  <div class="legend-bar">
    <span><span class="legend-dot" style="background:#6aaccc"></span>男子</span>
    <span><span class="legend-dot" style="background:#ff8888"></span>女子（赤字）</span>
    <span style="color:#ffaa66">※ #番号 = 背番号</span>
  </div>

  <!-- グリッドビュー（学年順） -->
  <div class="roster-wrap" id="grid-view">
    <table class="roster-table" id="roster-table"></table>
  </div>

  <!-- リストビュー（ソート時） -->
  <div id="list-view" style="display:none;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2);margin-bottom:10px">
    <table class="list-table" id="list-table"></table>
  </div>

  <!-- 保存バー -->
  <div class="save-bar">
    <span class="save-msg-span" id="save-msg">読み込み中...</span>
    <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 CSV出力</button>
    <button class="btn btn-primary" onclick="saveData()">💾 保存</button>
  </div>
</main>

<!-- 編集モーダル -->
<div class="edit-modal-bg" id="edit-modal">
  <div class="edit-modal">
    <h3 id="edit-title">団員を編集</h3>
    <div class="form-group">
      <label class="form-label">氏名（漢字）</label>
      <input class="form-control" id="edit-name" placeholder="例：吉見　太郎">
    </div>
    <div class="form-group">
      <label class="form-label">ふりがな</label>
      <input class="form-control" id="edit-kana" placeholder="例：よしみ　たろう">
    </div>
    <div class="form-group">
      <label class="form-label">背番号</label>
      <input class="form-control" id="edit-num" placeholder="例：10" style="text-align:center">
    </div>
    <div class="form-group">
      <label class="form-label">性別</label>
      <div class="gender-radio">
        <label><input type="radio" name="edit-gender" value="m" id="edit-g-m" checked> 男子</label>
        <label><input type="radio" name="edit-gender" value="f" id="edit-g-f"> 女子（赤字）</label>
      </div>
    </div>
    <div class="edit-modal-btns">
      <button class="btn btn-outline btn-sm" id="edit-del-btn" style="color:var(--red);border-color:rgba(255,68,102,.4);display:none" onclick="deleteEntry()">🗑 削除</button>
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<footer class="site-footer">YOSHIMI SMC FC — SMART PORTAL</footer>
<script>
/* =====================================================
   団員名簿 - 完全書き直し版
   ===================================================== */
var GRADES = ["6年","5年","4年","3年","2年","1年","年長"];
var KEY    = "smc_members_v4";
var ROWS   = 14;
var currentSort = "none";
var currentGrade = "all";
var editGrade = null, editRow = null;

/* ----- 初期データ ----- */
var INIT = {
  "6年":[
    {name:"有瀧　晴一",   kana:"ありたき　はるいち",    num:"",gender:"m"},
    {name:"石川　日向葵", kana:"いしかわ　ひなたあおい", num:"",gender:"f"},
    {name:"一場　純",     kana:"いちば　じゅん",         num:"",gender:"m"},
    {name:"岡野　楓斗",   kana:"おかの　はやと",         num:"",gender:"m"},
    {name:"金井　暖記",   kana:"かない　はるき",         num:"",gender:"m"},
    {name:"笹野　陽青",   kana:"ささの　はるせ",         num:"",gender:"m"},
    {name:"武部　陽樹",   kana:"たけべ　はるき",         num:"",gender:"m"},
    {name:"長嶋　蓮弥",   kana:"ながしま　れんや",       num:"",gender:"m"},
    null,null,null,null,null,null
  ],
  "5年":[
    {name:"上村　夏萌", kana:"かみむら　なつめ", num:"",gender:"f"},
    {name:"木村　玲菜", kana:"きむら　れいな",   num:"",gender:"f"},
    {name:"澤井　怜央", kana:"さわい　れお",     num:"",gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null
  ],
  "4年":[
    {name:"金井　勇記",     kana:"かない　ゆうき",     num:"",gender:"m"},
    {name:"功刀　莉愛",     kana:"くぬぎ　りお",       num:"",gender:"f"},
    {name:"小柳　柊真",     kana:"こやなぎ　とうま",   num:"",gender:"m"},
    {name:"谷口　じゅんな", kana:"たにぐち　じゅんな", num:"",gender:"f"},
    null,null,null,null,null,null,null,null,null,null
  ],
  "3年":[
    {name:"石川　幸乃羽", kana:"いしかわ　このは",   num:"",gender:"f"},
    {name:"加藤　陸",     kana:"かとう　りく",       num:"",gender:"m"},
    {name:"上村　葵",     kana:"かみむら　あおい",   num:"",gender:"f"},
    {name:"北村　悠真",   kana:"きたむら　はるま",   num:"",gender:"m"},
    {name:"木村　翔馬",   kana:"きむら　しょうま",   num:"",gender:"m"},
    {name:"小林　蒼",     kana:"こばやし　あおい",   num:"",gender:"m"},
    {name:"坂上　大珠",   kana:"さかうえ　たいじゅ", num:"",gender:"m"},
    {name:"篠田　和希",   kana:"しのだ　ともき",     num:"",gender:"m"},
    {name:"芝嵜　理矩",   kana:"しばさき　りく",     num:"",gender:"m"},
    {name:"柴田　凌玖",   kana:"しばた　りく",       num:"",gender:"m"},
    {name:"瀬戸　大志",   kana:"せと　たいし",       num:"",gender:"m"},
    {name:"武部　優樹",   kana:"たけべ　ゆうき",     num:"",gender:"m"},
    {name:"長嶋　茉莉",   kana:"ながしま　まり",     num:"",gender:"f"},
    null
  ],
  "2年":[
    {name:"飯塚　洋介", kana:"いいづか　ようすけ", num:"",gender:"m"},
    {name:"関口　夏絆", kana:"せきぐち　なつき",   num:"",gender:"f"},
    {name:"野口　陽生", kana:"のぐち　はるき",     num:"",gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null
  ],
  "1年":[null,null,null,null,null,null,null,null,null,null,null,null,null,null],
  "年長":[
    {name:"功刀　あいと", kana:"くぬぎ　あいと", num:"",gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null,null,null
  ]
};

/* ----- 現在のデータ ----- */
var data = JSON.parse(JSON.stringify(INIT));

/* ----- 学年バッジ ----- */
(function(){
  var now = new Date();
  var sy  = now >= new Date(now.getFullYear(), 3, 1) ? now.getFullYear() : now.getFullYear()-1;
  var el  = document.getElementById("grade-badge");
  if(el) el.textContent = sy + "年度";
})();

/* =====================================================
   描画関数
   ===================================================== */
function render(){
  if(currentSort === "none"){
    document.getElementById("grid-view").style.display = "";
    document.getElementById("list-view").style.display = "none";
    renderGrid();
  } else {
    document.getElementById("grid-view").style.display = "none";
    document.getElementById("list-view").style.display = "";
    renderList();
  }
}

function renderGrid(){
  var tbl = document.getElementById("roster-table");
  if(!tbl) return;
  var showGrades = currentGrade==="all" ? GRADES : [currentGrade];
  var h = "<thead><tr><th class='col-no'>#</th>";
  showGrades.forEach(function(g){
    var cnt = (data[g]||[]).filter(function(m){return m&&m.name;}).length;
    h += "<th class='grade-head'>"+g+"<br><span style='font-size:.62rem;font-weight:400;color:rgba(255,255,255,.6)'>"+cnt+"名</span></th>";
  });
  h += "</tr></thead><tbody>";
  for(var r=0; r<ROWS; r++){
    h += "<tr><td class='col-no'>"+(r+1)+"</td>";
    showGrades.forEach(function(g){
      var m = (data[g]||[])[r];
      if(m && m.name){
        var girl = m.gender === "f";
        var dot  = girl ? "#ff8888" : "#6aaccc";
        h += "<td><div class='name-cell' onclick=\"openEdit('"+g+"',"+r+")\">";
        h += "<div class='kana'>"+(m.kana||"")+"</div>";
        h += "<div class='kanji"+(girl?" girl":"")+"'><span class='gender-dot' style='background:"+dot+"'></span>"+m.name+"</div>";
        if(m.num) h += "<div class='num-badge'>#"+m.num+"</div>";
        h += "</div></td>";
      } else {
        h += "<td><div class='name-cell empty' onclick=\"openNew('"+g+"',"+r+")\"></div></td>";
      }
    });
    h += "</tr>";
  }
  h += "</tbody>";
  tbl.innerHTML = h;
}

function renderList(){
  var all = [];
  var targetGrades = currentGrade==="all" ? GRADES : [currentGrade];
  targetGrades.forEach(function(g){
    (data[g]||[]).forEach(function(m,r){
      if(m && m.name) all.push({name:m.name,kana:m.kana||"",num:m.num||"",gender:m.gender,grade:g,row:r});
    });
  });
  if(currentSort==="kana")   all.sort(function(a,b){return a.kana.localeCompare(b.kana,"ja");});
  if(currentSort==="num")    all.sort(function(a,b){return (parseInt(a.num)||999)-(parseInt(b.num)||999);});
  if(currentSort==="gender") all.sort(function(a,b){
    if(a.gender===b.gender) return a.kana.localeCompare(b.kana,"ja");
    return a.gender==="f"?-1:1;
  });
  var h = "<thead><tr><th>学年</th><th>氏名</th><th>ふりがな</th><th>#</th><th>性別</th></tr></thead><tbody>";
  all.forEach(function(m){
    var girl = m.gender==="f";
    h += "<tr onclick=\"openEdit('"+m.grade+"',"+m.row+")\">";
    h += "<td style='color:var(--cyan);font-weight:700;font-size:.76rem'>"+m.grade+"</td>";
    h += "<td style='font-weight:900;"+(girl?"color:#ff8888":"color:#fff")+"'>"+m.name+"</td>";
    h += "<td style='font-size:.76rem;color:var(--ink-3)'>"+m.kana+"</td>";
    h += "<td style='text-align:center;font-weight:700;color:var(--orange)'>"+(m.num?"#"+m.num:"—")+"</td>";
    h += "<td style='text-align:center'>"+(girl?"<span style='color:#ff8888'>女</span>":"<span style='color:#88aaff'>男</span>")+"</td>";
    h += "</tr>";
  });
  h += "</tbody>";
  document.getElementById("list-table").innerHTML = h;
}

/* =====================================================
   ソート
   ===================================================== */
function setSort(s){
  currentSort = s;
  ["none","kana","num","gender"].forEach(function(k){
    var el = document.getElementById("sb-"+k);
    if(el) el.className = "sort-btn" + (k===s?" on":"");
  });
  render();
}
function setGrade(g){
  currentGrade = g;
  var ids = {"all":"gf-all","6年":"gf-6","5年":"gf-5","4年":"gf-4","3年":"gf-3","2年":"gf-2","1年":"gf-1","年長":"gf-nen"};
  Object.keys(ids).forEach(function(k){
    var el = document.getElementById(ids[k]);
    if(el) el.className = "sort-btn" + (k===g?" on":"");
  });
  render();
}

/* =====================================================
   編集モーダル
   ===================================================== */
function openEdit(g,r){
  var m = (data[g]||[])[r];
  if(!m || !m.name){ openNew(g,r); return; }
  editGrade = g; editRow = r;
  document.getElementById("edit-title").textContent = g+" "+(r+1)+"番目を編集";
  document.getElementById("edit-name").value = m.name||"";
  document.getElementById("edit-kana").value = m.kana||"";
  document.getElementById("edit-num").value  = m.num||"";
  document.getElementById(m.gender==="f"?"edit-g-f":"edit-g-m").checked = true;
  document.getElementById("edit-del-btn").style.display = "inline-flex";
  document.getElementById("edit-modal").classList.add("open");
}
function openNew(g,r){
  editGrade = g; editRow = r;
  document.getElementById("edit-title").textContent = g+" "+(r+1)+"番に追加";
  document.getElementById("edit-name").value = "";
  document.getElementById("edit-kana").value = "";
  document.getElementById("edit-num").value  = "";
  document.getElementById("edit-g-m").checked = true;
  document.getElementById("edit-del-btn").style.display = "none";
  document.getElementById("edit-modal").classList.add("open");
}
function closeModal(){ document.getElementById("edit-modal").classList.remove("open"); }
function saveEdit(){
  var name  = document.getElementById("edit-name").value.trim();
  var gEl   = document.querySelector("input[name='edit-gender']:checked");
  if(!data[editGrade]) data[editGrade] = [];
  data[editGrade][editRow] = name ? {
    name:name,
    kana:document.getElementById("edit-kana").value.trim(),
    num: document.getElementById("edit-num").value.trim(),
    gender: gEl ? gEl.value : "m"
  } : null;
  closeModal(); render();
  dbSave("members", data, KEY, function(){
    var m=document.getElementById("save-msg");
    if(m){m.textContent="✅ 保存しました";setTimeout(function(){m.textContent="";},2000);}
  });
}
function deleteEntry(){
  if(!confirm("削除しますか？")) return;
  if(data[editGrade]) data[editGrade][editRow] = null;
  closeModal(); render();
  dbSave("members", data, KEY, null);
}
function saveData(){
  var m=document.getElementById("save-msg");
  if(m) m.textContent="💾 保存中…";
  dbSave("members", data, KEY, function(){
    if(m){m.textContent="✅ 保存しました";setTimeout(function(){m.textContent="";},2500);}
  });
}
function exportCSV(){
  var csv="\uFEFF学年,氏名,フリガナ,背番号,性別\n";
  GRADES.forEach(function(g){
    (data[g]||[]).forEach(function(m){
      if(m&&m.name) csv+='"'+g+'","'+m.name+'","'+(m.kana||"")+'","'+(m.num||"")+'","'+(m.gender==="f"?"女":"男")+'"\n';
    });
  });
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="smc_members.csv"; a.click();
}
document.getElementById("edit-modal").addEventListener("click",function(e){
  if(e.target.id==="edit-modal") closeModal();
});

/* =====================================================
   Firebase読み込み（最後に実行）
   ===================================================== */
window.addEventListener("DOMContentLoaded", function(){
  // まずINITで即描画
  render();
  var msg = document.getElementById("save-msg");
  if(msg) msg.textContent = "☁️ データを読み込み中...";

  // Firebaseから上書き
  dbListen("members", function(val){
    if(val && typeof val==="object" && !Array.isArray(val) && Object.keys(val).length > 0){
      data = val;
      if(msg) msg.textContent = "✅ クラウドから読み込みました";
    } else {
      // Firebaseが空→INITを書き込む
      data = JSON.parse(JSON.stringify(INIT));
      dbSave("members", data, KEY, null);
      if(msg) msg.textContent = "✅ 初期データを設定しました";
    }
    setTimeout(function(){ if(msg) msg.textContent=""; }, 2500);
    render();
  }, KEY, null);
});
</script>
</body>
</html>
