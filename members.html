<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>団員名簿｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    .roster-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r8);border:1px solid var(--line-2);margin-bottom:10px}
    .roster-table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.82rem}
    .roster-table th,.roster-table td{border:1px solid var(--line-2);padding:0;vertical-align:top}
    .col-no{background:rgba(0,212,255,.14);font-size:.68rem;font-weight:900;color:var(--cyan);text-align:center;padding:6px 4px;position:sticky;left:0;z-index:10;min-width:28px}
    .grade-head{background:rgba(0,48,135,.45);color:#fff;font-size:.78rem;font-weight:900;text-align:center;padding:7px 10px;min-width:110px;white-space:nowrap;cursor:pointer;user-select:none}
    .grade-head:hover{background:rgba(0,80,204,.6)}
    .grade-sort-ind{font-size:.55rem;color:var(--orange);display:block;margin-top:2px;min-height:.8em}
    .name-cell{padding:6px 8px;cursor:pointer;min-height:52px;min-width:100px}
    .name-cell:hover{background:rgba(255,107,43,.12)}
    .name-cell.empty{min-height:52px;opacity:.3}
    .kana{font-size:.62rem;color:var(--ink-3);margin-bottom:2px}
    .kanji{font-size:.88rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:4px}
    .kanji.girl{color:#ff8888}
    .gender-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .member-uniform-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
    .member-uniform-badge{display:inline-flex;align-items:center;min-width:0;max-width:100%;padding:3px 7px 3px 14px;border:1px solid rgba(255,255,255,.2);border-radius:99px;background:linear-gradient(90deg,var(--u-main,#64748b) 0 8px,var(--u-sub,var(--u-main,#64748b)) 8px 12px,rgba(5,15,30,.78) 12px);color:#fff;font-size:.61rem;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
    .legend-bar{display:flex;gap:12px;align-items:center;font-size:.78rem;color:var(--ink-3);padding:6px 0 8px;flex-wrap:wrap}
    .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}
    .save-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px}
    .sort-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
    .sort-lbl{font-size:.75rem;color:var(--ink-3);white-space:nowrap}
    .sort-btn{padding:5px 12px;border-radius:99px;border:1px solid var(--line-2);background:none;color:var(--ink-3);font:inherit;font-size:.74rem;font-weight:700;cursor:pointer;transition:.15s}
    .sort-btn.on{background:var(--orange);border-color:var(--orange);color:#fff}
    .list-wrap{border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2);margin-bottom:10px}
    .list-table{width:100%;border-collapse:collapse;font-size:.84rem}
    .list-table th{background:#003087;color:#fff;padding:7px 9px;text-align:left;font-size:.76rem;font-weight:900}
    .list-table td{border-bottom:1px solid rgba(255,255,255,.07);padding:9px 9px;color:#c8e8ff;vertical-align:middle;cursor:pointer}
    .list-table tr:hover td{background:rgba(255,107,43,.08)}
    .edit-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:200;backdrop-filter:blur(6px);padding:16px}
    .edit-modal-bg.open{display:grid}
    .edit-modal{background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r16);padding:22px;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:var(--shadow-lg)}
    .edit-modal h3{font-size:.95rem;font-weight:900;color:#fff;margin-bottom:14px}
    .edit-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    .gender-radio{display:flex;gap:16px;font-size:.88rem;color:var(--ink)}
    .member-uniform-editor{display:grid;gap:8px}
    .member-uniform-row{display:grid;grid-template-columns:minmax(0,1fr) 94px 42px;gap:7px;align-items:end;padding:10px;border:1px solid var(--line-2);border-radius:var(--r8);background:rgba(255,255,255,.035)}
    .member-uniform-row label{display:grid;gap:5px;min-width:0;color:var(--ink-3);font-size:.7rem;font-weight:800}
    .member-uniform-row .form-control{width:100%;min-width:0;box-sizing:border-box}
    .member-uniform-remove{width:42px;height:42px;padding:0;align-self:end;border:1px solid rgba(255,68,102,.38);border-radius:var(--r8);background:rgba(255,68,102,.08);color:var(--red);font-size:1rem;cursor:pointer}
    .member-uniform-help{margin:5px 0 8px;color:var(--ink-3);font-size:.72rem;line-height:1.55}
    .member-uniform-add{width:100%;margin-top:8px;border-style:dashed}
    body[data-theme="light"] .member-uniform-row{background:#f8fbff}
    body[data-theme="light"] .member-uniform-badge{border-color:rgba(20,36,58,.18);background:linear-gradient(90deg,var(--u-main,#64748b) 0 8px,var(--u-sub,var(--u-main,#64748b)) 8px 12px,#edf4fa 12px);color:#14243a}
    @media(max-width:430px){
      .edit-modal{padding:17px 14px}
      .member-uniform-row{grid-template-columns:minmax(0,1fr) 78px 42px;padding:8px}
    }
  </style>
</head>
<body>
<header class="site-header"></header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📒</div>
    <div>
      <div class="hero-title">団員名簿</div>
      <div class="hero-sub">2026年度 SMC学年別名簿。氏名をタップして編集できます。</div>
    </div>
  </div>
  <div class="notice-bar">☁️ 団員ごとにFirebaseへ自動保存します。団員情報はこの端末には保存しません。</div>

  <!-- 学年フィルター -->
  <div class="sort-bar">
    <span class="sort-lbl">学年：</span>
    <button class="sort-btn on" id="gf-all" onclick="setGrade('all')">全学年</button>
    <button class="sort-btn" id="gf-6"   onclick="setGrade('6年')">6年</button>
    <button class="sort-btn" id="gf-5"   onclick="setGrade('5年')">5年</button>
    <button class="sort-btn" id="gf-4"   onclick="setGrade('4年')">4年</button>
    <button class="sort-btn" id="gf-3"   onclick="setGrade('3年')">3年</button>
    <button class="sort-btn" id="gf-2"   onclick="setGrade('2年')">2年</button>
    <button class="sort-btn" id="gf-1"   onclick="setGrade('1年')">1年</button>
    <button class="sort-btn" id="gf-nen" onclick="setGrade('年長')">年長</button>
    <span id="grade-badge" style="font-size:.72rem;color:var(--cyan)"></span>
  </div>

  <!-- ソート -->
  <div class="sort-bar">
    <span class="sort-lbl">並び替え：</span>
    <button class="sort-btn on" id="sb-none"   onclick="setSort('none')">学年順</button>
    <button class="sort-btn"    id="sb-kana"   onclick="setSort('kana')">あいうえお順</button>
    <button class="sort-btn"    id="sb-num"    onclick="setSort('num')">背番号順</button>
    <button class="sort-btn"    id="sb-gender" onclick="setSort('gender')">男女別</button>
  </div>

  <!-- 凡例 -->
  <div class="legend-bar">
    <span><span class="legend-dot" style="background:#6aaccc"></span>男子</span>
    <span><span class="legend-dot" style="background:#ff8888"></span>女子（赤字）</span>
    <span style="color:#ffaa66">※ 色と背番号は複数登録できます</span>
  </div>

  <!-- グリッドビュー -->
  <div class="roster-wrap" id="grid-view">
    <table class="roster-table" id="roster-table"></table>
  </div>

  <!-- リストビュー -->
  <div class="list-wrap" id="list-view" style="display:none">
    <table class="list-table mobile-stack" id="list-table"></table>
  </div>

  <!-- 保存バー -->
  <div class="save-bar">
    <span style="font-size:.82rem;color:var(--green);flex:1" id="save-msg">変更は団員ごとに自動保存されます</span>
    <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 CSV出力</button>
  </div>
</main>

<!-- 編集モーダル -->
<div class="edit-modal-bg" id="edit-modal">
  <div class="edit-modal">
    <h3 id="edit-title">団員を編集</h3>
    <div class="form-group">
      <label class="form-label">氏名（漢字）</label>
      <input class="form-control" id="edit-name" placeholder="例：吉見　太郎">
    </div>
    <div class="form-group">
      <label class="form-label">ふりがな</label>
      <input class="form-control" id="edit-kana" placeholder="例：よしみ　たろう">
    </div>
    <div class="form-group">
      <label class="form-label">貸出ユニフォーム</label>
      <p class="member-uniform-help">「ユニフォーム貸出管理」に登録されている色から選び、背番号を入力します。3着以上でも追加できます。</p>
      <div class="member-uniform-editor" id="member-uniform-editor"></div>
      <button type="button" class="btn btn-outline btn-sm member-uniform-add" onclick="addMemberUniform()">＋ ユニフォームを追加</button>
    </div>
    <div class="form-group">
      <label class="form-label">性別</label>
      <div class="gender-radio">
        <label><input type="radio" name="edit-gender" value="m" id="edit-g-m" checked> 男子</label>
        <label><input type="radio" name="edit-gender" value="f" id="edit-g-f"> 女子</label>
      </div>
    </div>
    <div class="edit-modal-btns">
      <button class="btn btn-outline btn-sm" id="edit-del-btn" style="color:var(--red);border-color:rgba(255,68,102,.4);display:none" onclick="deleteEntry()">🗑 削除</button>
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<footer class="site-footer"></footer>
<script>
var GRADES = ["6年","5年","4年","3年","2年","1年","年長"];
var MEMBER_PATH = "members_v2";
var LEGACY_MEMBER_PATH = "members";
var ROWS = 14;
var currentSort = "none";
var currentGrade = "all";
var editGrade = null, editRow = null, editId = null;
var memberRecords = {};
var memberListenerStarted = false;
var migrationAttempted = false;
var uniformInventory = [];
var uniformColorTemplates = [];
var uniformFolderOrder = [];
var DEFAULT_UNIFORM_COLORS = [
  {name:"水色 × ピンク",mainCode:"#4ab8e8",subCode:"#f06090"},
  {name:"水色 × オレンジ",mainCode:"#4ab8e8",subCode:"#ff8c00"},
  {name:"オレンジ × 紺",mainCode:"#e85c1e",subCode:"#003087"},
  {name:"オレンジ × 赤",mainCode:"#e85c1e",subCode:"#bc002d"},
  {name:"オレンジ",mainCode:"#e85c1e",subCode:""},
  {name:"白 × 青",mainCode:"#f0f0f0",subCode:"#1769aa"},
  {name:"白",mainCode:"#f0f0f0",subCode:""},
  {name:"白 × 赤",mainCode:"#f0f0f0",subCode:"#bc002d"},
  {name:"白 × 黒",mainCode:"#f0f0f0",subCode:"#222222"},
  {name:"オレンジ赤縦じま",mainCode:"#e85c1e",subCode:"#bc002d"},
  {name:"緑",mainCode:"#228b22",subCode:""},
  {name:"黄色",mainCode:"#f5d300",subCode:""}
];

// 個人情報を公開HTMLへ埋め込まない。現行名簿はFirebaseまたは端末保存から読み込む。
var INIT = GRADES.reduce(function(result, grade){
  result[grade] = Array(ROWS).fill(null);
  return result;
}, {});

var data = JSON.parse(JSON.stringify(INIT));

// 学年バッジ
(function(){
  var now = new Date();
  var sy = now >= new Date(now.getFullYear(),3,1) ? now.getFullYear() : now.getFullYear()-1;
  var el = document.getElementById("grade-badge");
  if(el) el.textContent = sy+"年度";
})();

/* ===== 描画 ===== */
function render(){
  if(currentSort === "none"){
    document.getElementById("grid-view").style.display = "";
    document.getElementById("list-view").style.display = "none";
    renderGrid();
  } else {
    document.getElementById("grid-view").style.display = "none";
    document.getElementById("list-view").style.display = "";
    renderList();
  }
}

function renderGrid(){
  var tbl = document.getElementById("roster-table");
  if(!tbl) return;
  var grades = currentGrade==="all" ? GRADES : [currentGrade];
  var h = "<thead><tr><th class='col-no'>#</th>";
  grades.forEach(function(g){
    var cnt = (data[g]||[]).filter(function(m){return m&&m.name;}).length;
    h += "<th class='grade-head' onclick=\"cycleSort('"+g+"')\">"
      +g+"<br><span style='font-size:.62rem;font-weight:400;color:rgba(255,255,255,.6)'>"+cnt+"名</span>"
      +"<span class='grade-sort-ind' id='gsi-"+g+"'></span></th>";
  });
  h += "</tr></thead><tbody>";
  var rowCount = grades.reduce(function(max,g){return Math.max(max,(data[g]||[]).length);},ROWS);
  for(var r=0; r<rowCount; r++){
    h += "<tr><td class='col-no'>"+(r+1)+"</td>";
    grades.forEach(function(g){
      var m = (data[g]||[])[r];
      if(m && m.name){
        var girl = m.gender==="f";
        var dot  = girl ? "#ff8888" : "#6aaccc";
        h += "<td><div class='name-cell' onclick=\"openEdit('"+g+"',"+r+")\">"
          +"<div class='kana'>"+escapeHtml(m.kana||"")+"</div>"
          +"<div class='kanji"+(girl?" girl":"")+"'><span class='gender-dot' style='background:"+dot+"'></span>"+escapeHtml(m.name)+"</div>"
          +renderMemberUniformBadges(m)
          +"</div></td>";
      } else {
        h += "<td><div class='name-cell empty' onclick=\"openNew('"+g+"',"+r+")\"></div></td>";
      }
    });
    h += "</tr>";
  }
  h += "</tbody>";
  tbl.innerHTML = h;
}

function renderList(){
  var grades = currentGrade==="all" ? GRADES : [currentGrade];
  var all = [];
  grades.forEach(function(g){
    (data[g]||[]).forEach(function(m,r){
      if(m&&m.name) all.push({name:m.name,kana:m.kana||"",num:m.num||"",uniforms:normalizeMemberUniforms(m),gender:m.gender,grade:g,row:r});
    });
  });
  if(currentSort==="kana")   all.sort(function(a,b){return a.kana.localeCompare(b.kana,"ja");});
  if(currentSort==="num")    all.sort(function(a,b){return (parseInt(a.num)||999)-(parseInt(b.num)||999);});
  if(currentSort==="gender") all.sort(function(a,b){
    if(a.gender===b.gender) return a.kana.localeCompare(b.kana,"ja");
    return a.gender==="f"?-1:1;
  });
  var showGrade = currentGrade==="all";
  var h = "<thead><tr>"+(showGrade?"<th style='width:52px'>学年</th>":"")
    +"<th>氏名</th><th>ふりがな</th><th>貸出ユニフォーム</th><th style='width:40px'>性別</th>"
    +"</tr></thead><tbody>";
  if(!all.length){
    h += "<tr><td colspan='5' style='text-align:center;color:var(--ink-3);padding:20px'>団員がいません</td></tr>";
  } else {
    all.forEach(function(m){
      var girl = m.gender==="f";
      h += "<tr onclick=\"openEdit('"+m.grade+"',"+m.row+")\">";
      if(showGrade) h += "<td style='text-align:center;color:var(--cyan);font-weight:700;font-size:.76rem'>"+m.grade+"</td>";
      h += "<td style='font-weight:900;"+(girl?"color:#ff8888":"color:#fff")+"'>"+escapeHtml(m.name)+"</td>"
        +"<td style='font-size:.76rem;color:var(--ink-3)'>"+escapeHtml(m.kana)+"</td>"
        +"<td>"+renderMemberUniformBadges(m)+"</td>"
        +"<td style='text-align:center'>"+(girl?"<span style='color:#ff8888'>女</span>":"<span style='color:#88aaff'>男</span>")+"</td>"
        +"</tr>";
    });
  }
  h += "</tbody>";
  document.getElementById("list-table").innerHTML = h;
}

/* ===== 学年ヘッダータップでその学年内ソート ===== */
var gradeSortState = {}; // {g: "none"|"kana"|"num"}
function cycleSort(g){
  var cur = gradeSortState[g]||"none";
  var next = cur==="none"?"kana" : cur==="kana"?"num" : "none";
  gradeSortState[g] = next;

  // その学年内のデータを並べ替え
  var members = (data[g]||[]).filter(function(m){return m&&m.name;});
  if(next==="kana")   members.sort(function(a,b){return (a.kana||"").localeCompare(b.kana||"","ja");});
  if(next==="num")    members.sort(function(a,b){return (parseInt(a.num)||999)-(parseInt(b.num)||999);});
  // nullで埋める
  while(members.length < ROWS) members.push(null);
  data[g] = members;

  render();

  // インジケーター更新
  var label = {"none":"","kana":"あいうえお順 ▲","num":"背番号順 ▲"};
  var el = document.getElementById("gsi-"+g);
  if(el) el.textContent = label[next]||"";

  // 表示順だけを変更する。団員データ自体は書き換えない。
}

/* ===== ソートボタン ===== */
function setSort(s){
  currentSort = s;
  ["none","kana","num","gender"].forEach(function(k){
    var el = document.getElementById("sb-"+k);
    if(el) el.className = "sort-btn"+(k===s?" on":"");
  });
  render();
}

/* ===== 学年フィルター ===== */
function setGrade(g){
  currentGrade = g;
  var map = {"all":"gf-all","6年":"gf-6","5年":"gf-5","4年":"gf-4","3年":"gf-3","2年":"gf-2","1年":"gf-1","年長":"gf-nen"};
  Object.keys(map).forEach(function(k){
    var el = document.getElementById(map[k]);
    if(el) el.className = "sort-btn"+(k===g?" on":"");
  });
  render();
}

/* ===== 編集モーダル ===== */
function openEdit(g,r){
  var m = (data[g]||[])[r];
  if(!m||!m.name){ openNew(g,r); return; }
  editGrade=g; editRow=r; editId=m.id||null;
  document.getElementById("edit-title").textContent = g+" "+(r+1)+"番目を編集";
  document.getElementById("edit-name").value = m.name||"";
  document.getElementById("edit-kana").value = m.kana||"";
  renderMemberUniformEditor(normalizeMemberUniforms(m));
  document.getElementById(m.gender==="f"?"edit-g-f":"edit-g-m").checked = true;
  document.getElementById("edit-del-btn").style.display = "inline-flex";
  document.getElementById("edit-modal").classList.add("open");
}
function openNew(g,r){
  editGrade=g; editRow=r; editId=null;
  document.getElementById("edit-title").textContent = g+" "+(r+1)+"番に追加";
  document.getElementById("edit-name").value = "";
  document.getElementById("edit-kana").value = "";
  renderMemberUniformEditor([]);
  document.getElementById("edit-g-m").checked = true;
  document.getElementById("edit-del-btn").style.display = "none";
  document.getElementById("edit-modal").classList.add("open");
}
function closeModal(){ document.getElementById("edit-modal").classList.remove("open"); }
function setSaveMessage(message,isError){
  var el=document.getElementById("save-msg");
  if(!el) return;
  el.textContent=message;
  el.style.color=isError?"var(--red)":"var(--green)";
}
function safeMemberColor(value,fallback){
  var color=String(value||"").trim();
  return /^#[0-9a-f]{6}$/i.test(color)?color:fallback;
}
function uniformChoiceFromItem(item){
  if(!item||typeof item!=="object") return null;
  var main=String(item.mainColorName||item.cname||"").trim();
  var sub=String(item.subColorName||"").trim();
  var name=String(item.name||"").trim()||(main+(sub?" × "+sub:""));
  if(!name) return null;
  return {name:name,mainCode:safeMemberColor(item.mainColorCode||item.mainCode||item.ccode,"#64748b"),subCode:sub?safeMemberColor(item.subColorCode||item.subCode,"#64748b"):""};
}
function memberUniformColorChoices(){
  var choices=[],seen={};
  var folderChoices=uniformFolderOrder.map(function(name){return {name:String(name||""),mainCode:"#64748b",subCode:""};});
  DEFAULT_UNIFORM_COLORS.concat(uniformColorTemplates.map(uniformChoiceFromItem),uniformInventory.map(uniformChoiceFromItem),folderChoices).forEach(function(item){
    if(!item||!item.name) return;
    var key=item.name.replace(/[\s×・]/g,"").toLowerCase();
    if(seen[key]) return;
    seen[key]=true;choices.push(item);
  });
  return choices;
}
function memberUniformColorOptions(selected){
  var current=String(selected||"").trim();
  var choices=memberUniformColorChoices().slice();
  if(current&&!choices.some(function(item){return item.name===current;})) choices.unshift({name:current});
  return '<option value="">色を選択してください</option>'+choices.map(function(item){
    return '<option value="'+escapeHtml(item.name)+'"'+(item.name===current?' selected':'')+'>'+escapeHtml(item.name)+'</option>';
  }).join("");
}
function normalizeMemberUniforms(member){
  var items=member&&Array.isArray(member.uniforms)?member.uniforms:[];
  items=items.filter(function(item){return item&&(item.color||item.num);}).map(function(item,index){
    return {id:String(item.id||("uniform-"+index)),color:String(item.color||""),num:String(item.num||"")};
  });
  if(!items.length&&member&&member.num) items=[{id:"legacy-primary",color:"",num:String(member.num)}];
  return items;
}
function memberUniformStyle(colorName){
  var compact=String(colorName||"").replace(/[\s×・]/g,"").toLowerCase();
  var choice=memberUniformColorChoices().find(function(item){return item.name.replace(/[\s×・]/g,"").toLowerCase()===compact;});
  var main=safeMemberColor(choice&&choice.mainCode,"#64748b");
  var sub=safeMemberColor(choice&&choice.subCode,main);
  return "--u-main:"+main+";--u-sub:"+sub;
}
function memberUniformText(item){
  var color=String(item&&item.color||"").trim()||"色未設定";
  var number=String(item&&item.num||"").trim();
  return color+(number?" #"+number:"");
}
function renderMemberUniformBadges(member){
  var uniforms=normalizeMemberUniforms(member);
  if(!uniforms.length) return "<span style='color:var(--ink-3)'>—</span>";
  return "<div class='member-uniform-badges'>"+uniforms.map(function(item){
    return '<span class="member-uniform-badge" style="'+memberUniformStyle(item.color)+'">'+escapeHtml(memberUniformText(item))+'</span>';
  }).join("")+"</div>";
}
function memberUniformRowHtml(item,index){
  item=item||{};
  return '<div class="member-uniform-row" data-uniform-row>'
    +'<label>ユニフォームの色<select class="form-control member-uniform-color">'+memberUniformColorOptions(item.color||"")+'</select></label>'
    +'<label>背番号<input class="form-control member-uniform-number" inputmode="numeric" value="'+escapeHtml(item.num||"")+'" placeholder="例：10" maxlength="4"></label>'
    +'<button type="button" class="member-uniform-remove" aria-label="'+(index+1)+'着目を削除" onclick="removeMemberUniform(this)">🗑</button>'
    +'</div>';
}
function renderMemberUniformEditor(items){
  var editor=document.getElementById("member-uniform-editor");
  var uniforms=Array.isArray(items)?items:[];
  editor.innerHTML=uniforms.map(memberUniformRowHtml).join("");
}
function refreshOpenMemberUniformChoices(){
  var modal=document.getElementById("edit-modal");
  if(modal&&modal.classList.contains("open")) renderMemberUniformEditor(readMemberUniformEditor());
}
function readMemberUniformEditor(){
  return Array.from(document.querySelectorAll("#member-uniform-editor [data-uniform-row]")).map(function(row,index){
    return {id:"member-uniform-"+Date.now()+"-"+index,color:row.querySelector(".member-uniform-color").value.trim(),num:row.querySelector(".member-uniform-number").value.trim()};
  }).filter(function(item){return item.color||item.num;});
}
function addMemberUniform(){
  var items=readMemberUniformEditor();items.push({color:"",num:""});renderMemberUniformEditor(items);
  var rows=document.querySelectorAll("#member-uniform-editor [data-uniform-row]");
  if(rows.length) rows[rows.length-1].querySelector(".member-uniform-color").focus();
}
function removeMemberUniform(button){button.closest("[data-uniform-row]").remove();}
function saveEdit(){
  var name = document.getElementById("edit-name").value.trim();
  var gEl  = document.querySelector("input[name='edit-gender']:checked");
  if(!name){ alert("氏名を入力してください。"); return; }
  var current = editId && memberRecords[editId] ? memberRecords[editId] : {};
  var uniforms=readMemberUniformEditor();
  var incomplete=uniforms.find(function(item){return item.color&&!item.num;});
  if(incomplete){alert("選択したユニフォームの背番号を入力してください。");return;}
  var record = {
    name:name,
    kana:document.getElementById("edit-kana").value.trim(),
    num: uniforms.length?uniforms[0].num:"",
    uniforms:uniforms,
    gender:gEl?gEl.value:"m",
    grade:editGrade,
    order:Number.isFinite(Number(current.order))?Number(current.order):editRow,
    updatedAt:Date.now()
  };
  onFirebaseReady(function(db){
    var id=editId||db.ref(MEMBER_PATH).push().key;
    setSaveMessage("☁️ 保存中…",false);
    dbSave(MEMBER_PATH+"/"+id,record,null,function(){
      closeModal();
      setSaveMessage("✅ クラウドに保存しました",false);
    },function(){
      setSaveMessage("❌ クラウドに保存できませんでした",true);
    });
  });
}
function deleteEntry(){
  if(!editId || !confirm("この団員を名簿から削除しますか？")) return;
  setSaveMessage("☁️ 削除中…",false);
  dbSave(MEMBER_PATH+"/"+editId,null,null,function(){
    closeModal();
    setSaveMessage("✅ クラウドから削除しました",false);
  },function(){
    setSaveMessage("❌ 削除できませんでした",true);
  });
}
function exportCSV(){
  function csvCell(value){
    var text=String(value==null?"":value);
    if(/^[=+\-@]/.test(text)) text="'"+text;
    return '"'+text.replace(/"/g,'""')+'"';
  }
  var rows=[["学年","氏名","フリガナ","貸出ユニフォーム","性別"]];
  GRADES.forEach(function(g){
    (data[g]||[]).forEach(function(m){
      if(m&&m.name) rows.push([g,m.name,m.kana||"",normalizeMemberUniforms(m).map(memberUniformText).join(" / "),m.gender==="f"?"女":"男"]);
    });
  });
  var csv="\uFEFF"+rows.map(function(row){return row.map(csvCell).join(",");}).join("\n");
  var a=document.createElement("a");
  var url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.href=url;a.download="smc_members.csv";a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},0);
}
document.getElementById("edit-modal").addEventListener("click",function(e){
  if(e.target.id==="edit-modal") closeModal();
});

function recordsToGrid(records){
  var next=JSON.parse(JSON.stringify(INIT));
  Object.keys(records||{}).forEach(function(id){
    var source=records[id];
    if(!source||!source.name||GRADES.indexOf(source.grade)<0) return;
    next[source.grade].push(Object.assign({id:id},source));
  });
  GRADES.forEach(function(grade){
    next[grade]=next[grade].filter(function(member){return member&&member.name;});
    next[grade].sort(function(a,b){
      var ao=Number.isFinite(Number(a.order))?Number(a.order):999;
      var bo=Number.isFinite(Number(b.order))?Number(b.order):999;
      return ao-bo||(a.kana||a.name).localeCompare(b.kana||b.name,"ja");
    });
  });
  return next;
}

function convertLegacyMembers(legacy){
  var converted={};
  GRADES.forEach(function(grade,gradeIndex){
    var group=legacy&&legacy[grade];
    if(!group||typeof group!=="object") return;
    Object.keys(group).forEach(function(position){
      var member=group[position];
      if(!member||!member.name) return;
      var id="legacy_"+gradeIndex+"_"+String(position).replace(/[^0-9A-Za-z_-]/g,"");
      converted[id]={
        name:String(member.name||""),
        kana:String(member.kana||""),
        num:String(member.num||""),
        gender:member.gender==="f"?"f":"m",
        grade:grade,
        order:Number(position)||0,
        updatedAt:Date.now()
      };
    });
  });
  return converted;
}

function migrateLegacyMembers(db){
  if(migrationAttempted) return;
  migrationAttempted=true;
  setSaveMessage("既存名簿を確認しています…",false);
  db.ref(LEGACY_MEMBER_PATH).once("value").then(function(snapshot){
    var converted=convertLegacyMembers(snapshot.val());
    if(!Object.keys(converted).length){
      memberRecords={};data=JSON.parse(JSON.stringify(INIT));render();
      setSaveMessage("名簿は空です。空欄をタップして登録できます",false);
      return;
    }
    setSaveMessage("既存名簿を新しい保存形式へ移行中…",false);
    dbSave(MEMBER_PATH,converted,null,function(){
      setSaveMessage("✅ 既存名簿をFirebaseへ移行しました",false);
    },function(){
      memberRecords=converted;data=recordsToGrid(converted);render();
      setSaveMessage("❌ 既存名簿を表示しましたが、移行保存に失敗しました",true);
    });
  }).catch(function(){
    setSaveMessage("❌ 既存名簿を確認できませんでした",true);
  });
}

function startMemberSync(){
  if(memberListenerStarted) return;
  memberListenerStarted=true;
  try{localStorage.removeItem("smc_members_v4");}catch(e){}
  onFirebaseReady(function(db){
    db.ref(MEMBER_PATH).on("value",function(snapshot){
      var value=snapshot.val();
      if(value&&typeof value==="object"&&Object.keys(value).length){
        memberRecords=value;
        data=recordsToGrid(value);
        render();
        setSaveMessage("☁️ Firebaseと同期済み",false);
      }else{
        migrateLegacyMembers(db);
      }
    },function(){
      setSaveMessage("❌ 名簿を読み込めません。通信状態とFirebase設定をご確認ください",true);
    });
  });
}
function startMemberUniformColorSync(){
  dbListen("uniform",function(value){
    uniformInventory=Array.isArray(value)?value.filter(function(item){return item&&typeof item==="object";}):[];
    refreshOpenMemberUniformChoices();render();
  },null,[]);
  dbListen("uniform_color_templates",function(value){
    uniformColorTemplates=Array.isArray(value)?value.filter(function(item){return item&&typeof item==="object";}):[];
    refreshOpenMemberUniformChoices();render();
  },null,[]);
  dbListen("uniform_folder_order",function(value){
    uniformFolderOrder=Array.isArray(value)?value.filter(function(name){return typeof name==="string"&&name.trim();}):[];
    refreshOpenMemberUniformChoices();render();
  },null,[]);
}

/* ===== 起動 ===== */
window.addEventListener("DOMContentLoaded", function(){
  render();
  startMemberSync();
  startMemberUniformColorSync();
});

function copyMemberList(){
  var grades = ["6年","5年","4年","3年","2年","1年","年長"];
  var t = "【団員名簿】\n\n";
  grades.forEach(function(g){
    var members = (data[g]||[]).filter(function(m){ return m && m.name; });
    if(members.length){
      t += "■ "+g+"（"+members.length+"名）\n";
      members.forEach(function(m){
        var uniforms=normalizeMemberUniforms(m).map(memberUniformText).join("／");
        t += "  "+m.name+(m.kana?"（"+m.kana+"）":"")+(uniforms?"　"+uniforms:"")+"\n";
      });
      t += "\n";
    }
  });
  if(!navigator.clipboard || !navigator.clipboard.writeText){
    alert("このブラウザではコピー機能を利用できません。");
    return;
  }
  navigator.clipboard.writeText(t.trim())
    .then(function(){ alert("名簿をコピーしました！LINEに貼り付けてください。"); })
    .catch(function(){ alert("コピーできませんでした。ブラウザの権限をご確認ください。"); });
}
