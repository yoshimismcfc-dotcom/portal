<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>団員名簿｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    /* ===== 表形式名簿 ===== */
    .roster-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r12);border:1px solid var(--line-2)}
    .roster-table{border-collapse:collapse;font-size:.88rem;width:max-content;min-width:100%}
    .roster-table th,.roster-table td{
      border:1px solid var(--line-2);padding:0;
      vertical-align:top;white-space:nowrap;
    }
    /* 行番号列 */
    .roster-table .col-no{
      width:36px;text-align:center;color:#6aaccc;font-size:.75rem;
      background:rgba(0,212,255,.06);padding:8px 4px;
      position:sticky;left:0;z-index:10;border-right:2px solid var(--line-2) !important;
    }
    .roster-table thead .col-no{
      background:rgba(0,212,255,.14);font-size:.7rem;font-weight:900;color:var(--cyan);
      position:sticky;left:0;z-index:20;
    }
    /* 学年ヘッダー */
    .roster-table thead tr:first-child th.grade-head{
      background:rgba(0,48,135,.35);color:#ffffff;font-size:.82rem;font-weight:900;
      text-align:center;padding:8px 12px;letter-spacing:.06em;
      border-bottom:2px solid rgba(0,212,255,.4) !important;
      position:sticky;top:0;z-index:15;
    }
    .roster-table thead tr:first-child .col-no{
      position:sticky;left:0;top:0;z-index:25;background:rgba(0,48,135,.35);
    }
    /* セル内レイアウト */
    .name-cell{
      min-width:108px;padding:5px 10px 7px;cursor:pointer;
      transition:.12s;position:relative;
    }
    .name-cell:hover{background:rgba(0,212,255,.07)}
    .name-cell .kana{
      font-size:.62rem;color:#6aaccc;line-height:1.3;
      margin-bottom:2px;letter-spacing:.02em;
    }
    .name-cell .kanji{
      font-size:1rem;font-weight:900;color:#ffffff;
      line-height:1.2;letter-spacing:.04em;
    }
    /* 女子：赤色（画像準拠） */
    .name-cell.girl .kanji{color:#ff8888}
    .name-cell.girl .kana{color:#ffaaaa}
    /* 空セル */
    .name-cell.empty{cursor:default;min-width:108px}
    .name-cell.empty:hover{background:none}
    /* 編集モーダル */
    .edit-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:200;backdrop-filter:blur(6px)}
    .edit-modal-bg.open{display:grid}
    .edit-modal{background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r16);padding:22px;width:min(360px,92vw);box-shadow:var(--shadow-lg)}
    .edit-modal h3{font-size:.95rem;font-weight:900;color:#fff;margin-bottom:14px}
    .edit-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    /* 保存バー */
    .save-bar{position:sticky;bottom:0;background:rgba(10,31,48,.97);border-top:1px solid var(--line-2);padding:10px 0;display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px}
    .save-msg{font-size:.82rem;color:#00ff88;min-height:1.2em;flex:1}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📒</div>
    <div><div class="hero-title">団員名簿</div>
      <div class="hero-sub">2026年度 SMC学年別名簿。氏名をタップして編集できます。</div></div>
  </div>
  <div class="notice-bar">💾 「保存」を押すとこの端末に保存されます。セルをタップすると氏名・ふりがな・背番号を編集できます。</div>

  <div class="panel">
    <div class="roster-wrap">
      <table class="roster-table" id="roster-table"></table>
    </div>
    <div class="save-bar">
      <span class="save-msg" id="save-msg"></span>
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 CSV出力</button>
      <button class="btn btn-primary" onclick="saveData()">💾 保存</button>
    </div>
  </div>
</main>

<!-- 編集モーダル -->
<div class="edit-modal-bg" id="edit-modal">
  <div class="edit-modal">
    <h3 id="edit-modal-title">団員を編集</h3>
    <div class="form-group"><label class="form-label">氏名（漢字）</label>
      <input class="form-control" id="edit-name" placeholder="例：吉見　太郎"></div>
    <div class="form-group"><label class="form-label">ふりがな</label>
      <input class="form-control" id="edit-kana" placeholder="例：よしみ　たろう"></div>
    <div class="form-group"><label class="form-label">背番号</label>
      <input class="form-control" id="edit-num" placeholder="例：10" style="text-align:center"></div>
    <div class="form-group">
      <label class="form-label">性別（女子は赤表示）</label>
      <select class="form-control" id="edit-gender">
        <option value="m">男子</option>
        <option value="f">女子（赤表示）</option>
      </select>
    </div>
    <div class="edit-modal-btns">
      <button class="btn btn-outline btn-sm" id="edit-delete-btn" style="color:var(--red);border-color:rgba(255,68,102,.4)">🗑 削除</button>
      <button class="btn btn-outline" onclick="closeEditModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<footer class="site-footer">YOSHIMI SMC FC — SMART PORTAL</footer>
<script>
var GRADES = ["6年","5年","4年","3年","2年","1年","年長"];
var KEY = "smc_members_v3";

// 初期データ（添付画像の名簿より）
var INIT = {
  "6年":[
    {name:"有瀧　晴一", kana:"ありたき　はるいち",  num:"", gender:"m"},
    {name:"石川　日向葵",kana:"いしかわ　ひなたあおい",num:"",gender:"f"},
    {name:"一場　純",    kana:"いちば　じゅん",      num:"", gender:"m"},
    {name:"岡野　楓斗",  kana:"おかの　はやと",      num:"", gender:"m"},
    {name:"金井　暖記",  kana:"かない　はるき",      num:"", gender:"m"},
    {name:"笹野　陽青",  kana:"ささの　はるせ",      num:"", gender:"m"},
    {name:"武部　陽樹",  kana:"たけべ　はるき",      num:"", gender:"m"},
    {name:"長嶋　蓮弥",  kana:"ながしま　れんや",    num:"", gender:"m"},
    {name:"芝嵜　理矩",  kana:"しばさき　りく",      num:"", gender:"m"},
    {name:"柴田　凌玖",  kana:"しばた　りく",        num:"", gender:"m"},
    {name:"瀬戸　大志",  kana:"せと　たいし",        num:"", gender:"m"},
    {name:"武部　優樹",  kana:"たけべ　ゆうき",      num:"", gender:"m"},
    {name:"長嶋　茉莉",  kana:"ながしま　まり",      num:"", gender:"f"},
    null
  ],
  "5年":[
    {name:"上村　夏萌",   kana:"かみむら　なつめ",    num:"", gender:"f"},
    {name:"木村　玲菜",   kana:"きむら　れいな",      num:"", gender:"f"},
    {name:"澤井　怜央",   kana:"さわい　れお",        num:"", gender:"m"},
    {name:"谷口　じゅんな",kana:"たにぐち　じゅんな", num:"", gender:"f"},
    {name:"木村　翔馬",   kana:"きむら　しょうま",    num:"", gender:"m"},
    {name:"小林　蒼",     kana:"こばやし　あおい",    num:"", gender:"m"},
    {name:"坂上　大珠",   kana:"さかうえ　たいじゅ",  num:"", gender:"m"},
    {name:"篠田　和希",   kana:"しのだ　ともき",      num:"", gender:"m"},
    null,null,null,null,null,null
  ],
  "4年":[
    {name:"金井　勇記",   kana:"かない　ゆうき",      num:"", gender:"m"},
    {name:"功刀　莉愛",   kana:"くぬぎ　りお",        num:"", gender:"f"},
    {name:"小柳　柊真",   kana:"こやなぎ　とうま",    num:"", gender:"m"},
    {name:"谷口　じゅんな",kana:"たにぐち　じゅんな", num:"", gender:"f"},
    {name:"北村　悠真",   kana:"きたむら　はるま",    num:"", gender:"m"},
    {name:"丸山　輝",     kana:"まるやま　ひかる",    num:"", gender:"m"},
    null,null,null,null,null,null,null,null
  ],
  "3年":[
    {name:"石川　幸乃羽", kana:"いしかわ　このは",    num:"", gender:"f"},
    {name:"加藤　陸",     kana:"かとう　りく",        num:"", gender:"m"},
    {name:"上村　葵",     kana:"かみむら　あおい",    num:"", gender:"f"},
    {name:"北村　悠真",   kana:"きたむら　はるま",    num:"", gender:"m"},
    {name:"木村　翔馬",   kana:"きむら　しょうま",    num:"", gender:"m"},
    {name:"小林　蒼",     kana:"こばやし　あおい",    num:"", gender:"m"},
    {name:"坂上　大珠",   kana:"さかうえ　たいじゅ",  num:"", gender:"m"},
    {name:"篠田　和希",   kana:"しのだ　ともき",      num:"", gender:"m"},
    {name:"芝嵜　理矩",   kana:"しばさき　りく",      num:"", gender:"m"},
    {name:"柴田　凌玖",   kana:"しばた　りく",        num:"", gender:"m"},
    {name:"瀬戸　大志",   kana:"せと　たいし",        num:"", gender:"m"},
    {name:"武部　優樹",   kana:"たけべ　ゆうき",      num:"", gender:"m"},
    {name:"長嶋　茉莉",   kana:"ながしま　まり",      num:"", gender:"f"},
    {name:"原口　颯太",   kana:"はらぐち　そうた",    num:"", gender:"m"}
  ],
  "2年":[
    {name:"飯塚　洋介",   kana:"いいづか　ようすけ",  num:"", gender:"m"},
    {name:"関口　夏絆",   kana:"せきぐち　なつき",    num:"", gender:"f"},
    {name:"野口　陽生",   kana:"のぐち　はるき",      num:"", gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null
  ],
  "1年":[
    {name:"功刀　あいと", kana:"くぬぎ　あいと",      num:"", gender:"m"},
    null,null,null,null,null,null,null,null,null,null,null,null,null
  ],
  "年長":[
    null,null,null,null,null,null,null,null,null,null,null,null,null,null
  ]
};

function loadData(){
  try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}
  return JSON.parse(JSON.stringify(INIT));
}
var data = loadData();
var ROWS = 14; // 最大14行

// 現在編集中
var editGrade = null, editRow = null;

function renderTable(){
  var tbl = document.getElementById("roster-table");
  var html = "<thead><tr><th class='col-no roster-table'>#</th>";
  GRADES.forEach(function(g){
    html += "<th class='grade-head'>"+g+"</th>";
  });
  html += "</tr></thead><tbody>";

  for(var r=0; r<ROWS; r++){
    html += "<tr><td class='col-no'>"+(r+1)+"</td>";
    GRADES.forEach(function(g){
      var arr = data[g] || [];
      var m = arr[r];
      if(m && m.name){
        var isgirl = m.gender==="f";
        html += "<td><div class='name-cell"+(isgirl?" girl":"")+"' onclick=\"openEdit('"+g+"',"+r+")\">";
        html += "<div class='kana'>"+(m.kana||"　")+"</div>";
        html += "<div class='kanji'>"+m.name+"</div>";
        if(m.num) html += "<div style='font-size:.6rem;color:#6aaccc;margin-top:2px'>#"+m.num+"</div>";
        html += "</div></td>";
      } else {
        html += "<td><div class='name-cell empty' onclick=\"openNew('"+g+"',"+r+")\"></div></td>";
      }
    });
    html += "</tr>";
  }
  html += "</tbody>";
  tbl.innerHTML = html;
}

function openEdit(grade, row){
  var m = (data[grade]||[])[row];
  if(!m || !m.name){ openNew(grade,row); return; }
  editGrade = grade; editRow = row;
  document.getElementById("edit-modal-title").textContent = grade+" "+row+"番目を編集";
  document.getElementById("edit-name").value = m.name||"";
  document.getElementById("edit-kana").value = m.kana||"";
  document.getElementById("edit-num").value  = m.num||"";
  document.getElementById("edit-gender").value = m.gender||"m";
  document.getElementById("edit-delete-btn").style.display = "inline-flex";
  document.getElementById("edit-delete-btn").onclick = function(){ deleteEntry(); };
  document.getElementById("edit-modal").classList.add("open");
}
function openNew(grade, row){
  editGrade = grade; editRow = row;
  document.getElementById("edit-modal-title").textContent = grade+" "+(row+1)+"番を追加";
  document.getElementById("edit-name").value = "";
  document.getElementById("edit-kana").value = "";
  document.getElementById("edit-num").value  = "";
  document.getElementById("edit-gender").value = "m";
  document.getElementById("edit-delete-btn").style.display = "none";
  document.getElementById("edit-modal").classList.add("open");
}
function closeEditModal(){document.getElementById("edit-modal").classList.remove("open");}
function saveEdit(){
  var name = document.getElementById("edit-name").value.trim();
  if(!data[editGrade]) data[editGrade]=[];
  while(data[editGrade].length<=editRow) data[editGrade].push(null);
  if(name){
    data[editGrade][editRow]={
      name:name,
      kana:document.getElementById("edit-kana").value.trim(),
      num: document.getElementById("edit-num").value.trim(),
      gender:document.getElementById("edit-gender").value
    };
  } else {
    data[editGrade][editRow]=null;
  }
  closeEditModal();
  renderTable();
}
function deleteEntry(){
  if(!confirm("このデータを削除しますか？"))return;
  if(data[editGrade]) data[editGrade][editRow]=null;
  closeEditModal();
  renderTable();
}
function saveData(){
  localStorage.setItem(KEY,JSON.stringify(data));
  var msg=document.getElementById("save-msg");
  msg.textContent="✅ 保存しました（"+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"）";
  setTimeout(function(){msg.textContent="";},3000);
}
function exportCSV(){
  var csv="\uFEFF学年,No,氏名,ふりがな,背番号,性別\n";
  GRADES.forEach(function(g){
    var arr=data[g]||[];
    arr.forEach(function(m,i){
      if(m&&m.name) csv+=g+","+(i+1)+",\""+m.name+"\",\""+m.kana+"\",\""+m.num+"\","+(m.gender==="f"?"女子":"男子")+"\n";
    });
  });
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="smc_members_2026.csv";a.click();
}
document.getElementById("edit-modal").addEventListener("click",function(e){
  if(e.target.id==="edit-modal")closeEditModal();
});
renderTable();
</script>
</body></html>
