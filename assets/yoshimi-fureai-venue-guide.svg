875"/></g><g><circle cx="1050" cy="1200" r="15" fill="#d9edc0"/><circle cx="1050" cy="1200" r="11" fill="#5f9e53"/><circle cx="1047" cy="1197" r="3.6666666666666665" fill="#8fc875"/></g><g><circle cx="1390" cy="1190" r="12" fill="#d9edc0"/><circle cx="1390" cy="1190" r="8" fill="#5f9e53"/><circle cx="1387" cy="1187" r="2.6666666666666665" fill="#8fc875"/></g></g><g id="notes"><rect x="115" y="1685" width="1870" height="1150" rx="14" fill="#fff" stroke="#d7dde2" stroke-width="3"/><text x="155" y="1760" font-size="36" font-weight="800" fill="#20262d" text-anchor="start" class="">【吉見町ふれあい広場】</text><text x="190" y="1825" font-size="31" font-weight="500" fill="#20262d" text-anchor="start" class="">所在地：比企郡吉見町大字小新井 142</text><text x="155" y="1915" font-size="36" font-weight="800" fill="#20262d" text-anchor="start" class="">【会場留意事項等】</text><text x="190" y="1980" font-size="27" font-weight="500" fill="#20262d" text-anchor="start" class="">・試合コート内（芝）での飲み物は水のみ。</text><text x="190" y="2072" font-size="27" font-weight="500" fill="#20262d" text-anchor="start" class="">・アップエリアは、コート東西半円の中。ピクニック広場でのボール使用・アップは禁止。</text><text x="190" y="2164" font-size="27" font-weight="500" fill="#20262d" text-anchor="start" class="">・審判（主審・副審）スパイク不可。トレーニングシューズでお願いします。</text><text x="190" y="2256" font-size="27" font-weight="500" fill="#20262d" text-anchor="start" class="">・スタンド席前の芝エリアでタープ設置禁止・ボール使用禁止。（スタンド席内、タープ設置可能）</text><text x="190" y="2348" font-size="27" font-weight="500" fill="#20262d" text-anchor="start" class="">・試合コートへ入る際（移動）は、ラバーの上を使用。トラック内には入らない。</text><text x="190" y="2440" font-size="27" font-weight="500" fill="#20262d" text-anchor="start" class="">・観戦場所は、指定した観戦エリア（トラック外周）のみ。</text><text x="190" y="2532" font-size="27" font-weight="500" fill="#20262d" text-anchor="start" class="">・駐車場は、東ゲート・西ゲートの駐車場を使用。</text><rect x="155" y="2640" width="1790" height="105" rx="10" fill="#fff3f1" stroke="#c7362f" stroke-width="3"/><text x="1050" y="2707" font-size="31" font-weight="800" fill="#c7362f" text-anchor="middle" class="">【注意】マイクロバスは西ゲート駐車場を使用。</text></g><text x="1980" y="2910" font-size="21" fill="#7a858e" text-anchor="end">吉見SMC　会場案内</text></svg>