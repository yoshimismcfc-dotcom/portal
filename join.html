<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入会申込書｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .page-tab-bar{display:flex;gap:0;margin-bottom:24px;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2)}
    .page-tab-btn{
      flex:1;padding:12px 8px;font:inherit;font-size:.88rem;font-weight:900;
      background:var(--surface-lt);color:#6aaccc;border:none;cursor:pointer;
      transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .page-tab-btn:not(:last-child){border-right:1px solid var(--line-2)}
    .page-tab-btn.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;box-shadow:var(--glow-o)}
    .form-section-title{font-size:.75rem;font-weight:900;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
    .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:480px){.form-grid-2{grid-template-columns:1fr}}
    #form-area{display:block}
    #preview-area{display:none}

    /* ===== 印刷用スタイル ===== */
    @media print {
      body{background:#fff !important;color:#000 !important}
      .site-header,.back-btn,.hero-band,.page-tab-bar,.no-print,.site-footer,.panel,.notice-bar{display:none !important}
      .page-wrap{padding:0 !important;max-width:100% !important}
      #form-area{display:none !important}
      #preview-area{display:block !important}
      .print-sheet{
        width:210mm;min-height:297mm;padding:12mm 14mm 10mm;
        background:#fff;color:#000;margin:0;
        box-shadow:none !important;border-radius:0 !important;
        font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
        font-size:10pt;
      }
    }

    /* ===== 画面プレビュー ===== */
    .print-sheet{
      background:#fff;color:#111;
      border-radius:var(--r12);padding:22px 26px 18px;
      box-shadow:var(--shadow-lg),0 0 0 1px rgba(0,0,0,.08);
      max-width:680px;margin:0 auto;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:10pt;line-height:1.6;
    }

    /* 申込書セクション */
    .doc-title{text-align:center;font-size:14pt;font-weight:bold;margin-bottom:4px;letter-spacing:.06em}
    .doc-sub{text-align:center;font-size:9pt;color:#555;margin-bottom:10px}
    .doc-date-line{text-align:right;font-size:9pt;margin-bottom:10px}
    .doc-intro{font-size:9.5pt;margin-bottom:8px}

    .doc-table{width:100%;border-collapse:collapse;margin-bottom:10px}
    .doc-table th,.doc-table td{border:1px solid #777;padding:4px 8px;font-size:9.5pt;vertical-align:top}
    .doc-table th{background:#eef2fa;font-weight:bold;white-space:nowrap;width:110px}
    .doc-table td{min-height:22px}
    .doc-table .name-big{font-size:13pt;font-weight:bold;letter-spacing:.06em}
    .doc-table .kana-row{font-size:8pt;color:#555;border-bottom:none !important}

    .doc-divider{border:none;border-top:2px solid #000;margin:10px 0 8px}
    .doc-pledge-title{text-align:center;font-size:13pt;font-weight:bold;margin-bottom:4px}
    .doc-pledge-to{text-align:right;font-size:9pt;margin-bottom:2px}
    .doc-pledge-date{text-align:right;font-size:9pt;margin-bottom:6px}
    .doc-pledge-intro{font-size:9pt;margin-bottom:8px}
    .doc-ki{text-align:center;font-size:9.5pt;font-weight:bold;margin:8px 0 6px;letter-spacing:.5em}
    .doc-pledge-list{list-style:none;padding:0;margin:0 0 10px}
    .doc-pledge-list li{font-size:9pt;line-height:1.8;padding-left:16px;text-indent:-16px}
    .doc-ijou{text-align:right;font-size:9pt;margin-bottom:8px}
    .doc-sign-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:9.5pt}
    .doc-sign-line{border-bottom:1px solid #333;width:160px;height:22px;display:inline-block}
    .doc-hanko{width:28px;height:28px;border:1px solid #333;border-radius:50%;display:inline-block;vertical-align:middle;text-align:center;line-height:26px;font-size:7pt;color:#999}
    .doc-note{font-size:7.5pt;color:#666;margin-top:4px;text-align:center}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">⚽</div>
    <div><div class="hero-title">入会申込書</div>
      <div class="hero-sub">入力後にプレビューを確認し、A4一枚で印刷できます。</div></div>
  </div>

  <!-- タブバー -->
  <div class="page-tab-bar no-print">
    <button class="page-tab-btn active" id="btn-form"    onclick="showTab('form')">✏️ 入力フォーム</button>
    <button class="page-tab-btn"        id="btn-preview" onclick="showTab('preview')">👁 プレビュー</button>
    <button class="page-tab-btn"        id="btn-print"   onclick="doPrint()">🖨 印刷（A4）</button>
  </div>

  <!-- 入力フォーム -->
  <div id="form-area">
    <div class="panel">
      <div class="form-section-title">📅 提出日</div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">提出年（西暦）</label>
          <input class="form-control" id="f-year" type="number" placeholder="例：2026" style="text-align:center"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group"><label class="form-label">月</label>
            <input class="form-control" id="f-month" type="number" min="1" max="12" placeholder="月" style="text-align:center"></div>
          <div class="form-group"><label class="form-label">日</label>
            <input class="form-control" id="f-day" type="number" min="1" max="31" placeholder="日" style="text-align:center"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="form-section-title">👨‍👩‍👦 保護者情報</div>
      <div class="form-group"><label class="form-label">保護者名</label>
        <input class="form-control" id="f-pname" placeholder="例：吉見　一郎"></div>
    </div>

    <div class="panel">
      <div class="form-section-title">🧒 入会者情報</div>
      <div class="form-group"><label class="form-label">入会者名（フリガナ）</label>
        <input class="form-control" id="f-kana" placeholder="例：ヨシミ　タロウ"></div>
      <div class="form-group"><label class="form-label">入会者名（漢字）</label>
        <input class="form-control" id="f-name" placeholder="例：吉見　太郎"></div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">生年月日（西暦）</label>
          <input class="form-control" id="f-birth" type="date"></div>
        <div class="form-group"><label class="form-label">学年</label>
          <select class="form-control" id="f-grade">
            <option value="">選択</option>
            <option>年長</option><option>1年生</option><option>2年生</option>
            <option>3年生</option><option>4年生</option><option>5年生</option><option>6年生</option>
          </select></div>
      </div>
      <div class="form-group"><label class="form-label">学校名</label>
        <input class="form-control" id="f-school" placeholder="例：吉見小学校"></div>
    </div>

    <div class="panel">
      <div class="form-section-title">📍 住所・連絡先</div>
      <div class="form-group"><label class="form-label">住所（〒含む）</label>
        <input class="form-control" id="f-addr" placeholder="例：〒355-0124 埼玉県比企郡吉見町〇〇123"></div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">電話番号</label>
          <input class="form-control" id="f-tel" type="tel" placeholder="例：0493-00-0000"></div>
        <div class="form-group"><label class="form-label">緊急連絡先（携帯）</label>
          <input class="form-control" id="f-mobile" type="tel" placeholder="例：090-1234-5678"></div>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" onclick="showTab('preview')" style="flex:1">👁 プレビューを確認する</button>
      <button class="btn btn-outline" onclick="clearForm()">🗑 クリア</button>
    </div>
  </div>

  <!-- プレビュー -->
  <div id="preview-area">
    <div class="panel no-print" style="margin-bottom:14px;padding:12px 16px">
      <p style="color:#a8d4f0;font-size:.84rem;margin:0">👇 A4一枚で印刷されます。内容を確認したら「🖨 印刷（A4）」をタップしてください。</p>
    </div>
    <div class="print-sheet" id="print-sheet"></div>
  </div>
</main>
<footer class="site-footer no-print">YOSHIMI SMC FC — SMART PORTAL</footer>

<script>
function showTab(tab){
  var fa=document.getElementById("form-area"),pa=document.getElementById("preview-area");
  var bf=document.getElementById("btn-form"),bp=document.getElementById("btn-preview"),bpr=document.getElementById("btn-print");
  [bf,bp,bpr].forEach(function(b){b.classList.remove("active");});
  if(tab==="form"){fa.style.display="block";pa.style.display="none";bf.classList.add("active");}
  else if(tab==="preview"){fa.style.display="none";pa.style.display="block";bp.classList.add("active");buildPreview();}
}
function doPrint(){buildPreview();document.getElementById("form-area").style.display="none";document.getElementById("preview-area").style.display="block";setTimeout(function(){window.print();},200);}

function gv(id){var e=document.getElementById(id);return e?e.value.trim():"";}
function fmtBirth(val){
  if(!val)return "　　　年　　月　　日";
  var d=new Date(val);
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}
function fmtDateParts(){
  var y=gv("f-year")||"　　　",m=gv("f-month")||"　　",d=gv("f-day")||"　　";
  return "西暦　"+y+"年　"+m+"月　"+d+"日";
}

function buildPreview(){
  var y=gv("f-year")||"　　　",mon=gv("f-month")||"　　",day=gv("f-day")||"　　";
  var pname=gv("f-pname")||"　";
  var kana=gv("f-kana")||"　";
  var name=gv("f-name")||"　";
  var birth=fmtBirth(gv("f-birth"));
  var grade=gv("f-grade")||"　";
  var school=gv("f-school")||"　";
  var addr=gv("f-addr")||"　";
  var tel=gv("f-tel")||"　";
  var mobile=gv("f-mobile")||"　";

  var html="";

  // ===== 申込書 =====
  html+='<div class="doc-title">吉見 SMC フットボールクラブ入会申込書</div>';
  html+='<div class="doc-date-line">西暦　'+y+'年　'+mon+'月　'+day+'日</div>';
  html+='<div class="doc-intro">吉見 SMC フットボールクラブに入会を希望致します。</div>';
  html+='<div class="doc-date-line" style="margin-bottom:6px">'+fmtDateParts()+'（提出日）</div>';

  html+='<table class="doc-table">';
  html+='<tr><th>保護者名</th><td><span class="name-big">'+pname+'</span></td></tr>';
  html+='<tr class="kana-row"><th>（フリガナ）</th><td style="font-size:9pt;color:#555">入会者フリガナ：'+kana+'</td></tr>';
  html+='<tr><th>入会者</th><td><span class="name-big">'+name+'</span></td></tr>';
  html+='<tr><th>生年月日</th><td>（西暦で記入）　'+birth+'</td></tr>';
  html+='<tr><th>住所</th><td>〒'+addr+'</td></tr>';
  html+='<tr><th>学校名・学年</th><td>'+school+'　　'+grade+'</td></tr>';
  html+='<tr><th>電話番号</th><td>'+tel+'</td></tr>';
  html+='<tr><th>緊急連絡先<br>（携帯）</th><td>'+mobile+'</td></tr>';
  html+='</table>';

  html+='<hr class="doc-divider">';

  // ===== 誓約書 =====
  html+='<div class="doc-pledge-title">吉見 SMCフットボールクラブ保護者誓約書</div>';
  html+='<div class="doc-pledge-to">吉見 SMC フットボールクラブ　指導者様</div>';
  html+='<div class="doc-pledge-date">西暦　'+y+'年　'+mon+'月　'+day+'日（提出日）</div>';

  html+='<table class="doc-table" style="margin-bottom:8px">';
  html+='<tr class="kana-row"><th>（フリガナ）</th><td style="font-size:9pt;color:#555">'+kana+'</td></tr>';
  html+='<tr><th>入会者</th><td><span class="name-big">'+name+'</span></td></tr>';
  html+='</table>';

  html+='<div class="doc-pledge-intro">上記の者が貴少年団に入会しサッカー等の活動を行うに際し、貴少年団の会則を尊守するとともに、下記事項について一切の責任は保護者が負うことを誓約します。</div>';
  html+='<div class="doc-ki">記</div>';
  html+='<ol class="doc-pledge-list">';
  html+='<li>１、健康状態を常に把握し、安全確認の上参加させる。</li>';
  html+='<li>２、貴少年団活動中及び、会場と自宅との経路往復中の事故等、障害について貴少年団が指定するスポーツ安全保険の適用範囲外の補償は、貴少年団に対して一切補償請求しない。</li>';
  html+='</ol>';
  html+='<div class="doc-ijou">以上</div>';
  html+='<div class="doc-sign-row">保護者名　<span class="doc-sign-line"></span>　<span class="doc-hanko">印</span></div>';
  html+='<div class="doc-note">※本申込書は入会後の活動管理のみに使用し、第三者へは提供いたしません。</div>';

  document.getElementById("print-sheet").innerHTML=html;
}

function clearForm(){
  if(!confirm("入力内容をすべてクリアしますか？"))return;
  ["f-year","f-month","f-day","f-pname","f-kana","f-name","f-birth","f-school","f-addr","f-tel","f-mobile"].forEach(function(id){
    var e=document.getElementById(id);if(e)e.value="";
  });
  document.getElementById("f-grade").value="";
}

// 今日の日付をデフォルト設定
(function(){
  var now=new Date();
  document.getElementById("f-year").value=now.getFullYear();
  document.getElementById("f-month").value=now.getMonth()+1;
  document.getElementById("f-day").value=now.getDate();
})();
</script>
</body></html>
