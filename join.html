<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体験・入団申込｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    /* タブはsafariのprint対応のためdisplay:none/block方式 */
    .page-tab-bar{display:flex;gap:0;margin-bottom:24px;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2)}
    .page-tab-btn{
      flex:1;padding:11px 8px;font:inherit;font-size:.88rem;font-weight:900;
      background:var(--surface-lt);color:#6aaccc;border:none;cursor:pointer;
      transition:.15s;letter-spacing:.02em;
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .page-tab-btn:not(:last-child){border-right:1px solid var(--line-2)}
    .page-tab-btn.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff}

    /* フォーム */
    .form-section-title{
      font-size:.78rem;font-weight:900;color:var(--cyan);letter-spacing:.1em;
      text-transform:uppercase;margin:18px 0 10px;
      padding-bottom:6px;border-bottom:1px solid var(--line);
    }
    .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:480px){.form-grid-2{grid-template-columns:1fr}}

    /* プレビュー */
    #preview-area{display:none}
    #form-area{display:block}

    /* A4印刷スタイル */
    @media print {
      body{background:#fff !important;color:#000 !important;font-size:11pt}
      .site-header,.back-btn,.hero-band,.page-tab-bar,.no-print,.site-footer{display:none !important}
      .page-wrap{padding:0 !important;max-width:100% !important}
      #form-area{display:none !important}
      #preview-area{display:block !important}
      .print-sheet{
        width:210mm;min-height:297mm;padding:14mm 14mm 14mm;
        background:#fff;color:#000;
        page-break-after:always;
        box-shadow:none !important;
      }
      .print-sheet *{color:#000 !important;background:transparent !important;border-color:#999 !important}
    }

    /* 印刷プレビュー */
    .print-sheet{
      background:#fff;color:#111;border-radius:var(--r12);
      padding:24px 28px;box-shadow:var(--shadow-lg);
      max-width:680px;margin:0 auto;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    }
    .sheet-header{text-align:center;border-bottom:3px double #003087;padding-bottom:14px;margin-bottom:18px}
    .sheet-header .sheet-title{font-size:1.4rem;font-weight:900;color:#003087;letter-spacing:.12em}
    .sheet-header .sheet-sub{font-size:.8rem;color:#444;margin-top:4px}
    .sheet-section{margin-bottom:16px}
    .sheet-section-title{
      background:#003087;color:#fff;font-size:.78rem;font-weight:900;
      padding:4px 10px;letter-spacing:.08em;margin-bottom:8px;
    }
    .sheet-row{
      display:grid;grid-template-columns:120px 1fr;gap:0;
      border-bottom:1px solid #ddd;min-height:30px;align-items:center;
    }
    .sheet-row:last-child{border-bottom:none}
    .sheet-label{
      font-size:.78rem;font-weight:bold;color:#333;
      padding:5px 8px;background:#f5f7fa;border-right:1px solid #ddd;
    }
    .sheet-value{font-size:.88rem;padding:5px 10px;color:#111;word-break:break-all}
    .sheet-footer{margin-top:24px;font-size:.72rem;color:#666;text-align:center;border-top:1px solid #ddd;padding-top:12px}
    .sheet-big-name{font-size:1.4rem;font-weight:900;letter-spacing:.1em;color:#111}
    .sheet-checkbox-row{display:flex;gap:16px;flex-wrap:wrap;padding:5px 10px}
    .sheet-cb{display:flex;align-items:center;gap:4px;font-size:.82rem}
    .cb-box{width:14px;height:14px;border:1px solid #333;display:inline-block;text-align:center;line-height:14px;font-size:10px}
    .cb-box.checked::after{content:"✓"}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">⚽</div>
    <div><div class="hero-title">体験・入団申込</div>
      <div class="hero-sub">申込フォームに入力し、プレビューを確認して印刷できます。</div></div>
  </div>

  <!-- タブバー（添付画像スタイル） -->
  <div class="page-tab-bar no-print">
    <button class="page-tab-btn active" id="btn-form" onclick="showTab('form')">✏️ 入力フォーム</button>
    <button class="page-tab-btn" id="btn-preview" onclick="showTab('preview')">👁 プレビュー</button>
    <button class="page-tab-btn" id="btn-print" onclick="doPrint()">🖨 印刷（A4）</button>
  </div>

  <!-- 入力フォーム -->
  <div id="form-area">
    <div class="panel">
      <div class="panel-title">申込種別</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:#c8e8ff;font-size:.9rem">
          <input type="radio" name="type" value="体験" id="type-trial" style="width:auto;height:auto" checked> 体験申込
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:#c8e8ff;font-size:.9rem">
          <input type="radio" name="type" value="入団" id="type-join" style="width:auto;height:auto"> 入団申込
        </label>
      </div>
    </div>

    <div class="panel">
      <div class="form-section-title">🧒 お子様の情報</div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">氏名（漢字）</label>
          <input class="form-control" id="f-name" placeholder="例：吉見　太郎"></div>
        <div class="form-group"><label class="form-label">ふりがな</label>
          <input class="form-control" id="f-kana" placeholder="例：よしみ　たろう"></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">生年月日</label>
          <input class="form-control" id="f-birth" type="date"></div>
        <div class="form-group"><label class="form-label">学年</label>
          <select class="form-control" id="f-grade">
            <option value="">選択してください</option>
            <option>年長</option><option>1年</option><option>2年</option><option>3年</option>
            <option>4年</option><option>5年</option><option>6年</option>
          </select></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">学校名</label>
          <input class="form-control" id="f-school" placeholder="例：吉見小学校"></div>
        <div class="form-group"><label class="form-label">サッカー経験</label>
          <select class="form-control" id="f-exp">
            <option>なし（はじめて）</option>
            <option>少しあり（1年未満）</option>
            <option>あり（1年以上）</option>
          </select></div>
      </div>
      <div class="form-group"><label class="form-label">アレルギー・持病・その他特記事項</label>
        <textarea class="form-control" id="f-allergy" rows="2" placeholder="例：卵アレルギーあり、喘息持ち など（なければ「なし」）"></textarea></div>
    </div>

    <div class="panel">
      <div class="form-section-title">👨‍👩‍👦 保護者の情報</div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">保護者氏名（漢字）</label>
          <input class="form-control" id="f-pname" placeholder="例：吉見　一郎"></div>
        <div class="form-group"><label class="form-label">続柄</label>
          <select class="form-control" id="f-rel">
            <option>父</option><option>母</option><option>祖父</option><option>祖母</option><option>その他</option>
          </select></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">携帯電話番号</label>
          <input class="form-control" id="f-tel" type="tel" placeholder="例：090-1234-5678"></div>
        <div class="form-group"><label class="form-label">メールアドレス</label>
          <input class="form-control" id="f-email" type="email" placeholder="例：sample@email.com"></div>
      </div>
      <div class="form-group"><label class="form-label">住所</label>
        <input class="form-control" id="f-addr" placeholder="例：埼玉県比企郡吉見町〇〇123"></div>
    </div>

    <div class="panel">
      <div class="form-section-title">📅 体験希望日・その他</div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">体験希望日①</label>
          <input class="form-control" id="f-date1" type="date"></div>
        <div class="form-group"><label class="form-label">体験希望日②（予備）</label>
          <input class="form-control" id="f-date2" type="date"></div>
      </div>
      <div class="form-group"><label class="form-label">お問い合わせ・ご要望</label>
        <textarea class="form-control" id="f-note" rows="2" placeholder="送迎方法・ご質問など"></textarea></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" onclick="showTab('preview')" style="flex:1">👁 プレビューを確認する</button>
      <button class="btn btn-outline" onclick="clearForm()">🗑 クリア</button>
    </div>
  </div>

  <!-- プレビュー -->
  <div id="preview-area">
    <div class="panel no-print" style="margin-bottom:16px">
      <p style="color:#a8d4f0;font-size:.85rem">👇 印刷内容のプレビューです。内容を確認して「印刷（A4）」タブをタップしてください。</p>
    </div>
    <div class="print-sheet" id="print-sheet">
      <!-- 動的生成 -->
    </div>
  </div>
</main>
<footer class="site-footer no-print">YOSHIMI SMC FC — SMART PORTAL</footer>

<script>
function showTab(tab) {
  var formArea = document.getElementById("form-area");
  var previewArea = document.getElementById("preview-area");
  var btnForm = document.getElementById("btn-form");
  var btnPrev = document.getElementById("btn-preview");
  var btnPrint = document.getElementById("btn-print");
  [btnForm, btnPrev, btnPrint].forEach(function(b){ b.classList.remove("active"); });
  if (tab === "form") {
    formArea.style.display = "block";
    previewArea.style.display = "none";
    btnForm.classList.add("active");
  } else if (tab === "preview") {
    formArea.style.display = "none";
    previewArea.style.display = "block";
    btnPrev.classList.add("active");
    buildPreview();
  } else if (tab === "print") {
    doPrint();
  }
}

function getVal(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : "";
}
function getRadio(name) {
  var el = document.querySelector("input[name='"+name+"']:checked");
  return el ? el.value : "";
}
function fmtDate(val) {
  if (!val) return "未記入";
  var d = new Date(val);
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}
function cb(val) {
  return "<span class='cb-box" + (val ? " checked" : "") + "'></span>";
}

function buildPreview() {
  var type = getRadio("type") || "体験";
  var now = new Date();
  var dateStr = now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日";

  var html = '<div class="sheet-header">' +
    '<div class="sheet-title">吉見SMCサッカースポーツ少年団</div>' +
    '<div style="font-size:1.1rem;font-weight:900;color:#003087;margin-top:4px;letter-spacing:.06em">'+type+'申込書</div>' +
    '<div class="sheet-sub">申込日：'+dateStr+'</div>' +
  '</div>';

  // 申込種別
  html += '<div class="sheet-section">' +
    '<div class="sheet-section-title">申込種別</div>' +
    '<div style="padding:6px 10px;display:flex;gap:20px">' +
      '<div class="sheet-cb">'+cb(type==="体験")+'<span> 体験申込</span></div>' +
      '<div class="sheet-cb">'+cb(type==="入団")+'<span> 入団申込</span></div>' +
    '</div></div>';

  // 子供情報
  html += '<div class="sheet-section">' +
    '<div class="sheet-section-title">お子様の情報</div>' +
    '<div class="sheet-row"><div class="sheet-label">氏名</div><div class="sheet-value"><span class="sheet-big-name">'+( getVal("f-name")||"　　　　　　" )+'</span></div></div>' +
    '<div class="sheet-row"><div class="sheet-label">ふりがな</div><div class="sheet-value">'+(getVal("f-kana")||"　")+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">生年月日</div><div class="sheet-value">'+fmtDate(getVal("f-birth"))+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">学年</div><div class="sheet-value">'+(getVal("f-grade")||"　")+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">学校名</div><div class="sheet-value">'+(getVal("f-school")||"　")+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">サッカー経験</div><div class="sheet-value">'+(getVal("f-exp")||"　")+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">アレルギー・特記事項</div><div class="sheet-value">'+(getVal("f-allergy")||"なし")+'</div></div>' +
  '</div>';

  // 保護者情報
  html += '<div class="sheet-section">' +
    '<div class="sheet-section-title">保護者の情報</div>' +
    '<div class="sheet-row"><div class="sheet-label">保護者氏名</div><div class="sheet-value">'+(getVal("f-pname")||"　")+'　（'+(getVal("f-rel")||"続柄")+'）</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">携帯電話</div><div class="sheet-value">'+(getVal("f-tel")||"　")+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">メールアドレス</div><div class="sheet-value">'+(getVal("f-email")||"　")+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">住所</div><div class="sheet-value">'+(getVal("f-addr")||"　")+'</div></div>' +
  '</div>';

  // 体験希望日
  html += '<div class="sheet-section">' +
    '<div class="sheet-section-title">体験希望日・ご要望</div>' +
    '<div class="sheet-row"><div class="sheet-label">希望日①</div><div class="sheet-value">'+fmtDate(getVal("f-date1"))+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">希望日②</div><div class="sheet-value">'+fmtDate(getVal("f-date2"))+'</div></div>' +
    '<div class="sheet-row"><div class="sheet-label">ご要望・質問</div><div class="sheet-value">'+(getVal("f-note")||"　")+'</div></div>' +
  '</div>';

  // 同意欄
  html += '<div class="sheet-section">' +
    '<div class="sheet-section-title">同意事項</div>' +
    '<div style="padding:8px 10px;font-size:.78rem;color:#333;line-height:1.8">' +
      '・活動中の怪我について、軽微なものは団の救急対応の範囲内で対処します。<br>' +
      '・写真・動画の撮影・SNS掲載については、個人が特定されないよう配慮します。<br>' +
      '・個人情報は団の活動管理のみに使用し、第三者へ提供しません。' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;padding:0 10px">' +
      '<div>' +
        '<div style="font-size:.72rem;color:#666;margin-bottom:4px">保護者署名</div>' +
        '<div style="border-bottom:1px solid #333;height:32px"></div>' +
      '</div>' +
      '<div>' +
        '<div style="font-size:.72rem;color:#666;margin-bottom:4px">申込日</div>' +
        '<div style="border-bottom:1px solid #333;height:32px;display:flex;align-items:flex-end;padding-bottom:2px;font-size:.85rem">'+dateStr+'</div>' +
      '</div>' +
    '</div>' +
  '</div>';

  html += '<div class="sheet-footer">吉見SMCサッカースポーツ少年団　〒355-0124 埼玉県比企郡吉見町</div>';

  document.getElementById("print-sheet").innerHTML = html;
}

function doPrint() {
  buildPreview();
  document.getElementById("form-area").style.display = "none";
  document.getElementById("preview-area").style.display = "block";
  setTimeout(function(){ window.print(); }, 200);
}

function clearForm() {
  if (!confirm("入力内容をすべてクリアしますか？")) return;
  ["f-name","f-kana","f-birth","f-school","f-allergy","f-pname","f-tel","f-email","f-addr","f-date1","f-date2","f-note"].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("f-grade").value = "";
  document.getElementById("f-exp").selectedIndex = 0;
  document.getElementById("f-rel").selectedIndex = 0;
  document.getElementById("type-trial").checked = true;
}
</script>
</body></html>
