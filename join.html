<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入会申込書｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .page-tab-bar{display:flex;gap:0;margin-bottom:24px;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2)}
    .page-tab-btn{flex:1;padding:12px 8px;font:inherit;font-size:.88rem;font-weight:900;background:var(--surface-lt);color:#6aaccc;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
    .page-tab-btn:not(:last-child){border-right:1px solid var(--line-2)}
    .page-tab-btn.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;box-shadow:var(--glow-o)}
    .form-section-title{font-size:.75rem;font-weight:900;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
    .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    @media(max-width:480px){.form-grid-2,.form-grid-3{grid-template-columns:1fr}}
    #form-area{display:block}
    #preview-area{display:none}

    /* ===== 印刷スタイル ===== */
    @media print {
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body,html{background:#fff !important;margin:0;padding:0}
      .site-header,.back-btn,.hero-band,.page-tab-bar,.no-print,.site-footer,.panel,.notice-bar{display:none !important}
      .page-wrap{padding:0 !important;max-width:100% !important;margin:0 !important}
      #form-area{display:none !important}
      #preview-area{display:block !important;padding:0 !important;margin:0 !important}
      .print-sheet{
        width:210mm !important;height:297mm !important;
        padding:14mm 18mm 12mm !important;
        background:#fff !important;color:#000 !important;
        margin:0 !important;
        box-shadow:none !important;border-radius:0 !important;
        font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif !important;
        font-size:9.5pt !important;line-height:1.55 !important;
        overflow:hidden !important;
        page-break-after:avoid !important;
        page-break-inside:avoid !important;
      }
    }
    @page{size:A4 portrait;margin:0}

    /* ===== プレビュー画面 ===== */
    .print-sheet{
      background:#fff;color:#111;
      border-radius:var(--r12);padding:22px 26px;
      box-shadow:var(--shadow-lg),0 0 0 1px rgba(0,0,0,.1);
      max-width:660px;margin:0 auto;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:10pt;line-height:1.55;
    }

    /* ===== 書式スタイル ===== */
    .d-center{text-align:center}
    .d-right{text-align:right}
    .d-title{text-align:center;font-size:13.5pt;font-weight:bold;margin-bottom:6px;letter-spacing:.08em;text-decoration:underline}
    .d-section-title{text-align:center;font-size:12pt;font-weight:bold;margin:10px 0 4px;letter-spacing:.06em;text-decoration:underline}

    .d-line{border-bottom:1px solid #333;display:block;min-width:60px;display:inline-block}
    .d-uline{border-bottom:1px solid #333;display:block;width:100%;min-height:18px;margin-bottom:2px}
    .d-uline-short{border-bottom:1px solid #333;display:inline-block;min-width:120px;min-height:16px}

    .d-row{display:flex;align-items:baseline;gap:4px;margin-bottom:4px;font-size:9.5pt}
    .d-label{font-size:9.5pt;font-weight:bold;white-space:nowrap}
    .d-sublabel{font-size:8pt;color:#444}
    .d-val{border-bottom:1px solid #333;flex:1;min-height:16px;padding-bottom:1px}
    .d-stamp{width:26px;height:26px;border:1px solid #333;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8pt;color:#555;flex-shrink:0;vertical-align:middle}
    .d-small{font-size:8pt;color:#444}
    .d-indent{padding-left:1em}
    .d-flex-right{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px}

    .d-ki{text-align:center;font-size:10pt;font-weight:bold;letter-spacing:1em;margin:6px 0 4px}
    .d-list{list-style:none;padding:0;margin:0 0 4px}
    .d-list li{font-size:9pt;line-height:1.8;padding-left:0}

    .d-sign-row{display:flex;align-items:center;gap:6px;font-size:9.5pt;margin-top:4px}
    .d-sign-line{border-bottom:1px solid #333;flex:1;min-height:16px}

    .d-divider{border:none;border-top:1.5px solid #000;margin:8px 0 6px}
    .d-mb2{margin-bottom:2px}
    .d-mb4{margin-bottom:4px}
    .d-mb6{margin-bottom:6px}
    .d-mb8{margin-bottom:8px}
    .d-birth-row{display:flex;align-items:baseline;gap:6px;font-size:9.5pt;margin-bottom:4px}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">⚽</div>
    <div><div class="hero-title">入会申込書</div>
      <div class="hero-sub">入力後にプレビューを確認し、A4一枚で印刷できます。</div></div>
  </div>

  <div class="page-tab-bar no-print">
    <button class="page-tab-btn active" id="btn-form"    onclick="showTab('form')">✏️ 入力フォーム</button>
    <button class="page-tab-btn"        id="btn-preview" onclick="showTab('preview')">👁 プレビュー</button>
    <button class="page-tab-btn"        id="btn-print"   onclick="doPrint()">🖨 印刷（A4）</button>
  </div>

  <!-- 入力フォーム -->
  <div id="form-area">
    <div class="panel">
      <div class="form-section-title">📅 提出日</div>
      <div class="form-grid-3">
        <div class="form-group"><label class="form-label">西暦（年）</label>
          <input class="form-control" id="f-year" type="number" placeholder="2026" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">月</label>
          <input class="form-control" id="f-month" type="number" min="1" max="12" placeholder="月" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">日</label>
          <input class="form-control" id="f-day" type="number" min="1" max="31" placeholder="日" style="text-align:center"></div>
      </div>
    </div>

    <div class="panel">
      <div class="form-section-title">👨‍👩‍👦 保護者</div>
      <div class="form-group"><label class="form-label">保護者名（漢字）</label>
        <input class="form-control" id="f-pname" placeholder="例：吉見　一郎"></div>
      <div class="form-group"><label class="form-label">保護者名（フリガナ）</label>
        <input class="form-control" id="f-pkana" placeholder="例：ヨシミ　イチロウ"></div>
    </div>

    <div class="panel">
      <div class="form-section-title">🧒 入会者</div>
      <div class="form-group"><label class="form-label">入会者名（フリガナ）</label>
        <input class="form-control" id="f-kana" placeholder="例：ヨシミ　タロウ"></div>
      <div class="form-group"><label class="form-label">入会者名（漢字）</label>
        <input class="form-control" id="f-name" placeholder="例：吉見　太郎"></div>
      <div class="form-section-title">生年月日（西暦で記入）</div>
      <div class="form-grid-3">
        <div class="form-group"><label class="form-label">年</label>
          <input class="form-control" id="f-by" type="number" placeholder="例：2018" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">月</label>
          <input class="form-control" id="f-bm" type="number" min="1" max="12" placeholder="月" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">日</label>
          <input class="form-control" id="f-bd" type="number" min="1" max="31" placeholder="日" style="text-align:center"></div>
      </div>
    </div>

    <div class="panel">
      <div class="form-section-title">📍 住所・学校・連絡先</div>
      <div class="form-group"><label class="form-label">住所（〒含む）</label>
        <input class="form-control" id="f-addr" placeholder="例：〒355-0124 埼玉県比企郡吉見町〇〇123"></div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">学校名</label>
          <input class="form-control" id="f-school" placeholder="例：吉見小学校"></div>
        <div class="form-group"><label class="form-label">学年</label>
          <select class="form-control" id="f-grade">
            <option value="">選択</option>
            <option>年長</option><option>1</option><option>2</option>
            <option>3</option><option>4</option><option>5</option><option>6</option>
          </select></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">電話番号</label>
          <input class="form-control" id="f-tel" type="tel" placeholder="例：0493-00-0000"></div>
        <div class="form-group"><label class="form-label">緊急連絡先（携帯）</label>
          <input class="form-control" id="f-mobile" type="tel" placeholder="例：090-1234-5678"></div>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" onclick="showTab('preview')" style="flex:1">👁 プレビューを確認する</button>
      <button class="btn btn-outline" onclick="clearForm()">🗑 クリア</button>
    </div>
  </div>

  <!-- プレビュー -->
  <div id="preview-area">
    <div class="panel no-print" style="margin-bottom:14px;padding:11px 16px">
      <p style="color:#a8d4f0;font-size:.84rem;margin:0">👇 A4一枚で印刷されます。「🖨 印刷（A4）」タブをタップしてください。</p>
    </div>
    <div class="print-sheet" id="print-sheet"></div>
  </div>
</main>
<footer class="site-footer no-print">YOSHIMI SMC FC — SMART PORTAL</footer>

<script>
function showTab(tab){
  var fa=document.getElementById("form-area"),pa=document.getElementById("preview-area");
  var bf=document.getElementById("btn-form"),bp=document.getElementById("btn-preview"),bpr=document.getElementById("btn-print");
  [bf,bp,bpr].forEach(function(b){b.classList.remove("active");});
  if(tab==="form"){fa.style.display="block";pa.style.display="none";bf.classList.add("active");}
  else if(tab==="preview"){fa.style.display="none";pa.style.display="block";bp.classList.add("active");buildPreview();}
}
function doPrint(){buildPreview();document.getElementById("form-area").style.display="none";document.getElementById("preview-area").style.display="block";setTimeout(function(){window.print();},300);}

function gv(id){var e=document.getElementById(id);return e?e.value.trim():"";}

function buildPreview(){
  var y=gv("f-year")||"　　　　",mon=gv("f-month")||"　　",day=gv("f-day")||"　　";
  var pname=gv("f-pname"),pkana=gv("f-pkana");
  var kana=gv("f-kana"),name=gv("f-name");
  var by=gv("f-by")||"　　　　",bm=gv("f-bm")||"　　",bd=gv("f-bd")||"　　";
  var addr=gv("f-addr"),school=gv("f-school"),grade=gv("f-grade");
  var tel=gv("f-tel"),mobile=gv("f-mobile");

  function sp(v,ph){return v||ph||"";}
  function ul(v,ph,w){return '<span style="border-bottom:1px solid #333;display:inline-block;min-width:'+(w||'120px')+';padding-bottom:1px">'+(v||ph||"")+'</span>';}
  function uline(v){return '<div class="d-uline">'+(v||"")+'</div>';}

  var h="";

  /* ===== 申込書 ===== */
  h+='<div class="d-title">吉見　SMC　フットボールクラブ　入会申込書</div>';
  h+='<div class="d-row d-mb2"><span class="d-label">西暦</span>'+ul(y,"","60px")+'<span>年</span>'+ul(mon,"","40px")+'<span>月</span>'+ul(day,"","40px")+'<span>日</span></div>';

  h+='<div class="d-row d-mb4">吉見 SMC フットボールクラブ　に入会を希望致します。</div>';

  h+='<div class="d-row d-mb4"><span class="d-label">西暦</span>'+ul(y,"","60px")+'<span>年</span>'+ul(mon,"","40px")+'<span>月</span>'+ul(day,"","40px")+'<span>日（提出日）</span></div>';

  /* 保護者名 */
  h+='<div class="d-label d-mb2">保護者名</div>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">';
  h+=uline(pname).replace('</div>','')+'<span class="d-stamp">印</span></div>';

  h+='<div class="d-sublabel d-mb2">（フリガナ）</div>';
  h+='<div class="d-uline d-mb4">'+(pkana||"")+'</div>';

  /* 入会者 */
  h+='<div class="d-label d-mb2">入会者</div>';
  h+='<div class="d-sublabel d-mb2">（フリガナ）</div>';
  h+='<div class="d-uline d-mb2">'+(kana||"")+'</div>';
  h+='<div class="d-uline d-mb4">'+(name||"")+'</div>';

  /* 生年月日 */
  h+='<div class="d-sublabel d-mb2">（西暦で記入）</div>';
  h+='<div class="d-label d-mb2">生年月日</div>';
  h+='<div class="d-birth-row">'+ul(by,"","70px")+'<span>年</span>'+ul(bm,"","40px")+'<span>月</span>'+ul(bd,"","40px")+'<span>日</span></div>';

  /* 住所 */
  h+='<div class="d-row d-mb2"><span class="d-label">住所</span><span>〒</span><span class="d-val">'+(addr||"")+'</span></div>';
  h+='<div class="d-uline d-mb4"></div>';

  /* 学校 */
  h+='<div class="d-label d-mb2">学校名・学年</div>';
  h+='<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px">';
  h+='<span class="d-val" style="flex:1;border-bottom:1px solid #333">'+(school||"")+'</span>';
  h+='<span class="d-val" style="border-bottom:1px solid #333;min-width:60px">'+(grade?grade+"年生":"　　年生")+'</span></div>';

  /* 電話 */
  h+='<div class="d-label d-mb2">電話番号</div>';
  h+='<div class="d-uline d-mb4">'+(tel||"")+'</div>';

  /* 緊急連絡先 */
  h+='<div class="d-row d-mb2"><span class="d-label">緊急連絡先</span><span class="d-val">'+(mobile||"")+'</span><span class="d-small">（携帯）</span></div>';
  h+='<div class="d-uline d-mb6"></div>';

  h+='<hr class="d-divider">';

  /* ===== 誓約書 ===== */
  h+='<div class="d-section-title">吉見　SMC フットボールクラブ　保護者誓約書</div>';
  h+='<div class="d-row d-mb4">吉見　SMC　フットボールクラブ　指導者　様</div>';
  h+='<div class="d-row d-mb4"><span class="d-label">西暦</span>'+ul(y,"","60px")+'<span>年</span>'+ul(mon,"","50px")+'<span>月</span>'+ul(day,"","50px")+'<span>日（提出日）</span></div>';

  h+='<div class="d-sublabel d-mb2">（フリガナ）</div>';
  h+='<div class="d-label d-mb2">入会者</div>';
  h+='<div class="d-uline d-mb4">'+(name||"")+'</div>';

  h+='<div class="d-row d-mb4" style="font-size:9pt;line-height:1.7">上記の者が貴　少年団に入会しサッカー等の活動を行うに際し、貴少年団の会則を尊守するとともに、下記事項について一切の責任は　保護者が負うことを誓約します。</div>';

  h+='<div class="d-ki">記</div>';
  h+='<ul class="d-list">';
  h+='<li>１、健康状態を常に把握し、安全確認の上参加させる。</li>';
  h+='<li>２、貴少年団活動中及び、会場と自宅との経路往復中の事故等、障害について貴少年団が指定するスポーツ安全保険の適用範囲外の　補償は、貴少年団に対して一切補償請求しない。</li>';
  h+='</ul>';
  h+='<div class="d-right d-mb4" style="font-size:9.5pt">以上</div>';

  h+='<div class="d-flex-right"><span class="d-stamp">印</span></div>';
  h+='<div class="d-sign-row"><span class="d-label">保護者名</span><span class="d-sign-line">'+(pname||"")+'</span></div>';

  document.getElementById("print-sheet").innerHTML=h;
}

function clearForm(){
  if(!confirm("入力内容をすべてクリアしますか？"))return;
  ["f-year","f-month","f-day","f-pname","f-pkana","f-kana","f-name","f-by","f-bm","f-bd","f-addr","f-school","f-tel","f-mobile"].forEach(function(id){
    var e=document.getElementById(id);if(e)e.value="";
  });
  document.getElementById("f-grade").value="";
}
(function(){
  var now=new Date();
  document.getElementById("f-year").value=now.getFullYear();
  document.getElementById("f-month").value=now.getMonth()+1;
  document.getElementById("f-day").value=now.getDate();
})();
</script>
</body></html>
