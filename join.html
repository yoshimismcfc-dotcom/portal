<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入会申込書｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .page-tab-bar{display:flex;gap:0;margin-bottom:24px;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2)}
    .page-tab-btn{flex:1;padding:12px 8px;font:inherit;font-size:.88rem;font-weight:900;background:var(--surface-lt);color:#6aaccc;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
    .page-tab-btn:not(:last-child){border-right:1px solid var(--line-2)}
    .page-tab-btn.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;box-shadow:var(--glow-o)}
    .form-section-title{font-size:.75rem;font-weight:900;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
    .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    @media(max-width:480px){.form-grid-2,.form-grid-3{grid-template-columns:1fr}}
    #form-area{display:block}
    #preview-area{display:none}

    /* ===== 印刷 ===== */
    @media print{
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body,html{background:#fff!important;margin:0;padding:0}
      .site-header,.back-btn,.hero-band,.page-tab-bar,.no-print,.site-footer,.panel,.notice-bar{display:none!important}
      .page-wrap{padding:0!important;max-width:100%!important;margin:0!important}
      #form-area{display:none!important}
      #preview-area{display:block!important;padding:0!important;margin:0!important}
      .print-sheet{width:210mm!important;height:297mm!important;padding:10mm 14mm!important;background:#fff!important;color:#000!important;margin:0!important;box-shadow:none!important;border-radius:0!important;overflow:hidden!important}
    }
    @page{size:A4 portrait;margin:0}

    /* ===== プレビュー画面 ===== */
    .print-sheet{
      background:#fff;color:#111;
      border-radius:14px;
      box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);
      max-width:680px;margin:0 auto;
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
      font-size:9.5pt;line-height:1.55;
      overflow:hidden;
    }

    /* ===== ヘッダー帯 ===== */
    .sheet-header{
      background:linear-gradient(135deg,#003087 0%,#0050cc 60%,#0070ff 100%);
      padding:16px 22px 14px;
      position:relative;overflow:hidden;
    }
    .sheet-header::before{
      content:"";position:absolute;right:-30px;top:-30px;
      width:160px;height:160px;border-radius:50%;
      background:rgba(255,255,255,.07);
    }
    .sheet-header::after{
      content:"";position:absolute;right:30px;bottom:-20px;
      width:100px;height:100px;border-radius:50%;
      background:rgba(255,255,255,.05);
    }
    .sheet-header-inner{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
    .sheet-logo{
      width:48px;height:48px;border-radius:12px;
      background:rgba(255,255,255,.15);
      display:grid;place-items:center;
      font-size:1.6rem;flex-shrink:0;
      border:2px solid rgba(255,255,255,.3);
    }
    .sheet-header-text .sheet-main-title{
      font-size:13pt;font-weight:900;color:#fff;
      letter-spacing:.04em;line-height:1.2;
    }
    .sheet-header-text .sheet-doc-type{
      font-size:9pt;color:rgba(255,255,255,.75);
      margin-top:2px;letter-spacing:.06em;
    }
    .sheet-stripe{height:4px;background:linear-gradient(90deg,#ff6b2b,#ffcc00,#003087)}

    /* ===== 本体 ===== */
    .sheet-body{padding:14px 22px 12px}

    /* 日付行 */
    .sheet-date-row{
      display:flex;align-items:center;gap:4px;
      font-size:9pt;color:#444;margin-bottom:10px;
      padding:6px 10px;background:#f0f4ff;
      border-radius:6px;border-left:3px solid #003087;
    }
    .sheet-date-val{font-weight:700;color:#003087}

    /* セクション */
    .sheet-section{margin-bottom:10px}
    .sheet-section-title{
      background:linear-gradient(135deg,#003087,#0050cc);
      color:#fff;font-size:8pt;font-weight:900;
      padding:4px 10px;border-radius:4px;
      letter-spacing:.08em;margin-bottom:6px;
      display:inline-block;
    }

    /* フィールド行 */
    .sheet-field{margin-bottom:5px}
    .sheet-field-label{
      font-size:8pt;font-weight:700;color:#555;
      margin-bottom:2px;
    }
    .sheet-field-value{
      border-bottom:1.5px solid #999;min-height:20px;
      padding:1px 4px;font-size:10pt;color:#111;
      font-weight:500;
    }
    .sheet-field-value.big{font-size:12pt;font-weight:700;color:#003087}
    .sheet-field-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:5px}
    .sheet-field-row .sf-item{flex:1}
    .sheet-field-row .sf-item.narrow{flex:0 0 auto}

    /* 印鑑欄 */
    .stamp-circle{
      width:32px;height:32px;border-radius:50%;
      border:1.5px solid #555;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:8pt;color:#888;flex-shrink:0;
      margin-left:6px;vertical-align:middle;
    }

    /* 区切り */
    .sheet-divider{
      border:none;margin:10px 0 8px;
      border-top:2px solid #003087;
    }

    /* 誓約書ヘッダー */
    .pledge-title{
      text-align:center;font-size:12pt;font-weight:900;
      color:#003087;margin-bottom:4px;
      text-decoration:underline;text-underline-offset:3px;
    }
    .pledge-to{text-align:right;font-size:8.5pt;color:#444;margin-bottom:4px}

    .pledge-body{
      font-size:8.5pt;color:#222;line-height:1.7;
      background:#f8f9fc;border-radius:6px;border:1px solid #dde3f0;
      padding:8px 10px;margin:6px 0;
    }
    .ki-mark{text-align:center;font-size:9.5pt;font-weight:700;letter-spacing:1em;margin:4px 0 2px}
    .pledge-list{list-style:none;padding:0;margin:0}
    .pledge-list li{font-size:8.5pt;line-height:1.8;color:#222}

    .sign-area{
      display:flex;align-items:center;justify-content:flex-end;
      gap:8px;margin-top:6px;
    }
    .sign-line{border-bottom:1.5px solid #333;width:180px;min-height:20px;padding-bottom:1px;font-size:10pt;font-weight:600}

    .sheet-footer-note{
      text-align:center;font-size:7pt;color:#999;
      margin-top:6px;padding-top:5px;
      border-top:1px solid #eee;
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">⚽</div>
    <div><div class="hero-title">入会申込書</div>
      <div class="hero-sub">入力後にプレビューを確認し、A4一枚で印刷できます。</div></div>
  </div>

  <div class="page-tab-bar no-print">
    <button class="page-tab-btn active" id="btn-form"    onclick="showTab('form')">✏️ 入力フォーム</button>
    <button class="page-tab-btn"        id="btn-preview" onclick="showTab('preview')">👁 プレビュー</button>
    <button class="page-tab-btn"        id="btn-print"   onclick="doPrint()">🖨 印刷（A4）</button>
  </div>

  <!-- 入力フォーム -->
  <div id="form-area">
    <div class="panel">
      <div class="form-section-title">📅 提出日</div>
      <div class="form-grid-3">
        <div class="form-group"><label class="form-label">西暦（年）</label>
          <input class="form-control" id="f-year" type="number" placeholder="2026" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">月</label>
          <input class="form-control" id="f-month" type="number" min="1" max="12" placeholder="月" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">日</label>
          <input class="form-control" id="f-day" type="number" min="1" max="31" placeholder="日" style="text-align:center"></div>
      </div>
    </div>
    <div class="panel">
      <div class="form-section-title">👨‍👩‍👦 保護者</div>
      <div class="form-group"><label class="form-label">保護者名（漢字）</label>
        <input class="form-control" id="f-pname" placeholder="例：吉見　一郎"></div>
      <div class="form-group"><label class="form-label">保護者名（フリガナ）</label>
        <input class="form-control" id="f-pkana" placeholder="例：ヨシミ　イチロウ"></div>
    </div>
    <div class="panel">
      <div class="form-section-title">🧒 入会者</div>
      <div class="form-group"><label class="form-label">入会者名（フリガナ）</label>
        <input class="form-control" id="f-kana" placeholder="例：ヨシミ　タロウ"></div>
      <div class="form-group"><label class="form-label">入会者名（漢字）</label>
        <input class="form-control" id="f-name" placeholder="例：吉見　太郎"></div>
      <div class="form-section-title">生年月日（西暦）</div>
      <div class="form-grid-3">
        <div class="form-group"><label class="form-label">年</label>
          <input class="form-control" id="f-by" type="number" placeholder="2018" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">月</label>
          <input class="form-control" id="f-bm" type="number" min="1" max="12" placeholder="月" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">日</label>
          <input class="form-control" id="f-bd" type="number" min="1" max="31" placeholder="日" style="text-align:center"></div>
      </div>
    </div>
    <div class="panel">
      <div class="form-section-title">📍 住所・学校・連絡先</div>
      <div class="form-group"><label class="form-label">住所（〒含む）</label>
        <input class="form-control" id="f-addr" placeholder="例：〒355-0124 埼玉県比企郡吉見町〇〇123"></div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">学校名</label>
          <input class="form-control" id="f-school" placeholder="例：吉見小学校"></div>
        <div class="form-group"><label class="form-label">学年</label>
          <select class="form-control" id="f-grade">
            <option value="">選択</option>
            <option>年長</option><option>1</option><option>2</option>
            <option>3</option><option>4</option><option>5</option><option>6</option>
          </select></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">電話番号</label>
          <input class="form-control" id="f-tel" type="tel" placeholder="例：0493-00-0000"></div>
        <div class="form-group"><label class="form-label">緊急連絡先（携帯）</label>
          <input class="form-control" id="f-mobile" type="tel" placeholder="例：090-1234-5678"></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" onclick="showTab('preview')" style="flex:1">👁 プレビューを確認する</button>
      <button class="btn btn-outline" onclick="clearForm()">🗑 クリア</button>
    </div>
  </div>

  <!-- プレビュー -->
  <div id="preview-area">
    <div class="panel no-print" style="margin-bottom:14px;padding:11px 16px">
      <p style="color:#a8d4f0;font-size:.84rem;margin:0">👇 A4一枚で印刷されます。「🖨 印刷（A4）」をタップしてください。</p>
    </div>
    <div class="print-sheet" id="print-sheet"></div>
  </div>
</main>
<footer class="site-footer no-print">YOSHIMI SMC FC — SMART PORTAL</footer>

<script>
function showTab(tab){
  var fa=document.getElementById("form-area"),pa=document.getElementById("preview-area");
  var bf=document.getElementById("btn-form"),bp=document.getElementById("btn-preview"),bpr=document.getElementById("btn-print");
  [bf,bp,bpr].forEach(function(b){b.classList.remove("active");});
  if(tab==="form"){fa.style.display="block";pa.style.display="none";bf.classList.add("active");}
  else if(tab==="preview"){fa.style.display="none";pa.style.display="block";bp.classList.add("active");buildPreview();}
}
function doPrint(){buildPreview();document.getElementById("form-area").style.display="none";document.getElementById("preview-area").style.display="block";setTimeout(function(){window.print();},300);}
function gv(id){var e=document.getElementById(id);return e?e.value.trim():"";}

function fv(v,ph){return v||ph||"";}
function line(v,cls){return '<div class="sheet-field-value'+(cls?" "+cls:"")+'">'+fv(v,"")+'</div>';}

function buildPreview(){
  var y=gv("f-year")||"　　　　",mon=gv("f-month")||"　　",day=gv("f-day")||"　　";
  var pname=gv("f-pname"),pkana=gv("f-pkana");
  var kana=gv("f-kana"),name=gv("f-name");
  var by=gv("f-by")||"　　　　",bm=gv("f-bm")||"　　",bd=gv("f-bd")||"　　";
  var addr=gv("f-addr"),school=gv("f-school"),grade=gv("f-grade");
  var tel=gv("f-tel"),mobile=gv("f-mobile");

  var h="";

  /* ===== ヘッダー ===== */
  h+='<div class="sheet-header">';
  h+='<div class="sheet-header-inner">';
  h+='<div class="sheet-logo">⚽</div>';
  h+='<div class="sheet-header-text">';
  h+='<div class="sheet-main-title">吉見 SMC フットボールクラブ</div>';
  h+='<div class="sheet-doc-type">入会申込書 / 保護者誓約書</div>';
  h+='</div></div></div>';
  h+='<div class="sheet-stripe"></div>';

  /* ===== 本体 ===== */
  h+='<div class="sheet-body">';

  /* 日付 */
  h+='<div class="sheet-date-row">西暦 <span class="sheet-date-val">'+y+'</span> 年 <span class="sheet-date-val">'+mon+'</span> 月 <span class="sheet-date-val">'+day+'</span> 日</div>';

  /* 申込書セクション */
  h+='<div class="sheet-section">';
  h+='<span class="sheet-section-title">■ 入会申込書</span>';
  h+='<div style="font-size:8.5pt;color:#333;margin-bottom:6px">吉見 SMC フットボールクラブ　に入会を希望致します。</div>';

  /* 保護者名 */
  h+='<div class="sheet-field">';
  h+='<div class="sheet-field-label">保護者名</div>';
  h+='<div style="display:flex;align-items:center;gap:8px">';
  h+='<div class="sheet-field-value big" style="flex:1">'+fv(pname,"")+'</div>';
  h+='<span class="stamp-circle">印</span>';
  h+='</div></div>';
  h+='<div class="sheet-field"><div class="sheet-field-label">（フリガナ）</div>'+line(pkana)+'</div>';

  /* 入会者 */
  h+='<div class="sheet-field"><div class="sheet-field-label">入会者（フリガナ）</div>'+line(kana)+'</div>';
  h+='<div class="sheet-field"><div class="sheet-field-label">入会者</div>'+line(name,"big")+'</div>';

  /* 生年月日 */
  h+='<div class="sheet-field">';
  h+='<div class="sheet-field-label">生年月日（西暦で記入）</div>';
  h+='<div style="display:flex;align-items:center;gap:6px;font-size:9pt">';
  h+='<div class="sheet-field-value" style="min-width:64px">'+by+'</div><span>年</span>';
  h+='<div class="sheet-field-value" style="min-width:36px">'+bm+'</div><span>月</span>';
  h+='<div class="sheet-field-value" style="min-width:36px">'+bd+'</div><span>日</span>';
  h+='</div></div>';

  /* 住所 */
  h+='<div class="sheet-field"><div class="sheet-field-label">住所　〒</div>'+line(addr)+'</div>';

  /* 学校・学年 */
  h+='<div class="sheet-field">';
  h+='<div class="sheet-field-label">学校名・学年</div>';
  h+='<div style="display:flex;gap:10px;align-items:flex-end">';
  h+='<div class="sheet-field-value" style="flex:1">'+fv(school,"")+'</div>';
  h+='<div class="sheet-field-value" style="min-width:56px">'+fv(grade,"　")+(grade?"年生":"　年生")+'</div>';
  h+='</div></div>';

  /* 電話 */
  h+='<div class="sheet-field"><div class="sheet-field-label">電話番号</div>'+line(tel)+'</div>';

  /* 緊急 */
  h+='<div class="sheet-field">';
  h+='<div class="sheet-field-label">緊急連絡先</div>';
  h+='<div style="display:flex;align-items:center;gap:6px">';
  h+='<div class="sheet-field-value" style="flex:1">'+fv(mobile,"")+'</div>';
  h+='<span style="font-size:8pt;color:#555;white-space:nowrap">（携帯）</span>';
  h+='</div></div>';
  h+='</div>'; // section end

  /* ===== 区切り ===== */
  h+='<hr class="sheet-divider">';

  /* ===== 誓約書 ===== */
  h+='<div class="pledge-title">吉見 SMCフットボールクラブ　保護者誓約書</div>';
  h+='<div class="pledge-to">吉見 SMC フットボールクラブ　指導者　様</div>';
  h+='<div class="sheet-date-row" style="margin-bottom:6px">西暦 <span class="sheet-date-val">'+y+'</span> 年 <span class="sheet-date-val">'+mon+'</span> 月 <span class="sheet-date-val">'+day+'</span> 日（提出日）</div>';

  h+='<div class="sheet-field"><div class="sheet-field-label">（フリガナ）</div>'+line(kana)+'</div>';
  h+='<div class="sheet-field"><div class="sheet-field-label">入会者</div>'+line(name,"big")+'</div>';

  h+='<div class="pledge-body">';
  h+='上記の者が貴　少年団に入会しサッカー等の活動を行うに際し、貴少年団の会則を尊守するとともに、下記事項について一切の責任は　保護者が負うことを誓約します。';
  h+='</div>';

  h+='<div class="ki-mark">記</div>';
  h+='<ul class="pledge-list">';
  h+='<li>１、健康状態を常に把握し、安全確認の上参加させる。</li>';
  h+='<li>２、貴少年団活動中及び、会場と自宅との経路往復中の事故等、障害について貴少年団が指定するスポーツ安全保険の適用範囲外の　補償は、貴少年団に対して一切補償請求しない。</li>';
  h+='</ul>';
  h+='<div style="text-align:right;font-size:8.5pt;color:#444;margin:4px 0">以上</div>';

  h+='<div class="sign-area">';
  h+='<span class="stamp-circle">印</span>';
  h+='</div>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-top:4px">';
  h+='<span style="font-size:9pt;font-weight:700;white-space:nowrap">保護者名</span>';
  h+='<div class="sign-line">'+fv(pname,"")+'</div>';
  h+='</div>';

  h+='<div class="sheet-footer-note">※個人情報は入会後の活動管理のみに使用し、第三者へは提供いたしません。</div>';
  h+='</div>'; // sheet-body

  document.getElementById("print-sheet").innerHTML=h;
}

function clearForm(){
  if(!confirm("入力内容をすべてクリアしますか？"))return;
  ["f-year","f-month","f-day","f-pname","f-pkana","f-kana","f-name","f-by","f-bm","f-bd","f-addr","f-school","f-tel","f-mobile"].forEach(function(id){var e=document.getElementById(id);if(e)e.value="";});
  document.getElementById("f-grade").value="";
}
(function(){
  var now=new Date();
  document.getElementById("f-year").value=now.getFullYear();
  document.getElementById("f-month").value=now.getMonth()+1;
  document.getElementById("f-day").value=now.getDate();
})();
</script>
</body></html>
