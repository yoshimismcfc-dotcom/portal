<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入会申込書｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .page-tab-bar{display:flex;gap:0;margin-bottom:20px;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2)}
    .page-tab-btn{flex:1;padding:12px 8px;font:inherit;font-size:.88rem;font-weight:900;background:var(--surface-lt);color:#6aaccc;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
    .page-tab-btn:not(:last-child){border-right:1px solid var(--line-2)}
    .page-tab-btn.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .fst{font-size:.75rem;font-weight:900;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
    @media(max-width:480px){.fg2,.fg3{grid-template-columns:1fr}}
    #form-area{display:block}
    #preview-area{display:none}

    /* ===== 印刷設定 ===== */
    @page{size:A4 portrait;margin:0}
    @media print{
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body,html{background:#fff!important;margin:0;padding:0}
      .site-header,.back-btn,.hero-band,.page-tab-bar,.no-print,.site-footer,.panel,.notice-bar{display:none!important}
      .page-wrap{padding:0!important;max-width:100%!important;margin:0!important}
      #form-area{display:none!important}
      #preview-area{display:block!important;padding:0!important;margin:0!important}
      .psheet{
        width:210mm!important;height:297mm!important;
        padding:10mm 15mm 8mm!important;
        margin:0!important;box-shadow:none!important;border-radius:0!important;
        page-break-inside:avoid!important;overflow:hidden!important;
      }
    }

    /* ===== プレビュー用シート ===== */
    .psheet{
      background:#fff;color:#111;
      font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
      font-size:9.5pt;line-height:1.5;
      border-radius:12px;
      box-shadow:0 24px 64px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.08);
      padding:20px 28px 16px;
      max-width:680px;margin:0 auto;
      overflow:hidden;
    }

    /* --- ヘッダー --- */
    .ps-hd{
      text-align:center;
      border-bottom:3px double #000;
      padding-bottom:8px;margin-bottom:10px;
    }
    .ps-hd-title{font-size:14pt;font-weight:bold;letter-spacing:.1em;margin-bottom:0}
    .ps-hd-date{font-size:9pt;margin-top:3px}

    /* --- フィールド --- */
    .ps-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;font-size:9.5pt}
    .ps-label{font-size:9.5pt;font-weight:bold;white-space:nowrap;min-width:72px}
    .ps-val{
      border-bottom:1px solid #333;flex:1;
      min-height:19px;padding:0 3px 1px;
      font-size:10pt;
    }
    .ps-val.lg{font-size:12pt;font-weight:bold}
    .ps-sublabel{font-size:8.5pt;color:#444;margin-bottom:1px}
    .ps-uline{border-bottom:1px solid #333;display:block;min-height:19px;margin-bottom:3px;padding:0 3px 1px;font-size:10pt}
    .ps-uline.lg{font-size:12pt;font-weight:bold}
    .ps-stamp{
      width:28px;height:28px;border-radius:50%;border:1px solid #666;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:8pt;color:#888;flex-shrink:0;vertical-align:middle;
    }
    .ps-birth{display:flex;align-items:baseline;gap:4px;font-size:9.5pt;margin-bottom:4px}
    .ps-bval{border-bottom:1px solid #333;display:inline-block;min-height:18px;padding:0 2px;font-size:10pt}
    .ps-addr-row{margin-bottom:4px}
    .ps-school-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:9.5pt}

    /* --- 区切り --- */
    .ps-divider{border:none;border-top:2px solid #000;margin:8px 0 7px}

    /* --- 誓約書 --- */
    .ps-pledge-title{text-align:center;font-size:13pt;font-weight:bold;letter-spacing:.06em;text-decoration:underline;margin-bottom:4px}
    .ps-pledge-to{font-size:9.5pt;margin-bottom:3px}
    .ps-pledge-date{font-size:9.5pt;margin-bottom:4px}
    .ps-pledge-body{font-size:9pt;line-height:1.75;margin-bottom:4px}
    .ps-ki{text-align:center;font-size:9.5pt;font-weight:bold;letter-spacing:1em;margin:4px 0}
    .ps-pledge-list{list-style:none;padding:0;margin:0 0 4px}
    .ps-pledge-list li{font-size:9pt;line-height:1.8;padding-left:0}
    .ps-ijou{text-align:right;font-size:9pt;margin-bottom:3px}
    .ps-sign{display:flex;align-items:center;gap:8px;font-size:9.5pt;margin-top:3px}
    .ps-sign-line{border-bottom:1px solid #333;flex:1;min-height:19px;padding:0 3px;font-size:10pt;font-weight:bold}
    .ps-note{text-align:center;font-size:7.5pt;color:#888;margin-top:5px;border-top:1px solid #ddd;padding-top:4px}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">⚽</div>
    <div><div class="hero-title">入会申込書</div>
      <div class="hero-sub">入力後にプレビューを確認し、A4一枚で印刷できます。</div></div>
  </div>

  <!-- タブ -->
  <div class="page-tab-bar no-print">
    <button class="page-tab-btn active" id="btn-form"    onclick="showTab('form')">✏️ 入力フォーム</button>
    <button class="page-tab-btn"        id="btn-preview" onclick="showTab('preview')">👁 プレビュー</button>
    <button class="page-tab-btn"        id="btn-print"   onclick="doPrint()">🖨 印刷（A4）</button>
  </div>

  <!-- ===== 入力フォーム ===== -->
  <div id="form-area">
    <div class="panel">
      <div class="fst">📅 提出日</div>
      <div class="fg3">
        <div class="form-group"><label class="form-label">西暦（年）</label>
          <input class="form-control" id="fy" type="number" placeholder="2026" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">月</label>
          <input class="form-control" id="fm" type="number" min="1" max="12" placeholder="月" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">日</label>
          <input class="form-control" id="fd" type="number" min="1" max="31" placeholder="日" style="text-align:center"></div>
      </div>
    </div>
    <div class="panel">
      <div class="fst">👨‍👩‍👦 保護者</div>
      <div class="form-group"><label class="form-label">保護者名（漢字）</label>
        <input class="form-control" id="pname" placeholder="例：吉見　一郎"></div>
      <div class="form-group"><label class="form-label">保護者名（フリガナ）</label>
        <input class="form-control" id="pkana" placeholder="例：ヨシミ　イチロウ"></div>
    </div>
    <div class="panel">
      <div class="fst">🧒 入会者</div>
      <div class="form-group"><label class="form-label">入会者名（フリガナ）</label>
        <input class="form-control" id="kana" placeholder="例：ヨシミ　タロウ"></div>
      <div class="form-group"><label class="form-label">入会者名（漢字）</label>
        <input class="form-control" id="name" placeholder="例：吉見　太郎"></div>
      <div class="fst">生年月日（西暦）</div>
      <div class="fg3">
        <div class="form-group"><label class="form-label">年</label>
          <input class="form-control" id="by" type="number" placeholder="2018" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">月</label>
          <input class="form-control" id="bm" type="number" min="1" max="12" placeholder="月" style="text-align:center"></div>
        <div class="form-group"><label class="form-label">日</label>
          <input class="form-control" id="bd" type="number" min="1" max="31" placeholder="日" style="text-align:center"></div>
      </div>
    </div>
    <div class="panel">
      <div class="fst">📍 住所・学校・連絡先</div>
      <div class="form-group"><label class="form-label">住所（〒含む）</label>
        <input class="form-control" id="addr" placeholder="例：〒355-0124 埼玉県比企郡吉見町〇〇123"></div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">学校名</label>
          <input class="form-control" id="school" placeholder="例：吉見小学校"></div>
        <div class="form-group"><label class="form-label">学年</label>
          <select class="form-control" id="grade">
            <option value="">選択</option>
            <option>年長</option><option>1</option><option>2</option>
            <option>3</option><option>4</option><option>5</option><option>6</option>
          </select></div>
      </div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">電話番号</label>
          <input class="form-control" id="tel" type="tel" placeholder="例：0493-00-0000"></div>
        <div class="form-group"><label class="form-label">緊急連絡先（携帯）</label>
          <input class="form-control" id="mobile" type="tel" placeholder="例：090-1234-5678"></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" onclick="showTab('preview')" style="flex:1">👁 プレビューを確認する</button>
      <button class="btn btn-outline" onclick="clearForm()">🗑 クリア</button>
    </div>
  </div>

  <!-- ===== プレビュー ===== -->
  <div id="preview-area">
    <div class="panel no-print" style="margin-bottom:12px;padding:10px 14px">
      <p style="color:#a8d4f0;font-size:.84rem;margin:0">👇 内容を確認し「🖨 印刷（A4）」で印刷してください。A4一枚に収まります。</p>
    </div>
    <div class="psheet" id="psheet"></div>
  </div>
</main>
<footer class="site-footer no-print">YOSHIMI SMC FC — SMART PORTAL</footer>

<script>
function showTab(t){
  var fa=document.getElementById("form-area"),pa=document.getElementById("preview-area");
  var bf=document.getElementById("btn-form"),bp=document.getElementById("btn-preview"),bpr=document.getElementById("btn-print");
  [bf,bp,bpr].forEach(function(b){b.classList.remove("active");});
  if(t==="form"){fa.style.display="block";pa.style.display="none";bf.classList.add("active");}
  else if(t==="preview"){fa.style.display="none";pa.style.display="block";bp.classList.add("active");build();}
}
function doPrint(){build();document.getElementById("form-area").style.display="none";document.getElementById("preview-area").style.display="block";setTimeout(function(){window.print();},300);}
function g(id){var e=document.getElementById(id);return e?e.value.trim():"";}
function v(val){return val||"";}

function build(){
  var fy=g("fy")||"　　　　",fm=g("fm")||"　　",fd=g("fd")||"　　";
  var pname=g("pname"),pkana=g("pkana");
  var kana=g("kana"),name=g("name");
  var by=g("by")||"　　　　",bm=g("bm")||"　　",bd=g("bd")||"　　";
  var addr=g("addr"),school=g("school"),grade=g("grade");
  var tel=g("tel"),mobile=g("mobile");

  function uline(val,cls){
    return '<div class="ps-uline'+(cls?" "+cls:"")+'">'+(v(val))+'</div>';
  }

  var h="";

  /* ========== 申込書 ========== */
  h+='<div class="ps-hd">';
  h+='<div class="ps-hd-title">吉見　SMC　フットボールクラブ　入会申込書</div>';
  h+='<div class="ps-hd-date">西暦　'+fy+'　年　'+fm+'　月　'+fd+'　日</div>';
  h+='</div>';

  h+='<div style="font-size:9.5pt;margin-bottom:5px">吉見 SMC フットボールクラブ　に入会を希望致します。</div>';
  h+='<div class="ps-row" style="margin-bottom:6px"><span>西暦</span><span>'+fy+'</span><span>年</span><span>'+fm+'</span><span>月</span><span>'+fd+'</span><span>日（提出日）</span></div>';

  /* 保護者名 */
  h+='<div class="ps-label">保護者名</div>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">';
  h+='<div class="ps-uline lg" style="flex:1">'+v(pname)+'</div>';
  h+='<span class="ps-stamp">印</span>';
  h+='</div>';
  h+='<div class="ps-sublabel">（フリガナ）</div>';
  h+=uline(pkana);

  /* 入会者 */
  h+='<div class="ps-label" style="margin-top:3px">入会者</div>';
  h+='<div class="ps-sublabel">（フリガナ）</div>';
  h+=uline(kana);
  h+=uline(name,"lg");

  /* 生年月日 */
  h+='<div class="ps-sublabel">（西暦で記入）</div>';
  h+='<div class="ps-label">生年月日</div>';
  h+='<div class="ps-birth">';
  h+='<span class="ps-bval" style="min-width:70px">'+by+'</span>年';
  h+='<span class="ps-bval" style="min-width:40px">'+bm+'</span>月';
  h+='<span class="ps-bval" style="min-width:40px">'+bd+'</span>日';
  h+='</div>';

  /* 住所 */
  h+='<div class="ps-label">住所　〒</div>';
  h+=uline(addr);
  h+='<div style="border-bottom:1px solid #333;min-height:18px;margin-bottom:3px"></div>';

  /* 学校 */
  h+='<div class="ps-label">学校名・学年</div>';
  h+='<div class="ps-school-row">';
  h+='<div class="ps-uline" style="flex:1">'+v(school)+'</div>';
  h+='<div class="ps-uline" style="min-width:60px">'+v(grade)+(grade?"年生":"　　年生")+'</div>';
  h+='</div>';

  /* 電話 */
  h+='<div class="ps-label">電話番号</div>';
  h+=uline(tel);

  /* 緊急 */
  h+='<div class="ps-row">';
  h+='<span class="ps-label">緊急連絡先</span>';
  h+='<div class="ps-val">'+v(mobile)+'</div>';
  h+='<span style="font-size:8.5pt;color:#555;white-space:nowrap">（携帯）</span>';
  h+='</div>';
  h+='<div style="border-bottom:1px solid #333;min-height:16px;margin-bottom:4px"></div>';

  /* ========== 誓約書 ========== */
  h+='<hr class="ps-divider">';
  h+='<div class="ps-pledge-title">吉見　SMC フットボールクラブ　保護者誓約書</div>';
  h+='<div class="ps-pledge-to">吉見　SMC　フットボールクラブ　指導者　様</div>';
  h+='<div class="ps-pledge-date">西暦　'+fy+'　年　'+fm+'　月　'+fd+'　日（提出日）</div>';

  h+='<div class="ps-sublabel">（フリガナ）</div>';
  h+='<div class="ps-label">入会者</div>';
  h+=uline(name,"lg");

  h+='<div class="ps-pledge-body">上記の者が貴　少年団に入会しサッカー等の活動を行うに際し、貴少年団の会則を尊守するとともに、下記事項について一切の責任は　保護者が負うことを誓約します。</div>';

  h+='<div class="ps-ki">記</div>';
  h+='<ul class="ps-pledge-list">';
  h+='<li>１、健康状態を常に把握し、安全確認の上参加させる。</li>';
  h+='<li>２、貴少年団活動中及び、会場と自宅との経路往復中の事故等、障害について貴少年団が指定するスポーツ安全保険の適用範囲外の　補償は、貴少年団に対して一切補償請求しない。</li>';
  h+='</ul>';
  h+='<div class="ps-ijou">以上</div>';

  h+='<div style="display:flex;justify-content:flex-end;margin-bottom:3px"><span class="ps-stamp">印</span></div>';
  h+='<div class="ps-sign">';
  h+='<span class="ps-label">保護者名</span>';
  h+='<div class="ps-sign-line">'+v(pname)+'</div>';
  h+='</div>';
  h+='<div class="ps-note">※個人情報は入会後の活動管理のみに使用し、第三者へは提供いたしません。</div>';

  document.getElementById("psheet").innerHTML=h;
}

function clearForm(){
  if(!confirm("入力内容をすべてクリアしますか？"))return;
  ["fy","fm","fd","pname","pkana","kana","name","by","bm","bd","addr","school","tel","mobile"].forEach(function(id){
    var e=document.getElementById(id);if(e)e.value="";
  });
  document.getElementById("grade").value="";
}
(function(){
  var now=new Date();
  document.getElementById("fy").value=now.getFullYear();
  document.getElementById("fm").value=now.getMonth()+1;
  document.getElementById("fd").value=now.getDate();
})();
</script>
</body></html>
