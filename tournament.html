  var categoryItem=state&&state.sections.find(function(item){return item.standardKey==="category";});
  return {
    name:(entry&&entry.name)||data["y-title"]||data["t-title"]||"",
    dateIso:(entry&&entry.dateIso)||(dateItem&&dateItem.content)||data["y-date"]||data["t-date"]||"",
    dateLabel:(entry&&entry.dateLabel)||"",
    category:(entry&&entry.category)||(categoryItem&&categoryItem.content)||data["y-cat"]||""
  };
}
function renderLinkedTournamentDates(){
  var wrap = document.getElementById("linked-tournament-dates");
  var actions = document.getElementById("linked-active-actions");
  if(!wrap || !actions) return;
  var groups = {};
  Object.entries(_allSaves).forEach(function(pair){
    var item = pair[1];
    if(!item || !item.gameAdjustDateId) return;
    var id = item.gameAdjustDateId;
    if(!groups[id]) groups[id]={id:id,meta:linkedMetaFromEntry(item),youkou:false,taisen:false};
    groups[id][item.type] = true;
    var newer = linkedMetaFromEntry(item);
    Object.keys(newer).forEach(function(key){ if(newer[key]) groups[id].meta[key]=newer[key]; });
  });
  _gameAdjustDates.forEach(function(date){
    if(!date||!date.id) return;
    if(!groups[date.id]) groups[date.id]={id:date.id,meta:{},youkou:false,taisen:false};
    groups[date.id].meta=Object.assign({},groups[date.id].meta,{
      name:date.tournamentName||groups[date.id].meta.name||"",
      dateIso:date.dateIso||groups[date.id].meta.dateIso||"",
      dateLabel:date.label||groups[date.id].meta.dateLabel||"",
      category:date.cat||groups[date.id].meta.category||""
    });
  });
  if(_activeGameAdjustDateId && !groups[_activeGameAdjustDateId]){
    groups[_activeGameAdjustDateId]={id:_activeGameAdjustDateId,meta:_activeDateMeta,youkou:false,taisen:false};
  }
  var filter=document.getElementById("tournament-category-filter");
  var selectedCategory=filter?filter.value:"all";
  var list = Object.keys(groups).map(function(id){ return groups[id]; })
    .filter(function(group){return selectedCategory==="all"||group.meta.category===selectedCategory;})
    .sort(function(a,b){
      return window.SMCEventLinks
        ? SMCEventLinks.fiscalKey({dateIso:a.meta.dateIso})-SMCEventLinks.fiscalKey({dateIso:b.meta.dateIso})
        : (a.meta.dateIso||"9999").localeCompare(b.meta.dateIso||"9999");
    });
  if(!list.length){
    wrap.innerHTML='<div class="linked-empty">試合調整と連動した保存データはまだありません。</div>';
  } else {
    wrap.innerHTML=list.map(function(group){
      var title=group.meta.name||group.meta.dateLabel||group.meta.dateIso||"名称未設定";
      return '<button type="button" class="linked-date-item'+(String(group.id)===String(_activeGameAdjustDateId)?' active':'')+'" data-linked-date="'+esc3(group.id)+'">'
        +'<span><span class="linked-date-name">'+esc3(title)+'</span><span class="linked-date-meta">'+esc3(group.meta.dateIso||group.meta.dateLabel||"日付未設定")+(group.meta.category?'｜'+esc3(group.meta.category):'')+'</span></span>'
        +'<span class="linked-date-status">要綱 '+(group.youkou?'✅':'未保存')+'<br>対戦表 '+(group.taisen?'✅':'未保存')+'</span></button>';
    }).join("");
  }
  actions.innerHTML = _activeGameAdjustDateId
    ? '<a class="btn btn-outline btn-sm" href="game_adjust.html">← 試合調整へ戻る</a><button class="btn btn-outline btn-sm" type="button" onclick="clearLinkedDate()">全日程の一覧に戻る</button>'
    : '';
}
function selectLinkedDate(dateId){
  var entries = linkedEntries(dateId);
  var date = _gameAdjustDates.find(function(item){return String(item&&item.id||"")===String(dateId||"");});
  var meta = entries.length ? linkedMetaFromEntry(entries[0][1]) : {};
  if(date){
    meta=Object.assign({},meta,{
      name:date.tournamentName||meta.name||"",
      dateIso:date.dateIso||meta.dateIso||"",
      dateLabel:date.label||meta.dateLabel||"",
      category:date.cat||meta.category||""
    });
  }
  hydrateLinkedDate(dateId, meta);
}
function clearLinkedDate(){
  _activeGameAdjustDateId="";
  _activeDateMeta={dateIso:"",dateLabel:"",name:"",category:""};
  _loadedSaveVersions={youkou:"",taisen:""};
  _tournamentDirty={youkou:false,taisen:false};
  renderLinkedTournamentDates();
  updateTournamentContextLine();
  refreshCloudSaveStatus();
}
function hydrateLinkedDate(dateId, meta){
  _activeGameAdjustDateId=dateId||"";
  var requestedMeta=Object.assign({dateIso:"",dateLabel:"",name:"",category:""},meta||{});
  _activeDateMeta=Object.assign({},requestedMeta);
  var loadedPairs={youkou:null,taisen:null};
  _applyingSavedData=true;
  ["youkou","taisen"].forEach(function(type){
    var entries=linkedEntries(_activeGameAdjustDateId,type);
    if(entries.length){loadedPairs[type]=entries[0];applySaveEntry(entries[0][1]);}
    else copyTournamentTemplate(type,true);
  });
  // 試合調整から開いた場合は、親日程の最新名称・日付・カテゴリーを優先する。
  Object.keys(requestedMeta).forEach(function(key){
    if(requestedMeta[key]) _activeDateMeta[key]=requestedMeta[key];
  });
  if(requestedMeta.name){
    document.getElementById("y-title").value=requestedMeta.name;
    document.getElementById("t-title").value=requestedMeta.name;
  }
  if(requestedMeta.dateIso){
    var linkedDateItem=guidelineByKey("meta","date");
    if(linkedDateItem)linkedDateItem.content=requestedMeta.dateIso;
    document.getElementById("t-date").value=requestedMeta.dateIso;
  }
  if(requestedMeta.category){
    var linkedCategoryItem=guidelineByKey("section","category");
    if(linkedCategoryItem)linkedCategoryItem.content=requestedMeta.category;
  }
  renderGuidelineEditors();
  buildYoukou();
  // 保存済み対戦表がある場合は、保存したチーム・試合順を試合調整の初期値で上書きしない。
  if(!loadedPairs.taisen)syncGameAdjustTeamsToTournament(_activeGameAdjustDateId,{build:false});
  buildTaisen();
  _loadedSaveVersions.youkou=saveVersion(loadedPairs.youkou);
  _loadedSaveVersions.taisen=saveVersion(loadedPairs.taisen);
  _tournamentDirty={youkou:false,taisen:false};
  _applyingSavedData=false;
  renderLinkedTournamentDates();
  updateTournamentContextLine();
  refreshCloudSaveStatus();
  if(_activeGameAdjustDateId){
    if(focusRequestedTournamentView())return;
    switchDoc("youkou",document.getElementById("tbtn-y"));
    window.setTimeout(function(){
      var editor=document.querySelector("#doc-youkou .panel");
      if(editor) editor.scrollIntoView({behavior:"smooth",block:"start"});
    },180);
  }
}

// 保存モーダルを開く
function openSaveModal(type){
  _saveType = type;
  document.getElementById("save-modal-title").textContent = type==="youkou"?"☁️ 大会要項をクラウドに保存":"☁️ 対戦表をクラウドに保存";
  var titleField = type==="youkou" ? document.getElementById("y-title") : document.getElementById("t-title");
  document.getElementById("save-name-input").value = (titleField ? titleField.value : "") || "";
  document.getElementById("cloud-save-modal-status").textContent="";
  var saveButton=document.getElementById("cloud-save-confirm");if(saveButton){saveButton.disabled=false;saveButton.textContent="☁️ 保存する";}
  document.getElementById("modal-save").classList.add("open");
  setTimeout(function(){ document.getElementById("save-name-input").focus(); }, 100);
}
function closeSaveModal(){ document.getElementById("modal-save").classList.remove("open"); }

// 保存実行
function execSave(){
  var name = document.getElementById("save-name-input").value.trim();
  if(!name){ alert("保存名を入力してください"); return; }
  var saveButton=document.getElementById("cloud-save-confirm"),modalStatus=document.getElementById("cloud-save-modal-status");
  if(saveButton&&saveButton.disabled)return;
  if(saveButton){saveButton.disabled=true;saveButton.textContent="保存しています…";}
  if(modalStatus)modalStatus.textContent="クラウドへ保存しています。画面を閉じずにお待ちください。";
  setCloudSaveStatus("loading","クラウドへ保存しています…",false);
  var savedAt=new Date().toISOString();
  if(_saveType==="youkou"){
    ["meta","sections"].forEach(function(key){
      _guidelineState[key].forEach(function(item,index){item.order=index;if(!item.updatedAt)item.updatedAt=savedAt;});
    });
  }
  var fields = _saveType==="youkou" ? YOUKOU_FIELDS : TAISEN_FIELDS;
  var guidelineDate=guidelineStandardContent("meta","date");
  var guidelineCategory=guidelineStandardContent("section","category");
  var entry = {
    name: name,
    type: _saveType,
    savedAt: savedAt,
    gameAdjustDateId: _activeGameAdjustDateId || "",
    dateIso: _activeDateMeta.dateIso || (_saveType==="youkou"?guidelineDate:gv("t-date")) || "",
    dateLabel: _activeDateMeta.dateLabel || "",
    category: _activeDateMeta.category || (_saveType==="youkou"?guidelineCategory:"") || "",
    data: collectFields(fields)
  };
  if(_saveType==="youkou"){
    entry.guidelineSchemaVersion=SMCGuidelines.SCHEMA_VERSION;
    entry.guidelineMeta=SMCGuidelines.clone(_guidelineState.meta);
    entry.guidelineSections=SMCGuidelines.clone(_guidelineState.sections);
  }
  // チーム数やチーム名も保存（対戦表）
  if(_saveType==="taisen"){
    entry.data.teams=JSON.stringify(captureTeamValues());
    if(_lastTournamentSchedule)entry.data.optimizedSchedule=JSON.stringify(_lastTournamentSchedule);
    entry.data.matchResults=JSON.stringify(_matchResults);
  }
  var linkedExisting = _activeGameAdjustDateId
    ? linkedEntries(_activeGameAdjustDateId,_saveType)[0]
    : null;
  var id = linkedExisting ? linkedExisting[0] : "sv_" + Date.now();
  _allSaves[id] = entry;
  localStorage.setItem(SAVE_KEY, JSON.stringify(_allSaves));
  dbSave("tournament_saves", _allSaves, SAVE_KEY, function(result){
    _loadedSaveVersions[_saveType]=String(id)+"|"+String(entry.savedAt||"");
    _tournamentDirty[_saveType]=false;
    closeSaveModal();
    renderLinkedTournamentDates();
    setCloudSaveStatus("saved","クラウドに保存しました。他の端末にも最新内容が反映されます。",false);
  },function(error){
    if(saveButton){saveButton.disabled=false;saveButton.textContent="もう一度保存する";}
    if(modalStatus)modalStatus.textContent="クラウドに保存できませんでした。通信状況を確認して、もう一度お試しください。端末内には一時保存されています。";
    setCloudSaveStatus("error","クラウドに保存できませんでした。通信状況を確認して、もう一度保存してください。",false);
  });
}

// 読込モーダルを開く
function openLoadModal(type){
  _saveType = type;
  document.getElementById("load-modal-title").textContent = type==="youkou"?"📂 保存済み要綱":"📂 保存済み対戦表";
  renderSavedList(type);
  document.getElementById("modal-load").classList.add("open");
}
function closeLoadModal(){ document.getElementById("modal-load").classList.remove("open"); }

function renderSavedList(type){
  var items = Object.entries(_allSaves)
    .filter(function(e){
      return e[1].type===type && (!_activeGameAdjustDateId || e[1].gameAdjustDateId===_activeGameAdjustDateId);
    })
    .sort(function(a,b){ return (b[1].savedAt||"").localeCompare(a[1].savedAt||""); });
  var wrap = document.getElementById("saved-list");
  if(!items.length){
    wrap.innerHTML = "<p style=\"color:var(--ink-3);text-align:center;padding:20px;font-size:.84rem\">保存されたデータがありません。</p>";
    return;
  }
  var html2 = "";
  items.forEach(function(e){
    var id=e[0], item=e[1];
    var dateStr = item.savedAt ? new Date(item.savedAt).toLocaleString("ja-JP") : "";
    html2 += "<div class=\"saved-item\">";
    html2 += "<div class=\"saved-item-info\" role=\"button\" tabindex=\"0\" data-save-action=\"load\" data-id=\"" + esc3(id) + "\">";
    html2 += "<div class=\"saved-item-name\">" + esc2(item.name) + "</div>";
    html2 += "<div class=\"saved-item-meta\">" + esc2(dateStr) + "</div>";
    html2 += "</div>";
    html2 += "<button class=\"saved-item-del\" data-save-action=\"delete\" data-id=\"" + esc3(id) + "\">🗑</button>";
    html2 += "</div>";
  });
  wrap.innerHTML = html2;
}

function esc2(s){ return escapeHtml(s); }

document.getElementById("saved-list").addEventListener("click",function(event){
  var target=event.target.closest("[data-save-action]");
  if(!target)return;
  if(target.dataset.saveAction==="load")loadSave(target.dataset.id);
  if(target.dataset.saveAction==="delete")deleteSave(target.dataset.id);
});
document.getElementById("linked-tournament-dates").addEventListener("click",function(event){
  var target=event.target.closest("[data-linked-date]");
  if(target) selectLinkedDate(target.dataset.linkedDate);
});
document.getElementById("saved-list").addEventListener("keydown",function(event){
  if(event.key!=="Enter"&&event.key!==" ")return;
  var target=event.target.closest('[data-save-action="load"]');
  if(!target)return;
  event.preventDefault();
  loadSave(target.dataset.id);
});

["doc-youkou","doc-taisen"].forEach(function(sectionId){
  var section=document.getElementById(sectionId);if(!section)return;
  ["input","change"].forEach(function(eventName){
    section.addEventListener(eventName,function(event){
      if(event.target&&event.target.classList&&event.target.classList.contains("score-input"))return;
      markTournamentDirty(sectionId==="doc-youkou"?"youkou":"taisen");
    });
  });
});

// データ読込
function applySaveEntry(item){
  if(!item) return;
  var entryData=item.data||{};
  applyFields(entryData);
  if(item.gameAdjustDateId){
    _activeGameAdjustDateId=item.gameAdjustDateId;
    _activeDateMeta=linkedMetaFromEntry(item);
  }
  if(item.type==="taisen" && !Object.prototype.hasOwnProperty.call(item.data||{},"closing-enable")){
    document.getElementById("closing-enable").checked=true;
    toggleCeremonies();
  }
  if(item.type==="taisen"){
    _resultContextKey=tournamentResultSetKey();
    var cloudSet=_allTournamentResults[_resultContextKey];
    try{_matchResults=item.data&&item.data.matchResults?JSON.parse(item.data.matchResults):(cloudSet&&cloudSet.results?JSON.parse(JSON.stringify(cloudSet.results)):{});}catch(resultError){_matchResults={};}
  }
  if(item.type==="taisen" && item.data && item.data.teams){
    try{ applyTeamValues(JSON.parse(item.data.teams)); }catch(e){}
    try{
      _lastTournamentSchedule=item.data.optimizedSchedule?JSON.parse(item.data.optimizedSchedule):null;
    }catch(error){_lastTournamentSchedule=null;}
  }
  if(item.type==="youkou"){
    var savedState=savedGuidelineState(item);
    _guidelineState=savedState||SMCGuidelines.createState(null,entryData);
    // 旧版の自由追加欄も本文項目へ変換し、内容を失わず移行する。
    if(!savedState&&Array.isArray(item.customRows)){
      item.customRows.forEach(function(row){
        if(!row||!(String(row.label||"").trim()||String(row.val||"").trim()))return;
        _guidelineState.sections.push({
          id:row.id||SMCGuidelines.makeId("legacy"),standardKey:"",title:String(row.label||"項目"),
          content:String(row.val||""),visible:true,type:"custom",order:_guidelineState.sections.length,
          updatedAt:item.savedAt||""
        });
      });
      _guidelineState.sections=SMCGuidelines.normalizeList(_guidelineState.sections,"section");
    }
    renderGuidelineEditors();
  }
  if(item.type==="youkou") buildYoukou();
  else buildTaisen();
}
function loadSave(id){
  var item = _allSaves[id];
  if(!item){ alert("データが見つかりません"); return; }
  if(!confirm("「"+item.name+"」を読み込みますか？現在の入力内容は上書きされます。")) return;
  applySaveEntry(item);
  closeLoadModal();
  renderLinkedTournamentDates();
  alert("「"+item.name+"」を読み込みました！");
}

// 削除
function deleteSave(id){
  var item = _allSaves[id];
  if(!item||!confirm("「"+item.name+"」を削除しますか？")) return;
  delete _allSaves[id];
  localStorage.setItem(SAVE_KEY, JSON.stringify(_allSaves));
  dbSave("tournament_saves", _allSaves, SAVE_KEY, null);
  renderSavedList(_saveType);
}
</script>
<script id="tournament-game-adjust-index">
(function(){
  "use strict";
  function updateTournamentCategories(){
    var filter=document.getElementById("tournament-category-filter");
    if(!filter)return;
    var selected=filter.value||"all";
    var categories=Array.from(new Set(_gameAdjustDates.map(function(d){return String(d.cat||"").trim();}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,"ja");});
    filter.innerHTML='<option value="all">すべてのカテゴリー</option>'+categories.map(function(cat){return '<option value="'+esc3(cat)+'">'+esc3(cat)+'</option>';}).join("");
    filter.value=categories.includes(selected)?selected:"all";
  }
  var filter=document.getElementById("tournament-category-filter");
  if(filter)filter.addEventListener("change",renderLinkedTournamentDates);
  dbListen("game_adjust",function(value){
    _gameAdjustRaw=value&&typeof value==="object"?value:null;
    var normalizedGameAdjust=value&&typeof value==="object"?Object.assign({},value,{dates:gameAdjustArray(value.dates),teams:gameAdjustArray(value.teams)}):value;
    _gameAdjustDates=SMCEventLinks.fromGameAdjust(normalizedGameAdjust);
    updateTournamentCategories();
    renderLinkedTournamentDates();
    // 保存済み対戦表は別端末でもそのまま表示し、試合調整の初期値で上書きしない。
    if(_activeGameAdjustDateId&&!latestLinkedPair("taisen"))syncGameAdjustTeamsToTournament(_activeGameAdjustDateId,{build:true});
  },"smc_game_adj_v1",null);
})();
</script>
