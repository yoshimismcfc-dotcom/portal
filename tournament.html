<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大会要綱・対戦表｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .doc-tab-bar{display:flex;gap:0;margin-bottom:20px;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2)}
    .doc-tab-btn{flex:1;padding:11px 8px;font:inherit;font-size:.85rem;font-weight:900;background:var(--surface-lt);color:#6aaccc;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
    .doc-tab-btn:not(:last-child){border-right:1px solid var(--line-2)}
    .doc-tab-btn.active{background:linear-gradient(135deg,#003087,#0050cc);color:#fff}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .sec{font-size:.72rem;font-weight:900;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
    .doc-section{display:none}.doc-section.active{display:block}

    /* === 印刷 === */
    @page{size:A4 portrait;margin:12mm 14mm}
    @media print{
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body,html{background:#fff!important;font-family:"Yu Mincho","Hiragino Mincho ProN",serif!important}
      .site-header,.back-btn,.hero-band,.doc-tab-bar,.no-print,.site-footer,.panel,.notice-bar{display:none!important}
      .page-wrap{padding:0!important;max-width:100%!important;margin:0!important}
      .doc-section{display:block!important}
      .print-sheet{box-shadow:none!important;border-radius:0!important;padding:0!important;max-width:100%!important;background:#fff!important;color:#000!important}
      .schedule-table th,.schedule-table td{font-size:8.5pt!important}
      .rank-table th,.rank-table td{font-size:8.5pt!important}
    }

    /* 要綱プレビュー */
    .print-sheet{background:#fff;color:#111;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:22px 26px;max-width:700px;margin:0 auto;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:10pt;line-height:1.6}
    .req-title{text-align:center;font-size:15pt;font-weight:bold;margin-bottom:12px;letter-spacing:.06em}
    .req-table{width:100%;border-collapse:collapse;margin-bottom:12px}
    .req-table th,.req-table td{border:1px solid #888;padding:5px 8px;font-size:9.5pt}
    .req-table th{background:#eef2fa;font-weight:bold;white-space:nowrap;min-width:60px}
    .req-section{margin-bottom:8px}
    .req-section-title{font-weight:bold;font-size:10pt;margin-bottom:3px}
    .req-list{margin:0;padding-left:1em;font-size:9.5pt;line-height:1.8}
    .req-divider{border:none;border-top:1px solid #ccc;margin:8px 0}

    /* 対戦表プレビュー */
    .schedule-table{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:14px}
    .schedule-table th,.schedule-table td{border:1px solid #888;padding:5px 7px;text-align:center;vertical-align:middle}
    .schedule-table th{background:#003087;color:#fff;font-weight:bold;font-size:8.5pt}
    .schedule-table .score-cell{background:#fff9e6;min-width:36px}
    .schedule-table .home-cell{text-align:left;padding-left:8px}
    .schedule-table .away-cell{text-align:right;padding-right:8px}
    .rank-table{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:10px}
    .rank-table th,.rank-table td{border:1px solid #888;padding:5px 7px;text-align:center}
    .rank-table th{background:#1a5c1a;color:#fff;font-size:8.5pt;font-weight:bold}
    .block-title{font-size:11pt;font-weight:bold;margin:10px 0 5px;color:#003087;border-left:4px solid #003087;padding-left:8px}
    .team-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.75rem;background:rgba(0,48,135,.12);border:1px solid rgba(0,48,135,.3);color:#fff;margin:2px}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div><span class="logo-name">吉見SMC FC</span><span class="logo-sub">SMART PORTAL</span></div>
    </a>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="coach.html">コーチ専用に戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📋</div>
    <div><div class="hero-title">大会要綱・対戦表</div>
      <div class="hero-sub">入力するとプレビューが表示され、印刷（A4）できます。</div></div>
  </div>

  <div class="doc-tab-bar no-print">
    <button class="doc-tab-btn active" onclick="switchDoc('youkou')">📄 大会要綱</button>
    <button class="doc-tab-btn"        onclick="switchDoc('taisen')">📊 対戦表</button>
  </div>

  <!-- ===== 大会要綱 ===== -->
  <div class="doc-section active" id="doc-youkou">
    <div class="panel no-print">
      <div class="sec">基本情報</div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">大会名</label><input class="form-control" id="y-title" value="U9 吉見SMC大会" placeholder="例：U9 吉見SMC大会"></div>
        <div class="form-group"><label class="form-label">カテゴリー</label><input class="form-control" id="y-cat" value="U9（3年生以下※4年生女子も参加可）" placeholder="例：U9（3年生以下）"></div>
      </div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">期日</label><input class="form-control" id="y-date" type="date"></div>
        <div class="form-group"><label class="form-label">場所</label><input class="form-control" id="y-place" value="吉見ふれあい広場 天然芝グラウンド"></div>
      </div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">受付</label><input class="form-control" id="y-uketsuke" value="8:00より受付（参加費徴収）"></div>
        <div class="form-group"><label class="form-label">主催</label><input class="form-control" id="y-host" value="吉見SMC"></div>
      </div>

      <div class="sec">試合方法・ルール</div>
      <div class="fg3">
        <div class="form-group"><label class="form-label">競技形式</label><input class="form-control" id="y-format" value="8人制"></div>
        <div class="form-group"><label class="form-label">試合時間</label><input class="form-control" id="y-time" value="15分ハーフ（15-5-15分）"></div>
        <div class="form-group"><label class="form-label">最少人数</label><input class="form-control" id="y-minp" value="6名以上"></div>
      </div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">参加費</label><input class="form-control" id="y-fee" value="1チーム5,000円"></div>
        <div class="form-group"><label class="form-label">表彰</label><input class="form-control" id="y-award" value="1〜3位にトロフィー・優秀選手賞：各チーム1名"></div>
      </div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">選手交代</label><input class="form-control" id="y-sub" value="自由（再出場可）"></div>
        <div class="form-group"><label class="form-label">審判</label><input class="form-control" id="y-ref" value="当該チームで相談（1審・2審・3審）"></div>
      </div>
      <div class="form-group"><label class="form-label">順位決定方法</label><input class="form-control" id="y-rank" value="勝3点・分1点・負0点 → 勝点→得失点差→総得点→当該対戦→抽選"></div>
      <div class="form-group"><label class="form-label">雨天時</label><input class="form-control" id="y-rain" value="当日AM6:00頃に実施可否を判断し各チームへ連絡します。"></div>

      <div class="sec">お問い合わせ</div>
      <div class="fg2">
        <div class="form-group"><label class="form-label">代表者名</label><input class="form-control" id="y-rep" value="吉見SMC代表 片山孝俊"></div>
        <div class="form-group"><label class="form-label">電話・メール</label><input class="form-control" id="y-contact" value="090-3595-1970 / yoshimi.smc.fc@gmail.com"></div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
        <button class="btn btn-primary" onclick="buildYoukou()" style="flex:1">👁 要綱プレビューを表示</button>
        <button class="btn btn-outline btn-sm" onclick="printDoc()">🖨 印刷（A4）</button>
      </div>
    </div>

    <!-- 要綱プレビュー -->
    <div class="print-sheet" id="youkou-preview" style="display:none;margin-top:14px"></div>
  </div>

  <!-- ===== 対戦表 ===== -->
  <div class="doc-section" id="doc-taisen">
    <div class="panel no-print">
      <div class="sec">大会設定</div>
      <div class="fg3">
        <div class="form-group"><label class="form-label">大会名</label><input class="form-control" id="t-title" value="U9 吉見SMC大会"></div>
        <div class="form-group"><label class="form-label">期日</label><input class="form-control" id="t-date" type="date"></div>
        <div class="form-group"><label class="form-label">場所</label><input class="form-control" id="t-place" value="吉見ふれあい広場"></div>
      </div>
      <div class="fg3">
        <div class="form-group"><label class="form-label">コート面数</label>
          <select class="form-control" id="t-courts" onchange="updateTeamInputs()">
            <option value="1">1面</option><option value="2" selected>2面（A・B面）</option>
          </select></div>
        <div class="form-group"><label class="form-label">試合開始時刻</label><input class="form-control" id="t-starttime" value="08:30"></div>
        <div class="form-group"><label class="form-label">1試合あたりの時間（分）</label><input class="form-control" id="t-gametime" type="number" value="40" min="20" max="90"></div>
      </div>

      <div class="sec">チーム設定</div>
      <div id="team-inputs"></div>

      <button class="btn btn-primary" onclick="buildTaisen()" style="width:100%;margin-top:10px">📊 対戦表を生成する</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-outline btn-sm no-print" onclick="printDoc()" style="flex:1">🖨 印刷（A4）</button>
      </div>
    </div>

    <!-- 対戦表プレビュー -->
    <div id="taisen-preview" style="margin-top:14px"></div>
  </div>

</main>
<footer class="site-footer no-print">YOSHIMI SMC FC — SMART PORTAL</footer>
<script>
/* ===== タブ切り替え ===== */
function switchDoc(id){
  document.querySelectorAll(".doc-section").forEach(function(s){s.classList.remove("active");});
  document.querySelectorAll(".doc-tab-btn").forEach(function(b){b.classList.remove("active");});
  document.getElementById("doc-"+id).classList.add("active");
  event.currentTarget.classList.add("active");
}

/* ===== 要綱 ===== */
function gv(id){var e=document.getElementById(id);return e?e.value.trim():"";}

function buildYoukou(){
  var title=gv("y-title"),date=gv("y-date"),place=gv("y-place");
  var dateStr=date?new Date(date+"T00:00:00").toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}):("　　　　年　月　日");
  var h="";
  h+='<div class="req-title">'+title+'　大会要項</div>';
  h+='<table class="req-table"><tbody>';
  h+='<tr><th>期日</th><td>'+dateStr+'</td><th>場所</th><td>'+gv("y-place")+'</td></tr>';
  h+='<tr><th>受付</th><td>'+gv("y-uketsuke")+'</td><th>主催</th><td>'+gv("y-host")+'</td></tr>';
  h+='</tbody></table>';
  h+='<div style="font-weight:bold;font-size:10.5pt;margin-bottom:6px">開催要項</div>';
  h+='<div class="req-section"><div class="req-section-title">１）目的</div><ul class="req-list"><li>試合を通して少年少女サッカーの普及を目指します。</li><li>チーム間の友好と親善を図り、サッカーの楽しさを知ってもらいます。</li><li>試合経験を通して、選手相互の技術向上を図ります。</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">２）対象学年</div><ul class="req-list"><li>'+gv("y-cat")+'</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">３）試合方法</div><ul class="req-list"><li>'+gv("y-format")+'で実施します。試合成立人数は'+gv("y-minp")+'。</li><li>競技時間は'+gv("y-time")+'を基本とします。</li><li>暑熱時は、飲水タイム（ランニング）を設けてください。</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">４）選手交代</div><ul class="req-list"><li>選手交代は'+gv("y-sub")+'とします。できるだけ多くの選手が出場できるようご配慮ください。</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">５）ルール</div><ul class="req-list"><li>日本サッカー協会8人制競技規則に準じます。</li><li>順位決定方法：'+gv("y-rank")+'</li><li>ユニフォームは正副いずれかを用意。ビブス対応可。</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">６）審判</div><ul class="req-list"><li>'+gv("y-ref")+'して決めてください。審判服の着用をお願いします。</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">７）参加費</div><ul class="req-list"><li>'+gv("y-fee")+'・受付にて集金します。</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">８）表彰</div><ul class="req-list"><li>'+gv("y-award")+'</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">９）注意事項</div><ul class="req-list"><li>代表者会議を8:00より行いますので本部に集合してください。</li><li>熱中症・感染症には十分に気をつけてください。対応は各チームでお願いします。</li><li>会場周辺での路上駐車は一切行わないよう、チーム単位で周知徹底をお願いします。</li><li>ゴミは各チームで持ち帰りをお願いします。</li></ul></div>';
  h+='<div class="req-section"><div class="req-section-title">10）雨天時</div><ul class="req-list"><li>'+gv("y-rain")+'</li></ul></div>';
  h+='<hr class="req-divider">';
  h+='<div style="font-weight:bold;font-size:10pt;margin-bottom:4px">お問い合わせ</div>';
  h+='<table class="req-table"><tbody>';
  h+='<tr><th>代表</th><td>'+gv("y-rep")+'</td></tr>';
  h+='<tr><th>電話・メール</th><td>'+gv("y-contact")+'</td></tr>';
  h+='</tbody></table>';
  var pv=document.getElementById("youkou-preview");
  pv.innerHTML=h;pv.style.display="block";
  pv.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ===== 対戦表 ===== */
function updateTeamInputs(){
  var courts=+gv("t-courts");
  var html="";
  for(var c=0;c<courts;c++){
    var label=courts===1?"チーム":["Aブロック","Bブロック"][c];
    html+='<div style="margin-bottom:14px">';
    html+='<div style="font-size:.82rem;font-weight:900;color:var(--cyan);margin-bottom:8px">'+label+'（チーム数・チーム名）</div>';
    html+='<div class="form-group"><label class="form-label">チーム数</label>';
    html+='<select class="form-control" id="t-count-'+c+'" onchange="updateTeamNames('+c+')">';
    for(var n=2;n<=8;n++)html+='<option value="'+n+'"'+(n===4?" selected":"")+'>'+n+'チーム</option>';
    html+='</select></div>';
    html+='<div id="t-names-'+c+'" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"></div>';
    html+='</div>';
  }
  document.getElementById("team-inputs").innerHTML=html;
  for(var c2=0;c2<courts;c2++)updateTeamNames(c2);
}

function updateTeamNames(c){
  var n=+document.getElementById("t-count-"+c).value;
  var defaults=[["吉見A","川里","滑川","A4","","","",""],["吉見B","鴻巣ドルフィンズ","川島","本庄ホッパーズ","","","",""]];
  var defs=defaults[c]||[];
  var html="";
  for(var i=0;i<n;i++){
    html+='<div class="form-group" style="margin:0"><label class="form-label">チーム'+(i+1)+'</label>';
    html+='<input class="form-control" id="t-team-'+c+'-'+i+'" value="'+(defs[i]||"")+'" placeholder="チーム名"></div>';
  }
  document.getElementById("t-names-"+c).innerHTML=html;
}

function addMins(timeStr,mins){
  var p=timeStr.split(":");var h=+p[0],m=+p[1];m+=mins;h+=Math.floor(m/60);m=m%60;
  return String(h%24).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

function buildTaisen(){
  var courts=+gv("t-courts");
  var gameMin=+gv("t-gametime")||40;
  var startTime=gv("t-starttime")||"08:30";
  var title=gv("t-title"),dateVal=gv("t-date"),place=gv("t-place");
  var dateStr=dateVal?new Date(dateVal+"T00:00:00").toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}):("　　　　年　月　日");

  var blocks=[];
  for(var c=0;c<courts;c++){
    var n=+document.getElementById("t-count-"+c).value;
    var teams=[];
    for(var i=0;i<n;i++){
      var el=document.getElementById("t-team-"+c+"-"+i);
      teams.push(el?el.value.trim()||("チーム"+(i+1)):("チーム"+(i+1)));
    }
    // 総当たり組み合わせ生成
    var matches=[];
    for(var a=0;a<teams.length;a++)for(var b=a+1;b<teams.length;b++)matches.push([a,b]);
    blocks.push({label:courts===1?"":["Aブロック","Bブロック"][c],teams:teams,matches:matches});
  }

  // スケジュール（A・B交互）
  var schedItems=[];
  var maxM=Math.max.apply(null,blocks.map(function(b){return b.matches.length;}));
  var curTime=startTime;
  for(var mi=0;mi<maxM;mi++){
    for(var ci=0;ci<blocks.length;ci++){
      if(mi<blocks[ci].matches.length){
        var m=blocks[ci].matches[mi];
        schedItems.push({court:ci,blockIdx:ci,matchIdx:mi,home:blocks[ci].teams[m[0]],away:blocks[ci].teams[m[1]],time:curTime,cat:(courts===1?"予選":["Aブロック","Bブロック"][ci])});
      }
    }
    curTime=addMins(curTime,gameMin);
    // 1セット（両コート1試合）終わったら時間進める（1コートの場合は1試合ごと）
    if(courts===1&&mi<maxM-1){}
  }

  // 順位戦スケジュール
  var restTime=curTime;
  var finalStart=addMins(restTime,10);
  var finals=[];
  if(courts===2){
    finals=[
      {label:"4位同士",home:"A4位",away:"B4位",time:finalStart},
      {label:"3位同士",home:"A3位",away:"B3位",time:finalStart},
    ];
    var sf=addMins(finalStart,gameMin);
    finals.push({label:"2位同士",home:"A2位",away:"B2位",time:sf});
    finals.push({label:"1位同士",home:"A1位",away:"B1位",time:sf});
  }

  /* HTML生成 */
  var h='<div class="print-sheet">';
  h+='<div class="req-title">'+title+'　対戦表</div>';
  h+='<div style="text-align:center;font-size:9pt;color:#555;margin-bottom:10px">'+dateStr+'　'+place+'</div>';

  /* スケジュール表 */
  h+='<div class="block-title">試合スケジュール</div>';
  h+='<table class="schedule-table"><thead><tr><th>No</th><th>時刻</th><th>区分</th><th>ホーム</th><th>得</th><th>-</th><th>得</th><th>アウェイ</th><th>備考</th></tr></thead><tbody>';
  var no=1;
  schedItems.forEach(function(s){
    h+='<tr><td>'+no+'</td><td>'+s.time+'</td><td>'+s.cat+'</td>';
    h+='<td class="home-cell">'+s.home+'</td>';
    h+='<td class="score-cell"></td><td style="background:#f5f5f5">－</td><td class="score-cell"></td>';
    h+='<td class="away-cell">'+s.away+'</td><td></td></tr>';
    no++;
  });
  if(finals.length){
    h+='<tr><td colspan="9" style="background:#eef2fa;font-weight:bold;text-align:center">休憩</td></tr>';
    finals.forEach(function(f){
      h+='<tr><td>'+no+'</td><td>'+f.time+'</td><td>順位戦</td>';
      h+='<td class="home-cell">'+f.home+'</td>';
      h+='<td class="score-cell"></td><td style="background:#f5f5f5">－</td><td class="score-cell"></td>';
      h+='<td class="away-cell">'+f.away+'</td><td>'+f.label+'</td></tr>';
      no++;
    });
  }
  h+='<tr><td colspan="9" style="background:#eef2fa;font-weight:bold;text-align:center">閉会式</td></tr>';
  h+='</tbody></table>';

  /* ブロック別順位表＋総当り表 */
  blocks.forEach(function(blk){
    h+='<div class="block-title">'+(blk.label||"チーム")+'順位表</div>';
    h+='<table class="rank-table"><thead><tr><th>順位</th><th>チーム名</th><th>試合</th><th>勝</th><th>分</th><th>負</th><th>得点</th><th>失点</th><th>得失差</th><th>勝点</th></tr></thead><tbody>';
    blk.teams.forEach(function(t){
      h+='<tr><td>1</td><td style="text-align:left;padding-left:6px">'+t+'</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>';
    });
    h+='</tbody></table>';

    /* 総当り表 */
    h+='<div style="font-size:9pt;font-weight:bold;margin:6px 0 4px">'+(blk.label||"")+'総当り票</div>';
    h+='<table class="schedule-table"><thead><tr><th></th>';
    blk.teams.forEach(function(t){h+='<th>'+t+'</th>';});
    h+='</tr></thead><tbody>';
    blk.teams.forEach(function(t1,i){
      h+='<tr><td style="font-weight:bold;text-align:left;padding-left:6px">'+t1+'</td>';
      blk.teams.forEach(function(t2,j){
        if(i===j)h+='<td style="background:#e0e0e0">－</td>';
        else h+='<td class="score-cell"></td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table>';
  });

  h+='<div style="font-size:7.5pt;color:#888;margin-top:8px;text-align:right">※ 得点欄に記入すると各チームの集計が確認できます</div>';
  h+='</div>';

  var pv=document.getElementById("taisen-preview");
  pv.innerHTML=h;
  pv.scrollIntoView({behavior:"smooth",block:"start"});
}

function printDoc(){window.print();}

</script>
