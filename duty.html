<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>当番表｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .duty-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
    .duty-table-wrap{overflow-x:auto}
    .duty-table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:460px}
    .duty-table th,.duty-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
    .duty-table th{background:rgba(255,255,255,.04);font-size:.75rem;font-weight:900;color:var(--ink-muted);white-space:nowrap}
    .duty-table tbody tr:hover{background:rgba(255,255,255,.03)}
    .del-btn{background:none;border:none;color:var(--ink-muted);font-size:1rem;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;transition:.15s}
    .del-btn:hover{color:var(--red);background:var(--red-lt)}
    .grade-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.72rem;font-weight:900;background:rgba(255,107,43,.2);color:var(--orange);border:1px solid rgba(255,107,43,.3)}
    .empty-msg{text-align:center;color:var(--ink-muted);padding:28px;font-size:.85rem}
    @media(max-width:600px){.duty-row{grid-template-columns:1fr 1fr}.duty-row .btn{grid-column:1/-1}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html"><div class="logo-mark">⚽</div>
      <div><span>吉見SMC FC</span><span class="logo-sub">スマートポータル</span></div></a>
    <nav class="header-nav">
      <a href="index.html">ホーム</a><a href="heat.html">熱中症</a>
      <a href="calendar.html">予定</a><a href="coach.html">コーチ専用</a>
    </nav>
  </div>
</header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📋</div>
    <div><div class="hero-title">当番表</div>
      <div class="hero-sub">誰でも入力・削除できます。データはこの端末に保存されます。</div></div>
  </div>
  <div class="notice-bar">💾 データはこのブラウザ（端末）に保存されます。別の端末からは見えません。</div>

  <div class="panel">
    <div class="panel-title">当番を追加</div>
    <div class="duty-row">
      <div class="form-group" style="margin:0"><label class="form-label">日付</label>
        <input class="form-control" type="date" id="duty-date"></div>
      <div class="form-group" style="margin:0"><label class="form-label">学年</label>
        <select class="form-control" id="duty-grade">
          <option>1年</option><option>2年</option><option>3年</option><option>4年</option>
          <option>5年</option><option>6年</option><option>全学年</option>
        </select></div>
      <div class="form-group" style="margin:0"><label class="form-label">行き・帰り</label>
        <select class="form-control" id="duty-way">
          <option>行き</option><option>帰り</option><option>行き・帰り</option>
        </select></div>
      <div class="form-group" style="margin:0"><label class="form-label">担当者名</label>
        <input class="form-control" type="text" id="duty-name" placeholder="例：田中さん"></div>
      <div style="padding-bottom:0">
        <button class="btn btn-primary" onclick="addDuty()" style="height:42px">＋追加</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div class="panel-title" style="margin:0;padding:0;border:none">当番一覧 <span id="duty-count" style="font-size:.78rem;color:var(--ink-muted);font-weight:400"></span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="form-control" id="filter-grade" onchange="renderTable()" style="height:34px;width:auto;font-size:.8rem">
          <option value="">全学年</option>
          <option>1年</option><option>2年</option><option>3年</option><option>4年</option>
          <option>5年</option><option>6年</option><option>全学年</option>
        </select>
      </div>
    </div>
    <div class="duty-table-wrap">
      <table class="duty-table">
        <thead><tr><th>日付</th><th>学年</th><th>行き・帰り</th><th>担当者</th><th></th></tr></thead>
        <tbody id="duty-tbody"></tbody>
      </table>
    </div>
    <div id="duty-empty" class="empty-msg" style="display:none">まだ当番が登録されていません。上のフォームから追加してください。</div>
  </div>

  <div style="text-align:right">
    <button class="btn btn-outline btn-sm" onclick="clearAll()" style="color:var(--red);border-color:rgba(239,68,68,.4)">🗑️ 全件削除</button>
  </div>
</main>
<footer class="site-footer">吉見SMCサッカースポーツ少年団｜スマートポータル</footer>
<script>
const KEY="smc_duty_v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d));}
function addDuty(){
  const date=document.getElementById("duty-date").value;
  const grade=document.getElementById("duty-grade").value;
  const way=document.getElementById("duty-way").value;
  const name=document.getElementById("duty-name").value.trim();
  if(!date){alert("日付を入力してください");return;}
  if(!name){alert("担当者名を入力してください");return;}
  const data=load();
  data.push({id:Date.now(),date,grade,way,name});
  data.sort((a,b)=>a.date.localeCompare(b.date));
  save(data); document.getElementById("duty-name").value=""; renderTable();
}
function deleteDuty(id){
  if(!confirm("この当番を削除しますか？"))return;
  save(load().filter(d=>d.id!==id)); renderTable();
}
function clearAll(){
  if(!confirm("全件削除しますか？この操作は取り消せません。"))return;
  save([]); renderTable();
}
function renderTable(){
  const filter=document.getElementById("filter-grade").value;
  let data=load();
  if(filter) data=data.filter(d=>d.grade===filter||d.grade==="全学年");
  const tbody=document.getElementById("duty-tbody");
  const empty=document.getElementById("duty-empty");
  const count=document.getElementById("duty-count");
  if(!data.length){tbody.innerHTML="";empty.style.display="block";count.textContent="";return;}
  empty.style.display="none"; count.textContent=`（${data.length}件）`;
  const wayColor=w=>w.includes("行き")&&w.includes("帰り")?"badge-gray":w==="行き"?"badge-yellow":"badge-blue";
  tbody.innerHTML=data.map(d=>{
    const ds=d.date?new Date(d.date+"T00:00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}):"—";
    return `<tr>
      <td>${ds}</td>
      <td><span class="grade-badge">${d.grade}</span></td>
      <td><span class="badge ${wayColor(d.way)}">${d.way}</span></td>
      <td>${d.name}</td>
      <td><button class="del-btn" onclick="deleteDuty(${d.id})" title="削除">🗑</button></td>
    </tr>`;
  }).join("");
}
document.getElementById("duty-date").value=new Date().toISOString().slice(0,10);
renderTable();
</script>
</body></html>
