<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チームカレンダー｜吉見SMC FC</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .calendar-embed {
      width: 100%;
      min-height: 500px;
      border: none;
      border-radius: var(--r12);
      overflow: hidden;
      background: var(--gray100);
      display: block;
    }
    .calendar-placeholder {
      min-height: 420px;
      border: 2px dashed var(--gray200);
      border-radius: var(--r12);
      display: grid;
      place-items: center;
      text-align: center;
      gap: 10px;
      padding: 24px;
    }
    .calendar-placeholder p { color: var(--gray600); font-size:.88rem; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">⚽</div>
      <div>
        <span>吉見SMC FC</span>
        <span class="logo-sub">スマートポータル</span>
      </div>
    </a>
    <nav class="header-nav">
      <a href="index.html">ホーム</a>
      <a href="heat.html">熱中症</a>
      <a href="calendar.html" class="active">予定</a>
      <a href="coach.html">コーチ専用</a>
    </nav>
  </div>
</header>

<main class="page-wrap">

  <div class="hero-band">
    <div class="hero-emoji">📅</div>
    <div>
      <div class="hero-title">チームカレンダー</div>
      <div class="hero-sub">練習・試合・イベントの予定を一元管理。Google側で更新すると自動反映されます。</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">チーム予定表</div>
    <!-- ▼ Googleカレンダーのiframe URLをここに貼る ▼ -->
    <!--
    <iframe class="calendar-embed"
      src="https://calendar.google.com/calendar/embed?src=xxxx%40gmail.com&ctz=Asia%2FTokyo"
      frameborder="0" scrolling="no">
    </iframe>
    -->
    <!-- ▲ URLが未設定の場合はプレースホルダーを表示 ▲ -->
    <div class="calendar-placeholder">
      <div style="font-size:2.5rem">📅</div>
      <strong style="font-size:1.1rem;color:var(--navy)">Googleカレンダー 埋め込み予定</strong>
      <p>管理者が公開カレンダーのURLを設定すると、ここにカレンダーが表示されます。<br>
         設定方法：Googleカレンダー → 設定 → 「カレンダーの統合」→ iframeコードのsrc= URLをコピー</p>
      <a class="btn btn-outline" href="https://calendar.google.com/" target="_blank" rel="noopener">
        Googleカレンダーを開く
      </a>
    </div>
  </div>

  <div class="notice-bar">
    📌 予定変更はGoogle側で更新してください。このページに自動で反映されます。
  </div>

</main>

<footer class="site-footer">
  吉見SMCサッカースポーツ少年団｜スマートポータル
</footer>

</body>
</html>
