<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チームカレンダー｜吉見SMC FC</title>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    .page-wrap{max-width:100%!important;padding:10px 12px 40px!important}

    /* ===== ビュー切り替えタブ ===== */
    .view-tab-bar{display:flex;gap:0;border-radius:var(--r8);overflow:hidden;border:1px solid var(--line-2);margin-bottom:14px}
    .view-tab-btn{flex:1;padding:10px 6px;font:inherit;font-size:.82rem;font-weight:900;background:var(--surface-lt);color:#6aaccc;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:5px}
    .view-tab-btn:not(:last-child){border-right:1px solid var(--line-2)}
    .view-tab-btn.active{background:linear-gradient(135deg,#003087,#0050cc);color:#fff}

    /* ===== 凡例 ===== */
    .legend-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r8)}
    .leg{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--ink-3);white-space:nowrap}
    .leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

    /* ===== Googleカレンダー iframe ===== */
    .gcal-wrap{border-radius:var(--r12);overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--shadow)}
    .gcal-wrap iframe{display:block;width:100%;height:calc(100vh - 260px);min-height:480px;border:none}
    @media(max-width:600px){.gcal-wrap iframe{height:72vh;min-height:420px}}

    /* ===== カテゴリ切り替え ===== */
    .cat-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .cat-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line-2);background:none;color:var(--ink-3);font:inherit;font-size:.75rem;font-weight:700;cursor:pointer;transition:.15s}
    .cat-btn.on{color:#fff!important}
    .cat-btn .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

    /* ===== 今日の予定バー ===== */
    .today-notice{background:linear-gradient(135deg,rgba(0,48,135,.35),rgba(0,48,135,.12));border:1px solid rgba(0,212,255,.22);border-radius:var(--r12);padding:12px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:12px}
    .tn-left{flex-shrink:0;text-align:center}
    .tn-date{font-size:2rem;font-weight:900;color:#fff;line-height:1}
    .tn-dow{font-size:.72rem;color:var(--cyan);font-weight:700}
    .tn-right{flex:1;min-width:0}
    .tn-label{font-size:.72rem;color:var(--cyan);font-weight:900;margin-bottom:6px}
    .tn-evt{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#c8e4ff;margin-bottom:4px;line-height:1.4}
    .tn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* ===== ヒント ===== */
    .tip-bar{display:flex;gap:8px;align-items:flex-start;background:rgba(255,204,0,.07);border:1px solid rgba(255,204,0,.2);border-radius:var(--r8);padding:9px 12px;font-size:.78rem;color:#ffe58a;line-height:1.65;margin-top:10px}
    

    /* ===== 今後の予定 ===== */
    .upcoming-head{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
    .upcoming-head .uh-icon{font-size:1.1rem}
    .upcoming-head .uh-text{font-size:.88rem;font-weight:900;color:var(--cyan)}
    .ag-item{display:flex;align-items:center;gap:12px;background:var(--surface-lt);border:1px solid var(--line-2);border-radius:var(--r10);padding:11px 14px;margin-bottom:8px}
    .ag-date{min-width:42px;text-align:center;flex-shrink:0}
    .ag-day{font-size:1.3rem;font-weight:900;color:#fff;line-height:1}
    .ag-dow{font-size:.66rem;color:var(--ink-3);font-weight:700}
    .ag-bar{width:4px;height:34px;border-radius:4px;flex-shrink:0}
    .ag-body{flex:1;min-width:0}
    .ag-title{font-size:.86rem;font-weight:900;color:#fff}
    .ag-meta{font-size:.72rem;color:var(--ink-3);margin-top:1px}
  </style>
</head>
<body>
<header class="site-header"></header>
<main class="page-wrap">
  <a class="back-btn" href="index.html">ホームに戻る</a>
  <div class="hero-band">
    <div class="hero-emoji">📅</div>
    <div>
      <div class="hero-title">チームカレンダー</div>
      <div class="hero-sub">練習・試合・大会・行事の予定。Google側で更新すると自動反映されます。</div>
    </div>
  </div>

  <div id="page-guidance" class="dynamic-notice guidance" style="display:none"><span class="notice-label">📢 INFO</span><span id="guidance-text"></span></div>
  <div id="page-warning"  class="dynamic-notice warning"  style="display:none"><span class="notice-label">⚠️ ALERT</span><span id="warning-text"></span></div>
  <div class="auto-alert alert-rain" id="auto-rain" role="status" aria-live="polite">
    <div class="auto-alert-head">
      <div class="alert-title"><span class="auto-alert-label">自動アラート</span><span>🌧️ 雨の予報</span></div>
      <button onclick="copyAlert('rain')" class="btn-line-copy sm">📋 LINEコピー</button>
    </div>
    <div class="alert-body" id="auto-rain-body"></div>
  </div>
  <div class="auto-alert alert-heat" id="auto-heat" role="status" aria-live="polite">
    <div class="auto-alert-head">
      <div class="alert-title"><span class="auto-alert-label">自動アラート</span><span>🌡️ 熱中症注意</span></div>
      <button onclick="copyAlert('heat')" class="btn-line-copy sm">📋 LINEコピー</button>
    </div>
    <div class="alert-body" id="auto-heat-body"></div>
  </div>

  <!-- 今日の日付表示 -->
  <div class="today-notice">
    <div class="tn-left">
      <div class="tn-date" id="tn-date">--</div>
      <div class="tn-dow" id="tn-dow">---</div>
    </div>
    <div class="tn-right">
      <div class="tn-label">📅 今日の日付</div>
      <div class="tn-evt" id="tn-info">
        <span class="tn-dot" style="background:var(--cyan)"></span>
        <span>Googleカレンダーで予定を確認してください</span>
      </div>
    </div>
  </div>

  <!-- ビュー切り替え -->
  <div class="view-tab-bar">
    <button class="view-tab-btn active" onclick="setView('month',this)">📅 月表示</button>
    <button class="view-tab-btn" onclick="setView('week',this)">📆 週表示</button>
    <button class="view-tab-btn" onclick="setView('agenda',this)">📋 リスト</button>
  </div>

  <!-- 凡例（カテゴリ色） -->
  <div class="legend-bar">
    <span class="leg"><span class="leg-dot" style="background:#222;border:1px solid #666"></span>全体</span>
    <span class="leg"><span class="leg-dot" style="background:#8e24aa"></span>U12</span>
    <span class="leg"><span class="leg-dot" style="background:#d50000"></span>U11</span>
    <span class="leg"><span class="leg-dot" style="background:#f4511e"></span>U10</span>
    <span class="leg"><span class="leg-dot" style="background:#f6c026"></span>U9</span>
    <span class="leg"><span class="leg-dot" style="background:#7cb342"></span>U8</span>
    <span class="leg"><span class="leg-dot" style="background:#0b8043"></span>U7</span>
  </div>

  <!-- Googleカレンダー本体 -->
  <div class="gcal-wrap">
    <iframe id="gcal-iframe"
      src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FTokyo&showPrint=0&showTitle=0&showNav=1&showDate=1&showTabs=0&showCalendars=0&mode=MONTH&src=eW9zaGltaS5zbWMuZmNAZ21haWwuY29t&src=ZmNlZmY4MjEzODJlMTRhYjhjNTA0YTIwZTEyNjI3M2U0ZmM1ODgzYmYzODdhN2FlMzAyNjJjYTZlOGM5ZWMwNUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=YjkwYmQ4MTAwMWNkMDk2MzU1MWM4Y2Q0NGViNTM1MzFkMTU4N2YzYWI4NzU5MzE4ZTgwMjNkYTY1YjdiMDhlZUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=MWU1YTdkN2ZkOTFjYTg0OTg3YjE5ODBhNjU3NmQ3MDM0ZjQzMWU3OTA2N2ZlMmM4ZTFhMzhmZWIwNmZlMjI5MkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=Zjg1OGY0MzMxN2JhYTFmZmIwY2UxMTEwYjAzYzZlY2FjM2JmMTBhNWQ1MzY3NDI0YTBiOWZjNTM4YjUwZWZjZkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=NzNiNzM1YmRlNWI5ZDIyZjI3M2M0ODBlNTcyMTg4NWQ1MWUxOWZlZGFkZTcxZGYwN2M1MjFlOTlmNmQ1M2YzYUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=MDFkMjJiNzA4ZDYzMjA5OGY0NWRkN2JjMWJlMGNhZTg4ZWZmMDBlNGQyZTRiOWYwNzdjOGQ3MGJjY2E0NmRlMEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=Y2NkODMzMGJiM2I2ZWZiOGY5MGEzNmUxNjU1YWMwNDU5ZGRiZTA0NzE1NTMyNTM2N2JiMGZlZGRkMWVhZTgzZEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=amEuamFwYW5lc2UjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%23616161&color=%23f09300&color=%23d50000&color=%238e24aa&color=%230b8043&color=%237cb342&color=%23e4c441&color=%234285f4&color=%23616161"
      frameborder="0" scrolling="no" allowfullscreen></iframe>
  </div>

  <div class="tip-bar">
    💡 <div>予定の追加・変更はコーチ専用フォルダの「Googleカレンダー（編集）」から行ってください。このページに自動で反映されます。<br>
    「週表示」「リスト」に切り替えると時間・場所の詳細が見やすくなります。</div>
  </div>
</main>
<footer class="site-footer"></footer>
<script>
function setNotice(id,textId,val,display){
  var el=document.getElementById(id),tx=document.getElementById(textId);
  if(!el||!tx)return;
  if(val){tx.textContent=val;el.style.display=display||"flex";}else{el.style.display="none";}
}
dbListen("notices/guidance",function(val){setNotice("page-guidance","guidance-text",val);},"smc_guidance",null);
dbListen("notices/warning",function(val){setNotice("page-warning","warning-text",val);},"smc_warning",null);
setNotice("page-guidance","guidance-text",localStorage.getItem("smc_guidance"));
setNotice("page-warning","warning-text",localStorage.getItem("smc_warning"));

// 今日の日付表示
(function(){
  var now = new Date();
  var DAYS = ["日","月","火","水","木","金","土"];
  document.getElementById("tn-date").textContent = now.getDate();
  document.getElementById("tn-dow").textContent = DAYS[now.getDay()]+"曜日";
})();

// ビュー切り替え
var BASE_SRC = "https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FTokyo&showPrint=0&showTitle=0&showNav=1&showDate=1&showTabs=0&showCalendars=0"
  + "&src=eW9zaGltaS5zbWMuZmNAZ21haWwuY29t"
  + "&src=ZmNlZmY4MjEzODJlMTRhYjhjNTA0YTIwZTEyNjI3M2U0ZmM1ODgzYmYzODdhN2FlMzAyNjJjYTZlOGM5ZWMwNUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
  + "&src=YjkwYmQ4MTAwMWNkMDk2MzU1MWM4Y2Q0NGViNTM1MzFkMTU4N2YzYWI4NzU5MzE4ZTgwMjNkYTY1YjdiMDhlZUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"

  + "&src=Zjg1OGY0MzMxN2JhYTFmZmIwY2UxMTEwYjAzYzZlY2FjM2JmMTBhNWQ1MzY3NDI0YTBiOWZjNTM4YjUwZWZjZkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
  + "&src=NzNiNzM1YmRlNWI5ZDIyZjI3M2M0ODBlNTcyMTg4NWQ1MWUxOWZlZGFkZTcxZGYwN2M1MjFlOTlmNmQ1M2YzYUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
  + "&src=MDFkMjJiNzA4ZDYzMjA5OGY0NWRkN2JjMWJlMGNhZTg4ZWZmMDBlNGQyZTRiOWYwNzdjOGQ3MGJjY2E0NmRlMEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
  + "&src=Y2NkODMzMGJiM2I2ZWZiOGY5MGEzNmUxNjU1YWMwNDU5ZGRiZTA0NzE1NTMyNTM2N2JiMGZlZGRkMWVhZTgzZEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
  + "&src=amEuamFwYW5lc2UjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20"
  + "&color=%23616161&color=%23f09300&color=%23d50000&color=%238e24aa&color=%230b8043&color=%237cb342&color=%23e4c441&color=%234285f4&color=%23616161";

var MODE_MAP = {month:"MONTH", week:"WEEK", agenda:"AGENDA"};

function setView(mode, btn){
  document.querySelectorAll(".view-tab-btn").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");
  var iframe = document.getElementById("gcal-iframe");
  iframe.src = BASE_SRC + "&mode=" + MODE_MAP[mode];
  // リスト表示は高さを伸ばす
  iframe.style.height = mode === "agenda" ? "calc(100vh - 200px)" : "";
}



</script>
</body>
</html>
